<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Example App · Brokild Apps</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root {
      --accent: #0f766e;
      --bg: #ffffff; --card: #ffffff; --border: #e3e6e5;
      --text: #16201f; --text-soft: #56605e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #5eead4;
        --bg: #101413; --card: #1a2120; --border: #2c3634;
        --text: #eef3f2; --text-soft: #9fadab;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh;
      display: grid; place-items: center;
      padding: 2rem 1.2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }
    .panel {
      width: min(34rem, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      text-align: center;
    }
    h1 { margin: 0 0 .4rem; font-size: 1.5rem; letter-spacing: -.02em; }
    p { color: var(--text-soft); margin: 0 0 1.4rem; }
    .count {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3rem, 18vw, 5rem);
      font-weight: 800; letter-spacing: -.04em;
      color: var(--accent);
      margin: .4rem 0 1.2rem;
    }
    .row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 600;
      padding: .75rem 1.4rem;
      min-width: 4.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent; color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { button.primary { color: #06201e; } }
    button:active { transform: scale(.97); }
    a.back { display: inline-block; margin-top: 1.4rem; font-size: .88rem; color: var(--accent); }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Example App</h1>
    <p>A working placeholder so the front page has something to link to. Replace it with a real app.</p>
    <div class="count" id="count">0</div>
    <div class="row">
      <button type="button" id="minus">−1</button>
      <button type="button" class="primary" id="plus">+1</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <a class="back" href="../../index.html">← All apps</a>
  </main>
  <script>
    (function () {
      var n = 0;
      var out = document.getElementById("count");
      function set(v) { n = v; out.textContent = n; }
      document.getElementById("plus").addEventListener("click", function () { set(n + 1); });
      document.getElementById("minus").addEventListener("click", function () { set(n - 1); });
      document.getElementById("reset").addEventListener("click", function () { set(0); });
    })();
  </script>
</body>
</html>
