<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two waves</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* An example HTML sim for Interactive Presenter: it fills whatever box it is placed in on the slide. */
  html, body { margin: 0; height: 100%; font: 15px/1.3 system-ui, "Segoe UI", sans-serif; color: #1e293b; background: #fff; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
  .bar label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bar input[type=range] { width: 110px; }
  .bar b { min-width: 3.2em; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 3px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button id="play">Pause</button>
    <label>Wavelength 2 <input id="lam" type="range" min="0.6" max="2" step="0.01" value="1.25"> <b id="lamV"></b></label>
    <label>Phase <input id="ph" type="range" min="0" max="6.283" step="0.01" value="0"> <b id="phV"></b></label>
  </div>
  <canvas id="c"></canvas>
</div>
<script>
// Two waves and their sum. Wave 1 has wavelength 1; wave 2 is set by the slider, so the sum shows beats.
const c = document.getElementById('c'), g = c.getContext('2d');
const lam = document.getElementById('lam'), ph = document.getElementById('ph');
let running = true, t = 0, last = performance.now();
document.getElementById('play').onclick = (e) => { running = !running; e.target.textContent = running ? 'Pause' : 'Play'; };
function size() { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; c.width = Math.max(1, r.width * d); c.height = Math.max(1, r.height * d); g.setTransform(d, 0, 0, d, 0, 0); }
new ResizeObserver(size).observe(c);
function curve(f, y0, amp, color, w) {
  const W = c.clientWidth; g.beginPath();
  for (let x = 0; x <= W; x += 2) { const y = y0 - amp * f(x / W * 6); x ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.strokeStyle = color; g.lineWidth = w; g.stroke();
}
function frame(now) {
  if (running) t += (now - last) / 1000; last = now;
  const W = c.clientWidth, H = c.clientHeight, l2 = +lam.value, p = +ph.value;
  document.getElementById('lamV').textContent = l2.toFixed(2);
  document.getElementById('phV').textContent = (p / Math.PI).toFixed(2) + 'π';
  g.clearRect(0, 0, W, H);
  const k1 = 2 * Math.PI, k2 = 2 * Math.PI / l2, w = 2 * Math.PI * 0.4;
  const a = H * 0.09;
  g.fillStyle = '#64748b'; g.font = '13px system-ui, sans-serif';
  g.fillText('wave 1', 10, H * 0.14); g.fillText('wave 2', 10, H * 0.39); g.fillText('sum', 10, H * 0.66);
  curve((x) => Math.sin(k1 * x - w * t), H * 0.2, a, '#2563eb', 2);
  curve((x) => Math.sin(k2 * x - w * t + p), H * 0.45, a, '#dc2626', 2);
  curve((x) => Math.sin(k1 * x - w * t) + Math.sin(k2 * x - w * t + p), H * 0.78, a, '#0f172a', 2.5);
  requestAnimationFrame(frame);
}
size(); requestAnimationFrame(frame);
</script>
</body>
</html>
