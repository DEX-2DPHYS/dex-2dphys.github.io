<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#990000">
<title>DTU Puzzle</title>
<!--
  DTU Puzzle - a shared jigsaw for one big screen and up to four phones.

  Open it on the big screen with ?screen (or straight from disk) and it shows the
  board, a QR code and the players. Phones that scan the QR code get the same board
  and can drag any piece. Two people on the same piece -> it turns red, beeps and
  stays locked until one of them lets go. A piece dropped close to its place snaps in.

  The big screen is the referee: it decides who holds what, locks and snaps, and
  tells everyone. Messages travel over Supabase Realtime Broadcast (nothing is
  stored in any database). The publishable key below can only use public channels.
-->
<style>
  :root { --red:#990000; --ink:#1f1f1f; --muted:#6b6b6b; --bg:#ffffff; --board:#f4f2ef; --line:#d9d4ce; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  body { -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; touch-action:none; }

  /* ---------- big screen ---------- */
  body.screen #app { display:grid; grid-template-columns: 1fr clamp(250px, 21vw, 360px); height:100vh; }
  body.screen #boardWrap { position:relative; min-width:0; }
  body.screen #board { width:100%; height:100%; }
  #side { border-left:1px solid var(--line); padding:clamp(14px,1.6vw,26px); display:flex; flex-direction:column; gap:clamp(10px,1.4vh,18px); background:#fbfaf8; overflow:hidden; }
  #side h1 { margin:0; font-size:clamp(22px,2vw,34px); letter-spacing:.02em; color:var(--red); line-height:1.05; }
  #side .sub { color:var(--muted); font-size:clamp(12px,.95vw,15px); }
  #qrBox { background:#fff; border:1px solid var(--line); border-radius:12px; padding:clamp(8px,.8vw,14px); text-align:center; }
  #qr { width:100%; height:auto; image-rendering:pixelated; }
  #qrUrl { font-size:clamp(11px,.85vw,14px); color:var(--muted); word-break:break-all; margin-top:6px; }
  #roomCode { font-size:clamp(22px,2.2vw,36px); font-weight:800; letter-spacing:.18em; color:var(--ink); }
  #players { display:flex; flex-direction:column; gap:8px; }
  .pl { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:#fff; border:1px solid var(--line); font-size:clamp(13px,1vw,16px); }
  .pl .dot { width:16px; height:16px; border-radius:50%; flex:none; }
  .pl.empty { color:#aaa; border-style:dashed; }
  .pl .st { margin-left:auto; color:var(--muted); font-size:.85em; }
  #side .row { display:flex; gap:8px; margin-top:auto; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 14px; cursor:pointer; }
  button:hover { border-color:#bbb; }
  button.primary { background:var(--red); color:#fff; border-color:var(--red); }
  #conn { font-size:12px; color:var(--muted); }
  #conn b { font-weight:600; }
  #soundHint { position:absolute; left:16px; bottom:14px; color:var(--muted); font-size:13px; pointer-events:none; }

  /* ---------- phone ---------- */
  body.phone #app { display:flex; flex-direction:column; height:100%; height:100dvh; }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 12px; padding-top:max(8px, env(safe-area-inset-top)); background:var(--red); color:#fff; flex:none; }
  #bar .t { font-weight:800; letter-spacing:.04em; }
  #me { display:flex; align-items:center; gap:6px; margin-left:auto; font-size:14px; }
  #me .dot { width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid #fff; }
  body.phone #boardWrap { position:relative; flex:1; min-height:0; }
  body.phone #board { width:100%; height:100%; }
  #msg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,.96); border:1px solid var(--line);
    border-radius:14px; padding:16px 18px; text-align:center; max-width:86%; box-shadow:0 6px 24px rgba(0,0,0,.12); }
  #msg[hidden] { display:none; }
  #msg input { font:inherit; font-size:22px; letter-spacing:.2em; text-transform:uppercase; width:6.5em; text-align:center; padding:6px; border:1px solid #bbb; border-radius:8px; margin:10px 0; }
  #turn { position:absolute; left:0; right:0; bottom:8px; text-align:center; color:var(--muted); font-size:12px; pointer-events:none; }
  #toast { position:absolute; left:50%; top:12px; transform:translateX(-50%); background:#222; color:#fff; padding:7px 12px; border-radius:18px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  #toast.on { opacity:.92; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="bar" hidden><span class="t">DTU PUZZLE</span><span id="roomTag"></span><span id="me"><span class="dot"></span><span id="meTxt">connecting…</span></span></div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="msg" hidden></div>
    <div id="turn" hidden>Turn your phone sideways for bigger pieces</div>
    <div id="toast"></div>
    <div id="soundHint" hidden>Click anywhere once to switch the beep on</div>
  </div>
  <aside id="side" hidden>
    <div><h1>DTU PUZZLE</h1><div class="sub">Scan to join &middot; up to four players</div></div>
    <div id="qrBox"><canvas id="qr"></canvas><div id="qrUrl"></div></div>
    <div>Room <span id="roomCode"></span></div>
    <div id="players"></div>
    <div id="conn">Connecting…</div>
    <div class="row"><button id="shuffleBtn" class="primary">Shuffle</button><button id="fsBtn">Full screen</button></div>
  </aside>
</div>

<script>

//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {

        if (c < 128) {
          bytes.push(c);

  function reduce(m) {
    const ev = [];
    const p = pieces[m.k];
    if (m.t === "grab") {
      if (!p || p.placed || !isPlayer(m.id)) return ev;
      pieces.forEach(q => { if (q !== p && q.holders.includes(m.id)) ev.push(...reduce({ t: "rel", id: m.id, k: q.k, x: q.x, y: q.y })); });
      if (!p.holders.includes(m.id)) {
        p.holders.push(m.id);
        if (p.holders.length === 2) { p.contestT = performance.now(); ev.push({ e: "contest", k: p.k, ids: p.holders.slice() }); }
      }
      toTop(p.k);
      if (!startT) startT = Date.now();
    } else if (m.t === "mv") {
      if (!p || p.placed || p.holders.length !== 1 || p.holders[0] !== m.id) return ev;
      p.x = clampX(m.x); p.y = clampY(m.y);
    } else if (m.t === "rel") {
      if (!p || !p.holders.includes(m.id)) return ev;
      const sole = p.holders.length === 1;
      if (sole && typeof m.x === "number") { p.x = clampX(m.x); p.y = clampY(m.y); }
      p.holders = p.holders.filter(id => id !== m.id);
      if (sole && !p.placed && Math.abs(p.x - p.tx) < SNAP && Math.abs(p.y - p.ty) < SNAP) {
        p.x = p.tx; p.y = p.ty; p.placed = true; p.flash = performance.now();
        zOrder = zOrder.filter(j => j !== p.k); zOrder.unshift(p.k);
        ev.push({ e: "snap", k: p.k });
        if (allPlaced()) { doneT = Date.now(); ev.push({ e: "done" }); }
      } else if (p.holders.length === 1) ev.push({ e: "unlock", k: p.k });
    }
    return ev;
  }

  function packState() {
    return { t: "state", seq: ++lastSeq, room: ROOM,
      pieces: pieces.map(p => [+p.x.toFixed(4), +p.y.toFixed(4), p.placed ? 1 : 0, p.holders]),
      z: zOrder, players: players.map(p => [p.id, p.slot]), startT, doneT, now: Date.now() };
  }
  function applyState(s) {
    if (s.seq < lastSeq && s.seq > 3) return;          // an old one overtaken by a newer
    lastSeq = s.seq;
    const before = pieces.map(p => p.holders.length >= 2 && p.holders.includes(MY_ID));
    players = s.players.map(([id, slot]) => ({ id, slot, seen: 0 }));
    s.pieces.forEach(([x, y, placed, holders], k) => {
      const p = pieces[k];
      const wasPlaced = p.placed;
      p.placed = !!placed; p.holders = holders;
      if (p.placed && !wasPlaced) p.flash = performance.now();
      const mine = drag && drag.k === k && holders.length === 1 && holders[0] === MY_ID;
      if (!mine) { p.x = x; p.y = y; }
      if (!p.placed && !wasPlaced && lastApplied === 0) { p.dx = x; p.dy = y; }
    });
    if (lastApplied === 0) pieces.forEach(p => { p.dx = p.x; p.dy = p.y; });
    zOrder = s.z; startT = s.startT; doneT = s.doneT;
    pieces.forEach((p, k) => {
      const now = p.holders.length >= 2 && p.holders.includes(MY_ID);
      if (now && !before[k]) { p.contestT = performance.now(); beep(); buzz(); }
      if (p.holders.length >= 2 && !p.contestT) p.contestT = performance.now();
    });
    if (drag && !pieces[drag.k].holders.includes(MY_ID) && lastApplied > 0) drag = null;  // the referee said no
    lastApplied = performance.now();
    updateMe();
  }
  let lastApplied = 0;

  // ------------------------------------------------------------------ realtime (Supabase, Phoenix protocol)
  function Realtime(topic, onMsg, onStatus) {
    const url = `wss://${SUPA_REF}.supabase.co/realtime/v1/websocket?apikey=${SUPA_KEY}&vsn=1.0.0`;
    let ws = null, ref = 0, joinRef = null, live = false, hb = 0, backoff = 500, queue = [];
    const T = "realtime:" + topic;
    function connect() {
      onStatus("connecting");
      try { ws = new WebSocket(url); } catch (e) { return retry(); }
      ws.onopen = () => {
        joinRef = String(++ref);
        ws.send(JSON.stringify({ topic: T, event: "phx_join", ref: joinRef, join_ref: joinRef,
          payload: { config: { broadcast: { self: false, ack: false }, presence: { key: "" }, private: false } } }));
      };
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; }
        if (m.event === "phx_reply" && m.ref === joinRef) {
          if (m.payload && m.payload.status === "ok") {
            live = true; backoff = 500; onStatus("live");
            const q = queue; queue = []; q.forEach(send);
            clearInterval(hb);
            hb = setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++ref) })); }, 25000);
          } else { onStatus("refused"); ws.close(); }
        } else if (m.event === "broadcast" && m.payload) {
          onMsg(m.payload.payload);
        } else if (m.event === "phx_error" || m.event === "phx_close") { try { ws.close(); } catch (_) {} }
      };
      ws.onclose = () => { live = false; clearInterval(hb); retry(); };
      ws.onerror = () => {};
    }
    function retry() { onStatus("reconnecting"); setTimeout(connect, backoff); backoff = Math.min(8000, backoff * 1.7); }
    function send(obj) {
      if (!live || !ws || ws.readyState !== 1) {
        if (obj.t === "mv") queue = queue.filter(q => !(q.t === "mv" && q.k === obj.k));
        queue.push(obj); if (queue.length > 60) queue.shift(); return;
      }
      ws.send(JSON.stringify({ topic: T, event: "broadcast", ref: String(++ref), join_ref: joinRef,
        payload: { type: "broadcast", event: "m", payload: obj } }));
    }
    connect();
    return { send, get live() { return live; } };
  }

  // ------------------------------------------------------------------ sound
  let actx = null;
  function audioOn() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) {}
    const h = document.getElementById("soundHint"); if (h) h.hidden = true;
  }
  function beep() {
    if (!actx || actx.state !== "running") return;
    const t = actx.currentTime;
    [0, 0.16].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = i ? 660 : 880;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.18, t + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.13);
      o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + 0.15);
    });
  }
  function chime() {
    if (!actx || actx.state !== "running") return;
    const t = actx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * .12); g.gain.exponentialRampToValueAtTime(0.2, t + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * .12 + .6);
      o.connect(g).connect(actx.destination); o.start(t + i * .12); o.stop(t + i * .12 + .65);
    });
  }
  function click() {
    if (!actx || actx.state !== "running") return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(1200, t); o.frequency.exponentialRampToValueAtTime(500, t + .06);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .08);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .09);
  }
  const buzz = () => { try { navigator.vibrate && navigator.vibrate([90, 50, 90]); } catch (e) {} };

  // one jigsaw edge from (x0,y0) to (x1,y1); s = +1 knob out, -1 knob in, 0 straight
  function edge(pth, x0, y0, x1, y1, s, U) {
    if (!s) { pth.lineTo(x1 * U, y1 * U); return; }
    const L = Math.hypot(x1 - x0, y1 - y0), dx = (x1 - x0) / L, dy = (y1 - y0) / L, nx = dy, ny = -dx;
    const P = (a, b) => [(x0 + dx * (L / 2 + a * TAB) + nx * s * b * TAB) * U, (y0 + dy * (L / 2 + a * TAB) + ny * s * b * TAB) * U];
    const seg = [[-0.6, 0], [-0.25, 0, -0.15, 0.35, -0.35, 0.6], [-0.6, 0.95, -0.3, 1.3, 0, 1.3],
                 [0.3, 1.3, 0.6, 0.95, 0.35, 0.6], [0.15, 0.35, 0.25, 0, 0.6, 0]];
    pth.lineTo(...P(seg[0][0], seg[0][1]));
    for (let i = 1; i < seg.length; i++) { const q = seg[i]; pth.bezierCurveTo(...P(q[0], q[1]), ...P(q[2], q[3]), ...P(q[4], q[5])); }
    pth.lineTo(x1 * U, y1 * U);
  }
  // path of a piece in its own frame (0,0 = top-left of its rectangle), scaled by U
  function piecePath(p, U) {
    const pth = new Path2D();
    const top = p.r === 0 ? 0 : -H_TAB[p.r - 1][p.c];
    const bot = p.r === ROWS - 1 ? 0 : H_TAB[p.r][p.c];
    const lef = p.c === 0 ? 0 : -V_TAB[p.r][p.c - 1];
    const rig = p.c === COLS - 1 ? 0 : V_TAB[p.r][p.c];
    pth.moveTo(0, 0);
    edge(pth, 0, 0, pw, 0, top, U);
    edge(pth, pw, 0, pw, ph, rig, U);
    edge(pth, pw, ph, 0, ph, bot, U);
    edge(pth, 0, ph, 0, 0, lef, U);
    pth.closePath();
    return pth;
  }
  const HIT_U = 1000;
  pieces.forEach(p => { p.hit = piecePath(p, HIT_U); });
  const hitCtx = document.createElement("canvas").getContext("2d");

  // ------------------------------------------------------------------ canvas and layout
  const cv = document.getElementById("board"), ctx = cv.getContext("2d");
  let S = 100, OX = 0, OY = 0, dpr = 1, cssW = 0, cssH = 0;
  function layout() {
    const r = cv.getBoundingClientRect();
    cssW = r.width; cssH = r.height; dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    const m = ROLE === "screen" ? 0.03 : 0.01;
    S = Math.min(cssW * (1 - 2 * m) / W, cssH * (1 - 2 * m) / H);
    OX = (cssW - W * S) / 2; OY = (cssH - H * S) / 2;
    renderPieces();
    const turn = document.getElementById("turn");
    if (turn) turn.hidden = !(ROLE === "phone" && cssH > cssW * 1.1);
  }
  function renderPieces() {
    if (!img.complete || !img.naturalWidth) return;
    const pad = TABH + 0.01, U = S * dpr;
    pieces.forEach(p => {
      const c = p.sprite || (p.sprite = document.createElement("canvas"));
      c.width = Math.ceil((pw + 2 * pad) * U); c.height = Math.ceil((ph + 2 * pad) * U);
      const g = c.getContext("2d");
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
      g.translate(pad * U, pad * U);
      const path = piecePath(p, U);
      g.save(); g.clip(path);
      g.drawImage(img, -(p.c * pw) * U, -(p.r * ph) * U, PW * U, PH * U);
      // a little relief: light from the top-left
      g.lineWidth = Math.max(2, U * 0.006);
      g.translate(-g.lineWidth * .35, -g.lineWidth * .35); g.strokeStyle = "rgba(255,255,255,.55)"; g.stroke(path);
      g.translate(g.lineWidth * .7, g.lineWidth * .7); g.strokeStyle = "rgba(0,0,0,.35)"; g.stroke(path);
      g.restore();
      g.lineWidth = Math.max(1, U * 0.002); g.strokeStyle = "rgba(0,0,0,.45)"; g.stroke(path);
      p.pad = pad; p.path = path;
    });
  }
  img.onload = () => { renderPieces(); };
  window.addEventListener("resize", layout);

  const toWorld = (cx, cy) => ({ x: (cx - OX) / S, y: (cy - OY) / S });
  function pieceAt(wx, wy) {
    for (let i = zOrder.length - 1; i >= 0; i--) {
      const p = pieces[zOrder[i]];
      if (p.placed) continue;
      const lx = (wx - (p.dx - pw / 2)) * HIT_U, ly = (wy - (p.dy - ph / 2)) * HIT_U;
      if (hitCtx.isPointInPath(p.hit, lx, ly)) return p;
    }
    return null;
  }

  // ------------------------------------------------------------------ drawing
  let confetti = [];
  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    // table
    ctx.fillStyle = "#fbfaf8"; ctx.fillRect(OX, OY, W * S, H * S);
    // frame with a faint ghost of the picture and the 3x3 grid
    const fx = OX + FX * S, fy = OY + FY * S;
    ctx.fillStyle = "#ece8e3"; ctx.fillRect(fx, fy, PW * S, PH * S);
    if (img.complete && img.naturalWidth) { ctx.globalAlpha = 0.13; ctx.drawImage(img, fx, fy, PW * S, PH * S); ctx.globalAlpha = 1; }
    ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
    for (let i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(fx + i * pw * S, fy); ctx.lineTo(fx + i * pw * S, fy + PH * S); ctx.stroke(); }
    for (let i = 1; i < ROWS; i++) { ctx.beginPath(); ctx.moveTo(fx, fy + i * ph * S); ctx.lineTo(fx + PW * S, fy + i * ph * S); ctx.stroke(); }
    ctx.setLineDash([]); ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.strokeRect(fx, fy, PW * S, PH * S);

    const done = allPlaced();
    for (const k of zOrder) {
      const p = pieces[k];
      if (!p.sprite || !p.path) continue;
      const held = p.holders.length > 0, locked = p.holders.length >= 2;
      const sx = OX + (p.dx - pw / 2) * S, sy = OY + (p.dy - ph / 2) * S;
      const shake = locked ? Math.sin(now / 28) * 2 : 0;
      ctx.save();
      ctx.translate(sx + shake, sy);
      if (!p.placed) {
        ctx.shadowColor = "rgba(0,0,0," + (held ? .38 : .22) + ")";
        ctx.shadowBlur = held ? 18 : 6; ctx.shadowOffsetY = held ? 8 : 2;
      }
      const sc = held ? 1.03 : 1;
      if (sc !== 1) { ctx.translate(pw * S / 2, ph * S / 2); ctx.scale(sc, sc); ctx.translate(-pw * S / 2, -ph * S / 2); }
      ctx.drawImage(p.sprite, -p.pad * S, -p.pad * S, p.sprite.width / dpr, p.sprite.height / dpr);
      ctx.shadowColor = "transparent";
      ctx.scale(1 / dpr, 1 / dpr);          // the stored path is in device pixels
      if (locked) {
        const a = 0.35 + 0.2 * Math.sin(now / 90);
        ctx.fillStyle = `rgba(220,20,20,${a})`; ctx.fill(p.path);
        ctx.lineWidth = 5 * dpr; ctx.strokeStyle = "#d40000"; ctx.stroke(p.path);
      } else if (held) {
        const s = slotOf(p.holders[0]);
        ctx.lineWidth = 4.5 * dpr; ctx.strokeStyle = s >= 0 ? COLORS[s] : "#555"; ctx.stroke(p.path);
      }
      if (p.flash && now - p.flash < 700 && !done) {
        const a = 1 - (now - p.flash) / 700;
        ctx.lineWidth = 7 * dpr; ctx.strokeStyle = `rgba(40,200,90,${a})`; ctx.stroke(p.path);
        ctx.fillStyle = `rgba(255,255,255,${a * .35})`; ctx.fill(p.path);
      }
      ctx.restore();
      // who is holding it
      if (held && !p.placed) {
        const ids = p.holders.slice(0, 4);
        ids.forEach((id, i) => {
          const s = slotOf(id); if (s < 0) return;
          const cx = sx + pw * S * 0.5 + (i - (ids.length - 1) / 2) * 22, cy = sy - 6;
          ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2);
          ctx.fillStyle = COLORS[s]; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
        });
      }
    }
    if (done) {
      // the finished picture, seamless, and a banner
      if (img.complete) ctx.drawImage(img, fx, fy, PW * S, PH * S);
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1; ctx.strokeRect(fx, fy, PW * S, PH * S);
      const secs = doneT && startT ? Math.max(0, Math.round((doneT - startT) / 1000)) : 0;
      const txt = "Solved!" + (secs ? "  " + Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") : "");
      const fs = Math.max(18, S * 0.07);
      ctx.font = `800 ${fs}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const tw = ctx.measureText(txt).width + fs * 1.2;
      const bx = OX + W * S / 2, by = OY + (FY + PH) * S + (H - FY - PH) * S / 2;
      ctx.fillStyle = "#990000"; roundRect(bx - tw / 2, by - fs * .8, tw, fs * 1.6, fs * .5); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillText(txt, bx, by + fs * .04);
    }
    // confetti
    confetti = confetti.filter(c => now - c.t0 < c.life);
    for (const c of confetti) {
      const t = (now - c.t0) / 1000;
      const x = c.x + c.vx * t, y = c.y + c.vy * t + 380 * t * t;
      ctx.save(); ctx.translate(x, y); ctx.rotate(c.rot + t * c.spin);
      ctx.fillStyle = c.col; ctx.globalAlpha = Math.max(0, 1 - (now - c.t0) / c.life);
      ctx.fillRect(-4, -2, 8, 4); ctx.restore();
    }
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function celebrate() {
    const now = performance.now(), cols = ["#990000", "#1e6fd9", "#f08a00", "#16a34a", "#8b3fd1", "#ffcc00"];
    for (let i = 0; i < 160; i++) confetti.push({ t0: now + Math.random() * 400, life: 2200 + Math.random() * 1200,
      x: OX + W * S * Math.random(), y: OY - 10, vx: (Math.random() - .5) * 140, vy: 80 + Math.random() * 160,
      rot: Math.random() * 6, spin: (Math.random() - .5) * 10, col: cols[i % cols.length] });
  }

  let lastFrame = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
    const a = 1 - Math.exp(-dt * 18);
    pieces.forEach(p => {
      const mine = drag && drag.k === p.k;
      if (mine) { p.dx = p.x; p.dy = p.y; }
      else { p.dx += (p.x - p.dx) * a; p.dy += (p.y - p.dy) * a; }
    });
    draw(now);
    requestAnimationFrame(loop);
  }

  // ------------------------------------------------------------------ events from the network
  function handleEvents(ev) {
    for (const e of ev) {
      if (e.e === "contest") {
        if (ROLE === "screen" || e.ids.includes(MY_ID)) { beep(); if (ROLE === "phone") buzz(); }
      } else if (e.e === "snap") { click(); }
      else if (e.e === "done") { chime(); celebrate(); }
    }
  }

  let rt = null;
  function onMsg(m) {
    if (!m || typeof m !== "object") return;
    if (ROLE === "screen") {
      if (m.t === "hello") {
        const pl = players.find(p => p.id === m.id);
        if (pl) pl.seen = Date.now();
        else if (players.length < MAX_PLAYERS) {
          const used = players.map(p => p.slot); let slot = 0; while (used.includes(slot)) slot++;
          players.push({ id: m.id, slot, seen: Date.now() }); dirty = true; renderPlayers();
        } else dirty = true;               // tell the latecomer the room is full
      } else if (m.t === "grab" || m.t === "rel") {
        const ev = reduce(m); handleEvents(ev); dirty = true; renderPlayers();
      } else if (m.t === "mv") {
        reduce(m);
      } else if (m.t === "bye") {
        dropPlayer(m.id);
      }
    } else {
      if (m.t === "state") {
        const wasDone = allPlaced() && lastApplied > 0;
        const snappedBefore = pieces.map(p => p.placed);
        applyState(m);
        pieces.forEach((p, k) => { if (p.placed && !snappedBefore[k] && lastApplied) click(); });
        if (allPlaced() && !wasDone && m.doneT) { chime(); celebrate(); }
        screenSeen = Date.now(); showWaiting();
      } else if (m.t === "mv" && m.id !== MY_ID) {
        reduce(m);
      } else if ((m.t === "grab" || m.t === "rel") && m.id !== MY_ID) {
        handleEvents(reduce(m));
      }
    }
  }

  // ------------------------------------------------------------------ screen role
  let dirty = true;
  function dropPlayer(id) {
    const i = players.findIndex(p => p.id === id); if (i < 0) return;
    pieces.forEach(p => { if (p.holders.includes(id)) handleEvents(reduce({ t: "rel", id, k: p.k })); });
    players.splice(i, 1); dirty = true; renderPlayers();
  }
  function renderPlayers() {
    const box = document.getElementById("players"); if (!box) return;
    let html = "";
    for (let s = 0; s < MAX_PLAYERS; s++) {
      const pl = players.find(p => p.slot === s);
      if (pl) {
        const held = pieces.find(p => p.holders.includes(pl.id));
        const st = held ? (held.holders.length > 1 ? "locked!" : "moving a piece") : "";
        html += `<div class="pl"><span class="dot" style="background:${COLORS[s]}"></span>${NAMES[s]}<span class="st">${st}</span></div>`;
      } else html += `<div class="pl empty"><span class="dot" style="background:#e5e5e5"></span>Player ${s + 1} &ndash; scan to join</div>`;
    }
    box.innerHTML = html;
  }
  function drawQR() {
    const url = APP_URL + "?room=" + ROOM;
    const q = qrcode(0, "M"); q.addData(url); q.make();
    const n = q.getModuleCount(), quiet = 2, cell = 8, c = document.getElementById("qr");
    c.width = c.height = (n + 2 * quiet) * cell;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#111";
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
    document.getElementById("qrUrl").textContent = url.replace("https://", "");
    document.getElementById("roomCode").textContent = ROOM;
  }
  function startScreen() {
    document.getElementById("side").hidden = false;
    const hint = document.getElementById("soundHint"); hint.hidden = false;
    window.addEventListener("pointerdown", audioOn);
    window.addEventListener("keydown", audioOn);
    scatter(); drawQR(); renderPlayers();
    rt = Realtime("dtu-puzzle-" + ROOM, onMsg, st => {
      document.getElementById("conn").innerHTML = st === "live" ? "Connected &middot; <b>live</b>" : "Connection: " + st + "…";
      if (st === "live") dirty = true;
    });
    // tell everyone the state after each change, and every 1.5 s regardless
    let lastSent = 0;
    setInterval(() => {
      const now = Date.now();
      players.slice().forEach(p => { if (now - p.seen > 7000) dropPlayer(p.id); });
      if (dirty || now - lastSent > 1500) { rt.send(packState()); dirty = false; lastSent = now; }
    }, 60);
    document.getElementById("shuffleBtn").onclick = () => { audioOn(); scatter(); dirty = true; renderPlayers(); };
    document.getElementById("fsBtn").onclick = () => { audioOn(); (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); };
  }

  // ------------------------------------------------------------------ phone role
  let drag = null, screenSeen = 0, lastMv = 0;
  function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1600); }
  function updateMe() {
    if (ROLE !== "phone") return;
    const s = slotOf(MY_ID), dot = document.querySelector("#me .dot"), t = document.getElementById("meTxt");
    if (s >= 0) { dot.style.background = COLORS[s]; t.textContent = "You are " + NAMES[s]; }
    else if (players.length >= MAX_PLAYERS) { dot.style.background = "transparent"; t.textContent = "Room full – watching"; }
    else { dot.style.background = "transparent"; t.textContent = "joining…"; }
  }
  function showWaiting() {
    const msg = document.getElementById("msg");
    if (!ROOM) return;
    if (!screenSeen || Date.now() - screenSeen > 5000) {
      msg.hidden = false;
      msg.innerHTML = `<b>Waiting for the big screen…</b><br><span style="color:#6b6b6b">Room ${ROOM}</span>`;
    } else msg.hidden = true;
  }
  function askRoom() {
    const msg = document.getElementById("msg");
    msg.hidden = false;
    msg.innerHTML = `<b>Enter the room code</b><br>shown on the big screen<br><input id="roomIn" maxlength="8" autocomplete="off" autocapitalize="characters"><br><button class="primary" id="roomGo">Join</button>`;
    const go = () => { const v = document.getElementById("roomIn").value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (v) location.search = "?room=" + v; };
    document.getElementById("roomGo").onclick = go;
    document.getElementById("roomIn").onkeydown = (e) => { if (e.key === "Enter") go(); };
  }
  function startPhone() {
    document.getElementById("bar").hidden = false;
    if (!ROOM) { askRoom(); return; }
    document.getElementById("roomTag").textContent = "room " + ROOM;
    rt = Realtime("dtu-puzzle-" + ROOM, onMsg, st => { if (st !== "live") document.getElementById("meTxt").textContent = st + "…"; else updateMe(); });
    const hello = () => rt.send({ t: "hello", id: MY_ID });
    hello(); setInterval(hello, 2000); setInterval(showWaiting, 1000); showWaiting();
    window.addEventListener("pagehide", () => rt.send({ t: "bye", id: MY_ID }));

    cv.addEventListener("pointerdown", (e) => {
      audioOn();
      if (drag) return;
      const w = toWorld(e.clientX - cv.getBoundingClientRect().left, e.clientY - cv.getBoundingClientRect().top);
      const p = pieceAt(w.x, w.y);
      if (!p) return;
      if (!isPlayer(MY_ID)) { toast(players.length >= MAX_PLAYERS ? "The room is full – you are watching" : "Still joining…"); return; }
      drag = { k: p.k, ox: w.x - p.x, oy: w.y - p.y, pid: e.pointerId, stale: false };
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      const m = { t: "grab", id: MY_ID, k: p.k };
      handleEvents(reduce(m)); rt.send(m);
      e.preventDefault();
    });
    cv.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.pid) return;
      const p = pieces[drag.k];
      const w = toWorld(e.clientX - cv.getBoundingClientRect().left, e.clientY - cv.getBoundingClientRect().top);
      const mineAlone = p.holders.length === 1 && p.holders[0] === MY_ID;
      if (!mineAlone) { drag.stale = true; return; }                  // locked: the piece does not move
      if (drag.stale) { drag.ox = w.x - p.x; drag.oy = w.y - p.y; drag.stale = false; }  // pick up where it is
      p.x = clampX(w.x - drag.ox); p.y = clampY(w.y - drag.oy);
      const now = performance.now();
      if (now - lastMv > 80) { lastMv = now; rt.send({ t: "mv", id: MY_ID, k: p.k, x: +p.x.toFixed(4), y: +p.y.toFixed(4) }); }
      e.preventDefault();
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.pid) return;
      const p = pieces[drag.k];
      const m = { t: "rel", id: MY_ID, k: p.k, x: +p.x.toFixed(4), y: +p.y.toFixed(4) };
      drag = null;
      handleEvents(reduce(m)); rt.send(m);
    };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
  }

  // ------------------------------------------------------------------ go
  layout();
  if (ROLE === "screen") startScreen(); else { scatter(); startPhone(); }
  requestAnimationFrame(loop);
  updateMe();

  // debug / test hook
  window.__PZ = {
    role: ROLE, room: ROOM, id: MY_ID,
    pieces: () => pieces.map(p => ({ k: p.k, x: +p.x.toFixed(3), y: +p.y.toFixed(3), tx: +p.tx.toFixed(3), ty: +p.ty.toFixed(3), placed: p.placed, holders: p.holders.slice() })),
    players: () => players.map(p => ({ id: p.id, slot: p.slot })),
    worldToClient: (x, y) => { const r = cv.getBoundingClientRect(); return { x: r.left + OX + x * S, y: r.top + OY + y * S }; },
    live: () => !!(rt && rt.live), shuffle: () => { if (ROLE === "screen") { scatter(); dirty = true; } }
  };
})();
</script>
</body>
</html>
