<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>GRØNT LYS · dit anlæg</title>
<!--
  GRØNT LYS (Green Light) - TELEFONEN.
  You run one part of the Danish power grid shown on the big screen. Drag the
  bar (or use the buttons) to set your target; your plant gets there at its own
  speed. Keep the frequency at 50 Hz together - on as much green power as possible.
  Open with ?room=XXXX (the QR code on the big screen does this).
-->
<style>
  :root { --green:#15803d; --ink:#14201a; --muted:#5b6b62; --role:#b45309; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#f1f5f2; color:var(--ink); font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  body { -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #app { display:flex; flex-direction:column; height:100%; height:100dvh; }
  #bar { display:flex; align-items:center; gap:.6em; padding:.6em .9em; padding-top:max(.6em, env(safe-area-inset-top)); background:var(--green); color:#fff; flex:none; }
  #bar b { letter-spacing:.05em; }
  #bar span { opacity:.85; font-size:.9em; }
  #dot { margin-left:auto; width:.7em; height:.7em; border-radius:50%; background:#fca5a5; }
  #dot.live { background:#bbf7d0; }
  #body { flex:1; min-height:0; display:flex; flex-direction:column; gap:.6em; padding:.7em; }
  .card { background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  #role { display:flex; align-items:center; gap:.8em; padding:.65em .9em; border-left:8px solid var(--role); flex:none; }
  #role canvas { width:2.8em; height:2.8em; flex:none; }
  #role .t b { display:block; font-size:1.18em; }
  #role .t span { color:var(--muted); font-size:.88em; }
  #freq { display:flex; align-items:center; gap:.7em; padding:.5em .9em; flex:none; }
  #mini { width:7.5em; height:4.2em; flex:none; }
  #freq .fv { font-size:1.9em; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  #freq .fv small { font-size:.45em; color:var(--muted); font-weight:700; }
  #advice { font-weight:700; margin-top:.2em; font-size:.95em; }
  #advice.ok { color:#15803d; } #advice.warn { color:#b45309; } #advice.bad { color:#b91c1c; }
  #ctl { flex:1; min-height:0; display:flex; gap:.7em; padding:.7em; }
  #track { flex:1; position:relative; border-radius:14px; background:#eef2ef; overflow:hidden; touch-action:none; cursor:ns-resize; min-height:8em; }
  #fill { position:absolute; left:0; right:0; bottom:0; background:var(--role); opacity:.85; }
  #avail { position:absolute; left:0; right:0; border-top:3px dashed #0f172a; opacity:.55; display:none; }
  #zero { position:absolute; left:0; right:0; top:50%; border-top:2px solid #94a3b8; display:none; }
  #handle { position:absolute; left:-4px; right:-4px; height:0; border-top:4px solid var(--ink); }
  #handle::after { content:""; position:absolute; right:10px; top:-15px; width:26px; height:26px; border-radius:50%; background:#fff; border:4px solid var(--ink); }
  #tlabel { position:absolute; left:.6em; top:.5em; font-size:.8em; color:var(--muted); font-weight:700; }
  #blabel { position:absolute; left:.6em; bottom:.5em; font-size:.8em; color:#fff; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.45); }
  #side { width:8.4em; display:flex; flex-direction:column; gap:.5em; }
  .num { background:#f6f9f7; border-radius:12px; padding:.45em .6em; }
  .num span { display:block; font-size:.75em; color:var(--muted); }
  .num b { font-size:1.25em; font-variant-numeric:tabular-nums; }
  #soc { display:none; }
  #soc .gauge { height:.6em; border-radius:4px; background:#e5e7eb; overflow:hidden; margin-top:.3em; }
  #soc .gauge i { display:block; height:100%; background:#c026d3; }
  #side button { flex:1; border:none; border-radius:14px; font-size:1.15em; font-weight:800; color:#fff; min-height:2.6em; }
  #more { background:#15803d; } #less { background:#475569; }
  #side button:active { filter:brightness(.85); }
  #foot { display:flex; justify-content:space-between; color:var(--muted); font-size:.85em; padding:0 .3em calc(.2em + env(safe-area-inset-bottom)); flex:none; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:1.5em; z-index:10; }
  .overlay[hidden] { display:none; }
  .msg { background:rgba(241,245,242,.96); }
  .msg .box { background:#fff; border-radius:18px; padding:1.4em; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.12); max-width:22em; }
  .msg h2 { margin:.1em 0 .3em; color:var(--green); }
  .msg input { font:inherit; font-size:1.6em; letter-spacing:.2em; text-transform:uppercase; width:6em; text-align:center; padding:.2em; border:2px solid #d4d4d8; border-radius:10px; margin:.5em 0; }
  .msg button { font:inherit; font-weight:700; background:var(--green); color:#fff; border:none; border-radius:12px; padding:.6em 1.6em; }
  #black { background:#050505; color:#fff; flex-direction:column; text-align:center; }
  #black b { font-size:2.6em; letter-spacing:.06em; }
  #trip { position:fixed; left:.7em; right:.7em; top:4.2em; background:#b91c1c; color:#fff; border-radius:14px; padding:.8em 1em; font-weight:700; text-align:center; z-index:9; }
  #trip[hidden] { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="bar"><b>GRØNT LYS</b><span id="roomTag"></span><i id="dot"></i></div>
  <div id="body">
    <div class="card" id="role"><canvas id="icon"></canvas>
      <div class="t"><b id="roleName">Deltager…</b><span id="roleTip">venter på storskærmen</span></div></div>
    <div class="card" id="freq"><canvas id="mini"></canvas>
      <div><div class="fv" id="fv">50,00<small> Hz</small></div><div id="advice" class="ok">I balance – hold den</div></div></div>
    <div class="card" id="ctl">
      <div id="track"><div id="fill"></div><div id="zero"></div><div id="avail"></div><div id="handle"></div>
        <span id="tlabel">MAKS</span><span id="blabel">SLUK</span></div>
      <div id="side">
        <div class="num"><span id="nowLbl">Producerer nu</span><b id="now">0 MW</b></div>
        <div class="num"><span>Dit mål</span><b id="tgt">0 %</b></div>
        <div class="num" id="soc"><span>Batteriets ladning</span><b id="socv">60 %</b><div class="gauge"><i id="socbar"></i></div></div>
        <button id="more">▲ Mere</button>
        <button id="less">▼ Mindre</button>
      </div>
    </div>
    <div id="foot"><span id="clock">--:--</span><span id="scn"></span></div>
  </div>
</div>
<div class="overlay msg" id="wait" hidden><div class="box" id="waitBox"></div></div>
<div class="overlay" id="black" hidden><b>BLACKOUT</b><div style="opacity:.7;margin-top:.5em">Nettet brød sammen. Strømmen genoprettes…</div></div>
<div id="trip" hidden></div>

<script>
(function () {
"use strict";
const SUPA_REF = "waktaohjndbhswareqzk";
const SUPA_KEY = "sb_publishable_w3U495HfA5hOYZrMUETBpA_uyX7EIgg";
// SAME order as the big screen
const ROLES = ["bio", "gas", "wind", "sun", "link", "battery", "p2x"];
const RI = {
  bio:     { name:"Kraftvarmeværk",  color:"#b45309", kind:"dispatch", tip:"Biomasse (træpiller og halm). Grøn og stabil – men LANGSOM at skrue op og ned." },
  gas:     { name:"Gasturbine",      color:"#6b7280", kind:"dispatch", tip:"Reagerer hurtigt – men den er dyr og fossil. Hver MWh udleder CO₂." },
  wind:    { name:"Havvindmøllepark",color:"#0284c7", kind:"renew",    tip:"Gratis og grøn – men kun det, vinden giver. Du kan kun skrue ned." },
  sun:     { name:"Solcellepark",    color:"#eab308", kind:"renew",    tip:"Gratis og grøn – men kun når solen skinner. Du kan kun skrue ned." },
  link:    { name:"Kabel til Norge", color:"#4f46e5", kind:"link",     tip:"Op = importér norsk vandkraft. Ned = eksportér vores strøm. Hurtigt." },
  battery: { name:"Batteri",         color:"#c026d3", kind:"storage",  tip:"Lynhurtigt. Op = aflad (giv strøm), ned = oplad. Løb ikke tør!" },
  p2x:     { name:"Power-to-X",      color:"#0d9488", kind:"load",     tip:"Laver brint af overskudsstrøm. Op = brug MERE strøm. Du forbruger – du producerer ikke." }
};
const qs = new URLSearchParams(location.search);
const ROOM = (qs.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
let ID = qs.get("id"); try { ID = ID || sessionStorage.getItem("lys.id"); } catch (e) {}
if (!ID) { ID = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem("lys.id", ID); } catch (e) {} }
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nf = (v, d = 0) => v.toLocaleString("da-DK", { minimumFractionDigits:d, maximumFractionDigits:d });

// P.v = the value the player controls: injection for most, CONSUMPTION (0..1) for Power-to-X
const P = { role:null, cap:0, o:0, v:0, soc:60, trip:0, f:50, h:0, run:0, bo:0, done:0, scn:"", w:0, s:0, touchAt:0, lastSt:0, fShown:50 };
const kind = () => P.role ? RI[P.role].kind : "dispatch";

// ------------------------------------------------------------- netværk
function Realtime(topic, onMsg, onStatus) {
  const url = `wss://${SUPA_REF}.supabase.co/realtime/v1/websocket?apikey=${SUPA_KEY}&vsn=1.0.0`;
  let ws = null, ref = 0, joinRef = null, live = false, hb = 0, backoff = 500, queue = [];
  const T = "realtime:" + topic;
  function connect() {
    onStatus(false);
    try { ws = new WebSocket(url); } catch (e) { return retry(); }
    ws.onopen = () => { joinRef = String(++ref); ws.send(JSON.stringify({ topic:T, event:"phx_join", ref:joinRef, join_ref:joinRef,
      payload:{ config:{ broadcast:{ self:false, ack:false }, presence:{ key:"" }, private:false } } })); };

      let m; try { m = JSON.parse(e.data); } catch (_) { return; }

      } else if (m.event === "broadcast" && m.payload) onMsg(m.payload.payload);

}
let rt = null, lastSpSend = 0, spTimer = 0;
function sendSp(force) {
  const now = performance.now(); clearTimeout(spTimer);
  if (force || now - lastSpSend > 120) { lastSpSend = now; rt.send({ t:"sp", id:ID, v:+P.v.toFixed(3) }); }
  else spTimer = setTimeout(() => sendSp(true), 130);
}
let followSid = null, followStarted = 0;
function onMsg(m) {
  if (!m || m.t !== "st") return;
  if (m.sid && m.sid !== followSid) {                       // follow only the newest big screen
    if (followSid && (m.started || 0) < followStarted) return;
    followSid = m.sid; followStarted = m.started || 0;
  }
  P.lastSt = Date.now();
  P.f = m.f; P.h = m.h; P.run = m.run; P.done = m.done; P.scn = m.scn; P.w = m.w / 100; P.s = m.s / 100;
  if (m.bo && !P.bo) buzz([300, 100, 300]);
  P.bo = m.bo;
  const me = (m.u || []).find(x => x[0] === ID);
  if (!me) { P.role = null; P.full = (m.u || []).length >= 40; render(); return; }
  const role = ROLES[me[1]], toV = (inj) => RI[role].kind === "load" ? -inj : inj;
  if (role !== P.role) { P.role = role; P.v = toV(me[4] / 1000); buzz(60); drawIcon(); }
  P.cap = me[2]; P.o = me[3] / 1000; P.soc = me[5]; P.trip = me[6];
  if (performance.now() - P.touchAt > 1500) P.v = toV(me[4] / 1000);   // follow the screen unless we just moved it
  render();
}

// ------------------------------------------------------------- visning
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function hhmm(h) { if (h >= 23.999) return "24:00"; const m = Math.round(h * 60) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
const twoWay = () => { const k = kind(); return k === "link" || k === "storage"; };
function vToY(v) { return twoWay() ? (1 - (v + 1) / 2) : (1 - v); }
const LABELS = {
  dispatch: ["MAKS", "SLUK", "▲ Mere", "▼ Mindre", "Producerer nu"],
  renew:    ["MAKS", "SLUK", "▲ Mere", "▼ Mindre", "Producerer nu"],
  link:     ["IMPORT", "EKSPORT", "▲ Import", "▼ Eksport", "Kablet nu"],
  storage:  ["AFLAD", "OPLAD", "▲ Aflad", "▼ Oplad", "Batteriet nu"],
  load:     ["MAKS FORBRUG", "SLUK", "▲ Brug mere", "▼ Brug mindre", "Forbruger nu"]
};
function render() {
  const wait = $("wait"), box = $("waitBox");
  if (!ROOM) return;
  if (!P.lastSt || Date.now() - P.lastSt > 6000) { wait.hidden = false; box.innerHTML = `<h2>Venter på storskærmen…</h2><div style="color:#5b6b62">Rum ${ROOM}</div>`; }
  else if (!P.role) { wait.hidden = false; box.innerHTML = P.full ? `<h2>Nettet er fuldt</h2><div>Alle anlæg er taget – følg med på storskærmen.</div>` : `<h2>Deltager…</h2><div>Du får et anlæg om et øjeblik.</div>`; }
  else wait.hidden = true;
  $("black").hidden = !P.bo;
  if (!P.role) return;
  const ri = RI[P.role], k = ri.kind, L = LABELS[k];
  document.documentElement.style.setProperty("--role", ri.color);
  $("roleName").textContent = "Du styrer: " + ri.name;
  $("roleTip").textContent = nf(P.cap) + " MW · " + ri.tip;
  const tr = $("trip");
  if (P.trip > 0) { tr.hidden = false; tr.textContent = "Dit anlæg er FALDET UD! Tilbage om " + P.trip + " s"; } else tr.hidden = true;
  $("clock").textContent = "kl. " + hhmm(P.h) + (P.run ? "" : (P.done ? " · dagen er slut" : " · pause"));
  $("scn").textContent = P.scn;
  $("tlabel").textContent = L[0]; $("blabel").textContent = L[1];
  // a two-way bar fills from the middle, so its bottom label usually sits on the pale track: write it dark there
  $("blabel").style.cssText = (k === "link" || k === "storage" || k === "load") ? "color:var(--muted);text-shadow:none" : ""; $("more").textContent = L[2]; $("less").textContent = L[3]; $("nowLbl").textContent = L[4];
  $("zero").style.display = twoWay() ? "block" : "none";
  $("soc").style.display = k === "storage" ? "block" : "none";
  $("socv").textContent = P.soc + " %"; $("socbar").style.width = P.soc + "%";
  const av = $("avail");
  if (k === "renew") { av.style.display = "block"; av.style.top = (100 * (1 - (P.role === "sun" ? P.s : P.w))) + "%"; } else av.style.display = "none";
  const fill = $("fill"), shown = k === "load" ? -P.o : P.o;
  if (twoWay()) {
    if (shown >= 0) { fill.style.bottom = "50%"; fill.style.top = (50 - 50 * shown) + "%"; }
    else { fill.style.top = "50%"; fill.style.bottom = (50 + 50 * shown) + "%"; }
  } else { fill.style.top = (100 * (1 - clamp(shown, 0, 1))) + "%"; fill.style.bottom = "0"; }
  $("handle").style.top = (100 * vToY(P.v)) + "%";
  const mw = Math.round(Math.abs(shown) * P.cap);
  let now = nf(mw) + " MW";
  if (k === "link") now = shown > 0.005 ? "import " + now : shown < -0.005 ? "eksport " + now : "0 MW";
  if (k === "storage" && shown < -0.005) now = "lader " + now;
  $("now").textContent = now;
  let tg = Math.round(Math.abs(P.v) * 100) + " %";
  if (k === "link") tg = (P.v >= 0 ? "import " : "eksport ") + tg;
  if (k === "storage") tg = (P.v >= 0 ? "aflad " : "oplad ") + tg;
  $("tgt").textContent = tg;
}
function drawFreq() {
  P.fShown += (P.f - P.fShown) * 0.25;
  const f = P.fShown, dev = f - 50, ad = Math.abs(dev), load = kind() === "load";
  $("fv").innerHTML = nf(f, 2) + "<small> Hz</small>";
  const adv = $("advice");
  if (P.bo) { adv.className = "bad"; adv.textContent = "Blackout!"; }
  else if (ad < 0.2) { adv.className = "ok"; adv.textContent = "I balance – hold den"; }
  else if (dev < 0) { adv.className = ad < 0.5 ? "warn" : "bad"; adv.textContent = load ? "For lidt strøm – brug MINDRE!" : "For lidt strøm – skru OP!"; }
  else { adv.className = ad < 0.5 ? "warn" : "bad"; adv.textContent = load ? "For meget strøm – brug MERE!" : "For meget strøm – skru NED!"; }
  const cv = $("mini"), r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 3);
  if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height);
  const R = Math.min(r.width / 2 - 4, r.height - 6), cx = r.width / 2, cy = r.height - 3;
  const ang = (hz) => Math.PI + (clamp(hz, 49, 51) - 49) / 2 * Math.PI;
  const seg = (a, b, c) => { g.beginPath(); g.arc(cx, cy, R * 0.8, ang(a), ang(b)); g.strokeStyle = c; g.lineWidth = R * 0.32; g.stroke(); };
  seg(49, 49.5, "#fca5a5"); seg(49.5, 49.8, "#fde68a"); seg(49.8, 50.2, "#86efac"); seg(50.2, 50.5, "#fde68a"); seg(50.5, 51, "#fca5a5");
  const a = ang(f);
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * R * 0.98, cy + Math.sin(a) * R * 0.98); g.strokeStyle = "#14532d"; g.lineWidth = 3.5; g.lineCap = "round"; g.stroke();

}
function drawIcon() {

  const g = cv.getContext("2d"); g.setTransform(dpr * r.width / 48, 0, 0, dpr * r.height / 48, 0, 0); g.clearRect(0, 0, 48, 48);
  const c = RI[P.role].color; g.fillStyle = c; g.strokeStyle = c; g.lineWidth = 3;
  switch (P.role) {
    case "bio": g.fillRect(6, 22, 36, 20); g.fillRect(28, 6, 7, 18); g.fillStyle = "#16a34a"; g.beginPath(); g.ellipse(14, 12, 7, 4, -0.6, 0, 7); g.fill(); break;
    case "gas": g.fillRect(8, 18, 32, 24); g.fillStyle = "#f97316"; g.beginPath(); g.moveTo(24, 2); g.bezierCurveTo(33, 11, 32, 17, 24, 20); g.bezierCurveTo(16, 17, 15, 11, 24, 2); g.fill(); break;
    case "wind": g.fillRect(22.8, 18, 2.6, 26); for (let i = 0; i < 3; i++) { g.save(); g.translate(24, 17); g.rotate(i * 2.094); g.beginPath(); g.moveTo(-2, 0); g.lineTo(0, -15); g.lineTo(2, 0); g.fill(); g.restore(); } break;
    case "sun": g.fillStyle = "#facc15"; g.beginPath(); g.arc(34, 11, 7, 0, 7); g.fill(); g.fillStyle = "#1e3a8a"; g.beginPath(); g.moveTo(4, 42); g.lineTo(14, 22); g.lineTo(40, 22); g.lineTo(32, 42); g.fill(); break;
    case "link": g.beginPath(); g.moveTo(4, 30); g.bezierCurveTo(16, 18, 30, 42, 44, 28); g.stroke(); g.fillStyle = "#c8102e"; g.fillRect(30, 4, 16, 11); g.fillStyle = "#fff"; g.fillRect(34, 4, 4, 11); g.fillRect(30, 8, 16, 3); g.fillStyle = "#1e3a8a"; g.fillRect(35, 4, 2, 11); g.fillRect(30, 9, 16, 1); break;
    case "battery": g.strokeRect(6, 12, 32, 26); g.fillRect(38, 20, 4, 10); g.beginPath(); g.moveTo(25, 16); g.lineTo(18, 27); g.lineTo(24, 27); g.lineTo(22, 35); g.lineTo(30, 23); g.lineTo(24, 23); g.fill(); break;
    case "p2x": g.beginPath(); g.roundRect ? g.roundRect(10, 8, 28, 34, 12) : g.rect(10, 8, 28, 34); g.fill(); g.fillStyle = "#fff"; g.font = "bold 13px system-ui"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("H₂", 24, 26); break;
  }
}
let lastBand = true;
setInterval(() => { const inBand = Math.abs(P.f - 50) < 0.2; if (!inBand && lastBand && P.run) buzz(80); lastBand = inBand; render(); }, 500);

// træk i baren
const track = $("track");
function setFromY(clientY) {
  if (!P.role) return;
  const r = track.getBoundingClientRect(), y = clamp((clientY - r.top) / r.height, 0, 1);
  P.v = twoWay() ? clamp(1 - 2 * y, -1, 1) : clamp(1 - y, 0, 1);
  if (twoWay() && Math.abs(P.v) < 0.04) P.v = 0;
  P.touchAt = performance.now(); render(); sendSp();
}
let dragging = false;
track.addEventListener("pointerdown", (e) => { dragging = true; try { track.setPointerCapture(e.pointerId); } catch (_) {} setFromY(e.clientY); e.preventDefault(); });
track.addEventListener("pointermove", (e) => { if (dragging) { setFromY(e.clientY); e.preventDefault(); } });
const endDrag = () => { if (dragging) { dragging = false; sendSp(true); } };
track.addEventListener("pointerup", endDrag); track.addEventListener("pointercancel", endDrag);
function nudge(d) {
  if (!P.role) return;
  const [lo, hi] = vRange();
  P.v = clamp(P.v + (twoWay() ? 2 * d : d), lo, hi);
  P.touchAt = performance.now(); render(); sendSp(true); buzz(15);
}
$("more").onclick = () => nudge(0.1);
$("less").onclick = () => nudge(-0.1);

// ------------------------------------------------------------- start
if (!ROOM) {
  $("wait").hidden = false;
  $("waitBox").innerHTML = `<h2>Skriv rumkoden</h2><div>den står på storskærmen</div><input id="roomIn" maxlength="8" autocomplete="off" autocapitalize="characters"><br><button id="roomGo">Deltag</button>`;
  const go = () => { const v = $("roomIn").value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (v) location.search = "?room=" + v; };
  $("roomGo").onclick = go; $("roomIn").onkeydown = (e) => { if (e.key === "Enter") go(); };
} else {
  $("roomTag").textContent = "rum " + ROOM;
  rt = Realtime("dtu-gront-lys-" + ROOM, onMsg, (ok) => $("dot").className = ok ? "live" : "");
  const hello = () => rt.send({ t:"hello", id:ID });
  hello(); setInterval(hello, 2000);
  window.addEventListener("pagehide", () => rt.send({ t:"bye", id:ID }));
  render();
}
requestAnimationFrame(drawFreq);
window.__PH = { following:() => followSid, P, id:ID, setV:(v) => { P.v = v; P.touchAt = performance.now(); sendSp(true); render(); } };
})();
</script>
