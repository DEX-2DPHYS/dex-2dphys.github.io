<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2DPHYS Atomic Workbench – molecular dynamics and electron transport in virtual reality</title>
<meta name="description" content="Build and run a Lennard-Jones molecular-dynamics simulation of argon, neon, krypton or xenon in WebXR: Meta Quest browser, Quest via SteamVR/OpenXR on a PC, or desktop with mouse. Runs offline.">
<meta name="color-scheme" content="dark">
<style>
  html,body{margin:0;height:100%;background:#070b13;color:#e8eef8;font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #top{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:10px 14px;pointer-events:none;z-index:5}
  #top>*{pointer-events:auto}
  #top .brand{font-weight:700;letter-spacing:.04em;color:#4ae3e1;font-size:15px;text-shadow:0 1px 6px #000}
  #top .sub{color:#9fb2cf;font-size:12px;flex:1;text-shadow:0 1px 6px #000}
  #top a{color:#9fb2cf;font-size:12px}
  button.b{font:600 13px system-ui,sans-serif;color:#e8eef8;background:#1d2a45;border:1px solid #2a3a5c;border-radius:10px;padding:8px 12px;cursor:pointer}
  button.b:hover{border-color:#4ae3e1}
  button.b.on{background:#17696a;border-color:#4ae3e1}
  #uiWrap{position:fixed;top:54px;right:10px;z-index:4}
  #uiWrap canvas{display:block;width:min(430px,94vw,calc((100vh - 66px)*800/1160));aspect-ratio:800/1160;height:auto;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
  #plotWrap{position:fixed;left:10px;bottom:10px;z-index:4}
  #plotWrap canvas{display:block;width:min(540px,46vw);aspect-ratio:1024/860;height:auto;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.55);opacity:.97}
  #tools{position:fixed;left:14px;top:50px;z-index:6;display:flex;flex-direction:column;gap:6px}
  #tools canvas{display:block;width:min(700px,calc(100vw - 480px));height:auto;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  #tbWrap canvas{aspect-ratio:1000/92} #ptWrap canvas{aspect-ratio:1000/590}
  body.light #tools canvas{box-shadow:0 8px 24px rgba(40,60,90,.25)}
  #hint{position:fixed;left:14px;top:calc(56px + min(700px, calc(100vw - 480px)) * 0.092);color:#8798b6;font-size:12px;line-height:1.5;text-shadow:0 1px 6px #000;z-index:3;pointer-events:none}
  #hint b{color:#cfe0ff;font-weight:600}
  @media (max-width:760px){#hint{display:none}}
  body.light{background:#e8edf3;color:#15202f}
  body.light #top .brand{color:#0b827f;text-shadow:none}
  body.light #top .sub,body.light #top a,body.light #hint{color:#4f5f79;text-shadow:none}
  body.light #hint b{color:#15202f}
  body.light button.b{color:#15202f;background:#dfe6f0;border-color:#b9c5d6}
  body.light button.b.on{background:#a8dedb;border-color:#0b827f}
  body.light #uiWrap canvas,body.light #plotWrap canvas{box-shadow:0 8px 30px rgba(40,60,90,.25)}
  #start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(7,11,19,.93);padding:16px;overflow:auto}
  #start.hide{display:none}
  #start .card{max-width:640px;width:100%;text-align:center}
  #start h1{font-size:26px;letter-spacing:.04em;color:#4ae3e1;margin:0 0 4px}
  #start p{color:#9fb2cf;margin:0 0 18px;font-size:15px}
  #start h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#8798b6;margin:20px 0 8px}
  #start .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #start button{font:600 17px system-ui,sans-serif;color:#e8eef8;background:#1d2a45;border:2px solid #2a3a5c;border-radius:14px;padding:14px 18px;cursor:pointer;flex:1 1 150px}
  #start button small{display:block;text-align:center;font:400 12px system-ui,sans-serif;color:#9fb2cf;margin-top:4px}
  #start button:hover{border-color:#4ae3e1}
  #start button.sel{background:#17696a;border-color:#4ae3e1}
  #start .row button{display:flex;flex-direction:column;align-items:center;gap:8px}
  #start canvas{width:48px;height:48px}
  #start button.tut{margin-top:10px;flex:none;width:100%;background:transparent;font-size:16px}
  #start button.go{margin-top:26px;flex:none;width:100%;background:#4ae3e1;color:#06141a;border-color:#4ae3e1;font-size:20px}
  body.light #start{background:rgba(232,237,243,.95)}
  body.light #start h1{color:#0b827f} body.light #start p,body.light #start h2,body.light #start button small{color:#4f5f79}
  body.light #start button{color:#15202f;background:#dfe6f0;border-color:#b9c5d6} body.light #start button.sel{background:#a8dedb;border-color:#0b827f}
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);max-width:min(640px,92vw);background:rgba(13,20,34,.94);color:#e8eef8;border:1px solid #2a3a5c;border-radius:12px;padding:10px 16px;font:500 14px/1.4 system-ui,sans-serif;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  body.light #toast{background:rgba(246,248,251,.96);color:#15202f;border-color:#b9c5d6}
  button.b.off{opacity:.55}
  @media (max-width:760px){
    #top{flex-wrap:wrap;gap:6px;padding:6px 8px}
    #top .brand{flex:1 1 100%;font-size:12px}
    #top .sub{display:none}
    button.b{font-size:12px;padding:6px 9px}
    #tools{left:8px;right:8px;top:auto;bottom:8px;max-width:calc(100vw - 16px);overflow-x:auto;overflow-y:hidden;flex-direction:column-reverse}
    #tools canvas{width:780px;max-width:none}
    #tbWrap canvas{touch-action:pan-x !important}
    #uiWrap{top:auto;bottom:90px;left:8px;right:8px;max-height:calc(100vh - 170px);overflow-y:auto;border-radius:16px}
    #uiWrap canvas{width:100%;max-width:none;aspect-ratio:800/1160;touch-action:pan-y !important}
    #toast{bottom:92px}
  }
</style>
</head>
<body>
<div id="top">
  <span class="brand">2DPHYS ATOMIC&nbsp;WORKBENCH</span>
  <span class="sub">molecular dynamics · chemistry · electron transport · VR</span>
  <button class="b" id="themeBtn">White lab</button>
  <button class="b" id="panelBtn">Menu</button>
  <button class="b" id="plotBtn">Plots</button>
  <button class="b" id="vrBtn">Checking VR…</button>
  <a href="../../index.html">← DEX tools</a>
</div>
<div id="hint"></div>
<div id="tools"><div id="tbWrap"></div><div id="ptWrap" style="display:none"></div></div>
<div id="uiWrap"></div>
<div id="plotWrap"></div>
<div id="toast"></div>
<div id="start"><div class="card">
  <h1>2DPHYS ATOMIC&nbsp;WORKBENCH</h1>
  <p data-t="sub"></p>
  <h2 data-t="hl"></h2>
  <div class="row" id="stLang"><button data-v="en"><svg viewBox="0 0 50 30" width="50" height="30" aria-hidden="true"><rect width="50" height="30" fill="#012169"/><path d="M0 0L50 30M50 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L50 30M50 0L0 30" stroke="#c8102e" stroke-width="2"/><path d="M25 0V30M0 15H50" stroke="#fff" stroke-width="10"/><path d="M25 0V30M0 15H50" stroke="#c8102e" stroke-width="6"/></svg><span>English</span></button><button data-v="da"><svg viewBox="0 0 40 30" width="40" height="30" aria-hidden="true"><rect width="40" height="30" fill="#c8102e"/><path d="M12 0V30M0 15H40" stroke="#fff" stroke-width="5"/></svg><span>Dansk</span></button></div>
  <h2 data-t="hv"></h2>
  <div class="row" id="stLevel">
    <button data-v="kid"><canvas width="96" height="96" data-ic="kid"></canvas><span data-t="kid"></span><small data-t="kidd"></small></button>
    <button data-v="adult"><canvas width="96" height="96" data-ic="adult"></canvas><span data-t="adult"></span><small data-t="adultd"></small></button>
    <button data-v="researcher"><canvas width="96" height="96" data-ic="researcher"></canvas><span data-t="res"></span><small data-t="resd"></small></button>
  </div>
  <button class="go" id="stGo" data-t="go"></button>
  <button class="tut" id="stTut"><span data-t="tut"></span></button>
</div></div>
<!--BUNDLE-->
</body>
</html>
