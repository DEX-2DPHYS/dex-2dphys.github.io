lattice. Its surface is bare, so see what the atoms do about their dangling bonds.":"Et nanometerstort stykke diamant, sk\xE5ret ud af gitteret. Overfladen er bar, s\xE5 se hvad atomerne g\xF8r ved deres frie bindinger.","A real molecule: six carbons and six hydrogens in a flat ring. Watch it vibrate, then let seven molecules find out how benzene sticks together.":"Et rigtigt molekyle: seks kulstofatomer og seks brintatomer i en flad ring. Se det vibrere, og lad derefter syv molekyler finde ud af, hvordan benzen h\xE6nger sammen.","A single sheet of carbon atoms. Heat it, watch it ripple, and tear a hole in it.":"Et enkelt lag af kulstofatomer. Opvarm det, se det b\xF8lge, og riv et hul i det.","A transition-metal dichalcogenide: each layer is a Mo plane between two S planes. Compare it with graphite.":"Et overgangsmetal-dichalcogenid: hvert lag er et Mo-plan mellem to S-planer. Sammenlign med grafit.",Add:"Tilf\xF8j","Add Mo":"Tilf\xF8j Mo","Add S":"Tilf\xF8j S","Add atom":"Tilf\xF8j atom","Aim at atoms and hold the TRIGGER with the Tweezers tool: the atom follows your hand through a spring. Push the thumbstick forward or back to reel it in or out.":"Sigt p\xE5 atomer, og hold TRIGGEREN inde med Pincet-v\xE6rkt\xF8jet: atomet f\xF8lger din h\xE5nd gennem en fjeder. Skub tommelfingerstikket frem eller tilbage for at hale det ind eller ud.","Alkali metal":"Alkalimetal","Alkaline earth":"Jordalkalimetal","An empty box: place atoms with Add, connect them with Bond, grow molecules with Attach.":"En tom kasse: plac\xE9r atomer med Tilf\xF8j, forbind dem med Bind, og byg molekyler med P\xE5s\xE6t.","Annihilator and boundary":"Annihilator og gr\xE6nse","Annihilator cone (half angle)":"Annihilatorkegle (halv vinkel)",Arrows:"Pile","Arrows on the bonds":"Pile p\xE5 bindingerne","Atom size":"Atomst\xF8rrelse",Atoms:"Atomer","Atoms and bonds":"Atomer og bindinger","Atoms interact through the Lennard-Jones potential, V = 4\u03B5[(\u03C3/r)\xB9\xB2 \u2212 (\u03C3/r)\u2076], cut idder p\xE5 ankerkulstofferne.","Benzene rings between the electrodes":"Benzenringe mellem elektroderne","Benzene \xD7{1}":"Benzen \xD7{1}","Benzene-dithiol":"Benzen-dithiol","Bias voltage":"Biassp\xE6nding","Biphenyl-dithiol":"Biphenyl-dithiol",Bond:"Bind","Bond colour: dark violet = little current, through red and orange to yellow = the most; grey = none. Arrows point along the conventional current, from + to \u2212. Currents between graphite layers are computed but not drawn (they are not bonds).":"Bindingsfarve: m\xF8rkviolet = lidt str\xF8m, via r\xF8d og orange til gul = mest; gr\xE5 = ingen. Pilene peger i den konventionelle str\xF8mretning, fra + til \u2212. Str\xF8mme mellem grafitlagene beregnes, men tegnes ikke (de er ikke bindinger).","Bond width":"Bindingsbredde",Bonded:"Bundet","Box emptied - use the Add tool to place atoms":"Kassen er t\xF8mt - brug Tilf\xF8j-v\xE6rkt\xF8jet til at placere atomer","Buckminsterfullerene C60 (Tersoff carbon).":"Buckminsterfulleren C60 (Tersoff-kulstof).","Build a material first (BUILD \u2192 Materials), or an Empty box":"Byg f\xF8rst et materiale (BYG \u2192 Materialer) eller en Tom kasse","Built {1} {2} atoms in a {3} nm box":"Bygget {1} {2} atomer i en {3} nm kasse","Built {1}: {2} atoms":"Bygget {1}: {2} atomer","Built-in systems":"Indbyggede systemer","Change the target temperature to 70 K, 90 K, 110 K and 130 K, recording D each time. Plot ln D against 1/T.":"S\xE6t m\xE5ltemperaturen til 70 K, 90 K, 110 K og 130 K, og gem D hver gang. Plot ln D mod 1/T.","Chemistry (any element)":"Kemi (alle grundstoffer)","Chemistry: explicit bonds on the Universal Force Field (UFF). Attach any main-group atom; valence is respected, hybridisation follows the bonds (sp\xB2 \u2192 sp\xB3). Bonds snap at 1.6\xD7 their length.":"Kemi: eksplicitte bindinger med Universal Force Field (UFF). P\xE5s\xE6t et hvilket som helst hovedgruppeatom; valensen respekteres, og hybridiseringen f\xF8lger bindingerne (sp\xB2 \u2192 sp\xB3). Bindinger brister ved 1,6\xD7 deres l\xE6ngde.","Chirality m":"Kiralitet m","Chirality n":"Kiralitet n","Choose Tweezers with Grab: layer, aim at the top layer and pull upwards slowly. The footer shows the tweezer force in nN.":"V\xE6lg Pincet med Grib: lag, sigt p\xE5 det \xF8verste lag, og tr\xE6k langsomt opad. Bundlinjen viser pincetkraften i nN.","Choose an element":"V\xE6lg et grundstof","Clear box":"T\xF8m kasse","Clear contacts":"Fjern kontakter","Cluster radius":"Klyngeradius","Colour by Defects: edges and surface atoms stay blue (the S atoms keep their three Mo bonds).":"Farv efter Defekter: kanter og overfladeatomer forbliver bl\xE5 (S-atomerne beholder deres tre Mo-bindinger).","Colour by current":"Farv efter str\xF8m","Colour the bonds by current":"Farv bindingerne efter str\xF8m","Compare the Pair distances plot at 300 K and 2500 K: diamond has a peak at 1.54 \xC5 (sp\xB3); graphite-like carbon (sp\xB2) has one near 1.42 \xC5.":"Sammenlign plottet Parafstande ved 300 K og 2500 K: diamant har en top ved 1,54 \xC5 (sp\xB3); grafitlignende kulstof (sp\xB2) har en n\xE6r 1,42 \xC5.","Compare the recorded pressure with the ideal-gas value \u03C1* T* \xD7 419 bar. At what density does the gas stop being ideal?":"Sammenlign det m\xE5lte tryk med idealgasv\xE6rdien \u03C1* T* \xD7 419 bar. Ved hvilken densitet holder gassen op med at v\xE6re ideal?","Compress a dilute gas at constant temperature and test p \xB7 V = N k T.":"Komprim\xE9r en fortyndet gas ved konstant temperatur, og test p \xB7 V = N k T.",Conductance:"Konduktans","Contact coupling \u0393":"Kontaktkobling \u0393","Contacts at ends":"Kontakter i enderne","Contacts need a material: build graphene, graphite or benzene":"Kontakter kr\xE6ver et materiale: byg grafen, grafit eller benzen","Controls in VR":"Betjening i VR","Cool a gas below its critical temperature and watch droplets nucleate.":"K\xF8l en gas ned under dens kritiske temperatur, og se dr\xE5ber danne kim.","Cool it back to 300 K. Is it still diamond?":"K\xF8l den tilbage til 300 K. Er den stadig diamant?",Coordination:"Koordination","Coordination Z":"Koordination Z","Coordination counts neighbours within 1.4\u03C3. D = MSD/(6t).":"Koordination t\xE6ller naboer inden for 1,4\u03C3. D = MSD/(6t).","Could not load this system: ":"Kunne ikke indl\xE6se dette system: ","Could not save: the browser storage is full or blocked":"Kunne ikke gemme: browserens lager er fuldt eller blokeret","Could not start VR: ":"Kunne ikke starte VR: ",Current:"Str\xF8m","Current (ELEC tab)":"Str\xF8m (fanen ELEK)","Current I(V)  and  dI/dV":"Str\xF8m I(V)  og  dI/dV","Current at bias":"Str\xF8m ved bias","D (diffusion)":"D (diffusion)","DATA tab: D is estimated as MSD / (6 t) from each finished window; wait for two windows.":"Fanen DATA: D estimeres som MSD / (6 t) fra hvert afsluttet vindue; vent p\xE5 to vinduer.","Dark lab":"M\xF8rkt lab",Defects:"Defekter",Delete:"Slet","Delete a few atoms in the middle, or stretch the flake with the tweezers. The current finds its way round the hole, and the I(V) curve changes.":"Slet nogle atomer i midten, eller str\xE6k flagen med pincetten. Str\xF8mmen finder vej uden om hullet, og I(V)-kurven \xE6ndrer sig.","Delete a short line of atoms and heat to 2500 K: where does the sheet fail first?":"Slet en kort r\xE6kke atomer, og opvarm til 2500 K: hvor giver laget efter f\xF8rst?","Delete mode":"Slettetilstand","Delete mode: ON":"Slettetilstand: TIL","Delete one atom with the Delete tool. Colour by Defects: three neighbours now have only two bonds. Watch whether the hole reconstructs into a pentagon and a nine-ring.":"Slet \xE9t atom med Slet-v\xE6rkt\xF8jet. Farv efter Defekter: tre naboer har nu kun to bindinger. Se om hullet rekonstruerer til en femring og en nidring.",Deleted:"Slettet","Density \u03C1*":"Densitet \u03C1*","Density \u03C1*  (squeeze / expand the box)":"Densitet \u03C1*  (pres / udvid kassen)",ELEC:"ELEK","Edit by hand":"Redig\xE9r i h\xE5nden","Electrodes are wide-band contacts on the marked atoms. T(E), the current I = (2e\xB2/h) \u222B T(E)[f\u208B - f\u208A] dE and the bond currents come from the Green\u2019s function, recomputed from the live geometry a few times a second.":"Elektroderne er bredb\xE5ndskontakter p\xE5 de markerede atomer. T(E), str\xF8mmen I = (2e\xB2/h) \u222B T(E)[f\u208B - f\u208A] dE og bindingsstr\xF8mmene beregnes med Greens funktion, genberegnet ud fra den aktuelle geometri et par gange i sekundet.","Electron transport needs a material (carbon).":"Elektrontransport kr\xE6ver et materiale (kulstof).","Electron transport: how it is modelled":"Elektrontransport: s\xE5dan er den modelleret",Element:"Grundstof","Empty box":"Tom kasse","Empty box \xB7 chemistry":"Tom kasse \xB7 kemi","Energies and forces of the Tersoff and Stillinger-Weber models were checked against LAMMPS (agreement 10\u207B\xB9\xB2 eV). Pressure is not computed for materials.":"Energier og kr\xE6fter i Tersoff- og Stillinger-Weber-modellerne er kontrolleret mod LAMMPS (overensstemmelse 10\u207B\xB9\xB2 eV). Tryk beregnes ikke for materialer.","Energy / atom":"Energi / atom","Energy per atom":"Energi pr. atom","Enter VR":"Start VR","Estimate the work (force \xD7 distance) and divide by the number of atoms in the layer. The binding energy of graphite is about 50 meV per atom.":"Estim\xE9r arbejdet (kraft \xD7 afstand), og divider med antallet af atomer i laget. Grafits bindingsenergi er ca. 50 meV pr. atom.","Everything is computed in reduced units and shown in real units for the chosen noble gas (\u03C3, \u03B5, m). One time unit is about 2.16 ps for argon.":"Alt beregnes i reducerede enheder og vises i rigtige enheder for den valgte \xE6delgas (\u03C3, \u03B5, m). \xC9n tidsenhed er ca. 2,16 ps for argon.","Exit VR":"Forlad VR","Expand the box slowly (density slider on RUN, 1.0 \u2192 0.8). The stretched crystal is under tension - look for voids opening up.":"Udvid kassen langsomt (densitetsskyderen p\xE5 K\xD8R, 1,0 \u2192 0,8). Den udstrakte krystal er under tr\xE6k - se efter hulrum, der \xE5bner sig.","Experimental liquid argon at 90 K has D of order 2\xD710\u207B\u2079 m\xB2/s. What is the activation energy from your plot?":"Eksperimentelt har flydende argon ved 90 K et D af st\xF8rrelsesordenen 2\xD710\u207B\u2079 m\xB2/s. Hvad er aktiveringsenergien if\xF8lge dit plot?","Experimental solid argon has nearest neighbours at 0.376 nm. How well does the model agree?":"I fast argon har de n\xE6rmeste naboer eksperimentelt en afstand p\xE5 0,376 nm. Hvor godt stemmer modellen?","Export CSV":"Eksport\xE9r CSV","FCC crystal":"FCC-krystal","Fill valence with H":"Fyld valens med H","Fit table + panels to me":"Tilpas bord + paneler til mig","Follow a single atom through a liquid and measure the diffusion constant from the mean-square displacement.":"F\xF8lg et enkelt atom gennem en v\xE6ske, og m\xE5l diffusionskonstanten ud fra den gennemsnitlige kvadratiske forskydning.","GAS / clusters":"GAS / klynger","GRIP (the button under your middle finger) while pointing at a panel: move the panel. GRIP anywhere else: pick up and turn the experiment. BOTH GRIPS: pull your hands apart to make it bigger, together to make it smaller, twist to turn it.":"GRIP (knappen under langfingeren), mens du peger p\xE5 et panel: flyt panellet. GRIP alle andre steder: tag fat i fors\xF8get og drej det. BEGGE GRIP: tr\xE6k h\xE6nderne fra hinanden for at g\xF8re det st\xF8rre, sammen for at g\xF8re det mindre, og vrid for at dreje det.","Gold pads held fixed; the transport contacts sit on the anchor carbons.":"Guldelektroderne holdes fast; transportkontakterne sidder p\xE5 ankerkulstofferne.","Grab one layer and slide it. The footer shows the force. Compare with task 10.":"Grib \xE9t lag, og skub det. Bundlinjen viser kraften. Sammenlign med opgave 10.","Grab: atom":"Grib: atom","Grab: layer":"Grib: lag","Grab: molecule":"Grib: molekyle","Grab: piece":"Grib: stykke",Graphene:"Grafen","Graphene flake":"Grafenflage","Graphene has no band gap. How can you see that in T(E) and I(V)? Where in the flake does most of the current run, and why?":"Grafen har intet b\xE5ndgab. Hvordan kan du se det i T(E) og I(V)? Hvor i flagen l\xF8ber det meste af str\xF8mmen, og hvorfor?","Graphene, graphite and nanodiamond use the Tersoff bond-order potential for carbon: bonds can stretch, break and re-form. Graphene uses the Lindsay-Broido parameters, diamond the original Tersoff set.":"Grafen, grafit og nanodiamant bruger Tersoffs bindingsordenspotential for kulstof: bindinger kan str\xE6kkes, brydes og gendannes. Grafen bruger Lindsay-Broido-parametrene, diamant det oprindelige Tersoff-s\xE6t.",Graphite:"Grafit","Graphite ({1} layers, AB)":"Grafit ({1} lag, AB)","Graphite flake, {1} layers":"Grafitflage, {1} lag","Graphite is graphene layers held together only by weak van der Waals forces. Peel one layer off and measure the force.":"Grafit er grafenlag, der kun holdes sammen af svage van der Waals-kr\xE6fter. Pil \xE9t lag af, og m\xE5l kraften.","H fill":"H-fyld",Halogen:"Halogen","Hard walls":"H\xE5rde v\xE6gge","Heat a crystal in small steps and find the temperature at which order is lost.":"Opvarm en krystal i sm\xE5 trin, og find den temperatur, hvor ordenen forsvinder.","Heat the bilayer in steps up to 700 K and watch the layer thickness (S\u2013S distance across one layer). Then go above 800 K and wait: the lattice collapses into a dense, much lower-energy state that real MoS\u2082 does not have.":"Opvarm dobbeltlaget i trin op til 700 K, og hold \xF8je med lagtykkelsen (S\u2013S-afstanden p\xE5 tv\xE6rs af \xE9t lag). G\xE5 s\xE5 over 800 K, og vent: gitteret kollapser til en t\xE6t tilstand med meget lavere energi, som rigtig MoS\u2082 ikke har.","Heat the droplet again and find the temperature at which it evaporates completely.":"Opvarm dr\xE5ben igen, og find den temperatur, hvor den fordamper helt.","Heat to 1500 K and then 2500 K in steps. Watch how the surface atoms rearrange.":"Opvarm til 1500 K og derefter 2500 K i trin. Se hvordan overfladeatomerne omarrangerer sig.","Hexagonal boron nitride on the chemistry model (UFF, explicit bonds).":"Hexagonalt bornitrid i kemi-modellen (UFF, eksplicitte bindinger).","In an isolated system (no thermostat) the total energy must stay constant - if the integrator is good enough.":"I et isoleret system (uden termostat) skal den totale energi v\xE6re konstant - hvis integratoren er god nok.","In the energy plot, kinetic and potential energy trade places but the green total stays flat.":"I energiplottet bytter kinetisk og potentiel energi rundt, men den gr\xF8nne totale energi forbliver flad.","Isolated cluster in vacuum.":"Isoleret klynge i vakuum.","LEFT stick: walk (glide) in the direction you look, also while seated.  RIGHT stick left/right: turn (30\xB0 steps, or smooth - VR tab).  RIGHT stick up/down: heat or cool (target T). Box size and table height: sliders on the RUN and VR tabs.":"VENSTRE stik: g\xE5 (glid) i den retning, du kigger, ogs\xE5 n\xE5r du sidder.  H\xD8JRE stik venstre/h\xF8jre: drej (trin p\xE5 30\xB0, eller glidende - fanen VR).  H\xD8JRE stik op/ned: opvarm eller afk\xF8l (m\xE5l-T). Kassest\xF8rrelse og bordh\xF8jde: skydere p\xE5 fanerne K\xD8R og VR.","LIQUID / dense fluid":"V\xC6SKE / t\xE6t fluid","Language / Sprog":"Sprog / Language","Lanthanide / actinide":"Lanthanid / actinid","Large steps: watch the total energy drift (DATA).":"Store skridt: hold \xF8je med drift i den totale energi (DATA).","Lattice cells n":"Gitterceller n",Layers:"Lag","Layers and molecules attract each other through Lennard-Jones van der Waals terms tuned to the graphite binding energy (about 50 meV per atom) and the MoS\u2082 interlayer spacing and binding (0.2 J/m\xB2).":"Lag og molekyler tiltr\xE6kker hinanden gennem Lennard-Jones van der Waals-led, tilpasset grafits bindingsenergi (ca. 50 meV pr. atom) og MoS\u2082's lagafstand og binding (0,2 J/m\xB2).",Length:"L\xE6ngde",Live:"Live","Load the setup (500 atoms at 30 K, thermostat on).":"Indl\xE6s opstillingen (500 atomer ved 30 K, termostat t\xE6ndt).","Load the setup: 256 argon atoms in an FCC lattice at 20 K.":"Indl\xE6s opstillingen: 256 argonatomer i et FCC-gitter ved 20 K.","Load the setup: 500 argon atoms at 200 K, above the critical point (about 151 K in experiment).":"Indl\xE6s opstillingen: 500 argonatomer ved 200 K, over det kritiske punkt (ca. 151 K eksperimentelt).","Load the setup: 500 argon atoms at 300 K and low density.":"Indl\xE6s opstillingen: 500 argonatomer ved 300 K og lav densitet.","Load the setup: a 2H bilayer at 300 K. Mo atoms are teal, S yellow; each Mo has six S neighbours.":"Indl\xE6s opstillingen: et 2H-dobbeltlag ved 300 K. Mo-atomer er bl\xE5gr\xF8nne, S gule; hvert Mo har seks S-naboer.","Load the setup: a diamond cluster about 1.4 nm across. Colour by Defects: the core (4 bonds) is blue and the surface is red.":"Indl\xE6s opstillingen: en diamantklynge p\xE5 ca. 1,4 nm i diameter. Farv efter Defekter: kernen (4 bindinger) er bl\xE5, og overfladen er r\xF8d.","Load the setup: a liquid argon sample, equilibrated, then released with the thermostat OFF (NVE).":"Indl\xE6s opstillingen: en pr\xF8ve af flydende argon, bragt i ligev\xE6gt og derefter sluppet med termostaten SLUKKET (NVE).","Load the setup: a periodic sheet at 300 K (bond 1.44 \xC5 in this potential; experiment 1.42 \xC5). Every atom has three bonds.":"Indl\xE6s opstillingen: et periodisk lag ved 300 K (binding 1,44 \xC5 i dette potential; eksperimentelt 1,42 \xC5). Hvert atom har tre bindinger.","Load the setup: an open graphene flake (no periodic boundaries, free edges) at 100 K, with electrodes on the two short ends. Blue atoms are the \u2212 contact (electrons enter), red atoms the + contact.":"Indl\xE6s opstillingen: en \xE5ben grafenflage (ingen periodiske randbetingelser, frie kanter) ved 100 K med elektroder i de to korte ender. Bl\xE5 atomer er \u2212 kontakten (elektronerne g\xE5r ind), r\xF8de atomer + kontakten.","Load the setup: an open graphene flake in the chemistry mode (explicit bonds, any main-group element), with electrodes on the two ends. Note the current.":"Indl\xE6s opstillingen: en \xE5ben grafenflage i kemi-modellen (eksplicitte bindinger, alle hovedgruppegrundstoffer) med elektroder i de to ender. Not\xE9r str\xF8mmen.","Load the setup: liquid argon near its triple point (90 K).":"Indl\xE6s opstillingen: flydende argon n\xE6r sit tripelpunkt (90 K).","Load the setup: one benzene molecule at 20 K with the electrodes on opposite carbon atoms (para).":"Indl\xE6s opstillingen: \xE9t benzenmolekyle ved 20 K med elektroderne p\xE5 modst\xE5ende kulstofatomer (para).","Load the setup: one benzene molecule at 300 K. Bonds are drawn as sticks, white = H, grey = C.":"Indl\xE6s opstillingen: \xE9t benzenmolekyle ved 300 K. Bindinger tegnes som pinde, hvid = H, gr\xE5 = C.","Load the setup: three AB-stacked layers at 100 K, spaced 3.35 \xC5 apart.":"Indl\xE6s opstillingen: tre AB-stablede lag ved 100 K med 3,35 \xC5 afstand.","Load this setup  \u25B6":"Indl\xE6s opstillingen  \u25B6","Load {1}":"Indl\xE6s {1}","Loaded: ":"Indl\xE6st: ","Loaded: {1} ({2} atoms)":"Indl\xE6st: {1} ({2} atomer)","Log T":"Log T",Look:"Udseende","Looks like":"Ligner","Make a vacancy, an interstitial and a surface, and see how the lattice reacts.":"Lav en vakance, et interstitielt atom og en overflade, og se hvordan gitteret reagerer.",'Make an argon crystal and watch what "solid" means at the atomic scale: atoms vibrating about fixed lattice sites.':'Lav en argonkrystal og se, hvad "fast stof" betyder p\xE5 atomar skala: atomer, der vibrerer omkring faste gitterpladser.',"Mark at least one \u2212 and one + contact.":"Mark\xE9r mindst \xE9n \u2212 og \xE9n + kontakt.","Mark at least one \u2212 contact and one + contact on carbon atoms.":"Mark\xE9r mindst \xE9n \u2212 kontakt og \xE9n + kontakt p\xE5 kulstofatomer.",Materials:"Materialer","Materials: how they are modelled":"Materialer: s\xE5dan er de modelleret","Mean bonds":"Gns. bindinger","Mean-square displacement":"Gennemsnitlig kvadratisk forskydning",Metalloid:"Halvmetal","MoS\u2082 ({1} layers, 2H)":"MoS\u2082 ({1} lag, 2H)","MoS\u2082 flake":"MoS\u2082-flage","MoS\u2082 flake, 2 layers":"MoS\u2082-flage, 2 lag","MoS\u2082 has no chemistry model yet":"MoS\u2082 har endnu ingen kemi-model","MoS\u2082 is not available in the chemistry mode":"MoS\u2082 findes ikke i kemi-modellen","MoS\u2082 is not available in the chemistry mode - built with its own potential":"MoS\u2082 findes ikke i kemi-modellen - bygget med sit eget potential","MoS\u2082 monolayer":"MoS\u2082-monolag","MoS\u2082 needs a d-orbital model - not supported yet. Use graphene, graphite or benzene.":"MoS\u2082 kr\xE6ver en d-orbital-model - underst\xF8ttes ikke endnu. Brug grafen, grafit eller benzen.",'MoS\u2082 uses Jiang\u2019s Stillinger-Weber potential (LAMMPS "sw/mod"). Benzene uses an OPLS-style molecular force field with partial charges; it cannot break.':'MoS\u2082 bruger Jiangs Stillinger-Weber-potential (LAMMPS "sw/mod"). Benzen bruger et OPLS-lignende molekyl\xE6rt kraftfelt med partialladninger; det kan ikke g\xE5 i stykker.',"Molecular junction":"Molekyl\xE6r kontakt",Molecules:"Molekyler","Molecules are fixed - use the other materials to add atoms":"Molekylerne er faste - brug de andre materialer til at tilf\xF8je atomer","Move the electrodes with the \u2212 and + contact tools: click (or drag over) atoms to add them, click again to remove. Try one atom at each end, then a whole edge.":"Flyt elektroderne med v\xE6rkt\xF8jerne \u2212 og + kontakt: klik p\xE5 atomer (eller tr\xE6k hen over dem) for at tilf\xF8je dem, klik igen for at fjerne. Pr\xF8v \xE9t atom i hver ende, og derefter en hel kant.","My systems (stored in this browser / headset)":"Mine systemer (gemt i denne browser / headset)",Nanodiamond:"Nanodiamant",Nanotube:"Nanor\xF8r","Nanotube ({1},{2})":"Nanor\xF8r ({1},{2})","New atom tagged (shown large, with a trail)":"Nyt atom m\xE6rket (vises stort, med et spor)","Next \u25B6":"N\xE6ste \u25B6","No VR device found - see the VR tab for setup help":"Ingen VR-enhed fundet - se fanen VR for hj\xE6lp til ops\xE6tning","No carbon atoms: transport uses a carbon p-orbital model (MoS\u2082 is not supported yet).":"Ingen kulstofatomer: transporten bruger en p-orbital-model for kulstof (MoS\u2082 underst\xF8ttes ikke endnu).","No room for another atom there":"Ingen plads til et atom mere der","Noble gas":"\xC6delgas","Noble gas (LJ)":"\xC6delgas (LJ)",Nonmetal:"Ikke-metal","Nothing recorded yet":"Intet gemt endnu","Nothing saved yet.":"Intet gemt endnu.","Now go to BUILD, choose Benzene with 7 molecules at 100 K and let it relax: look for the molecules lining up edge-to-face (T-shaped), driven by the partial charges.":"G\xE5 nu til BYG, v\xE6lg Benzen med 7 molekyler ved 100 K, og lad det relaksere: se efter molekyler, der stiller sig kant-mod-flade (T-formet), drevet af partialladningerne.","Now pick the second atom":"V\xE6lg nu det andet atom","Number of molecules":"Antal molekyler","OPLS-style force field: bonds, angles, planarity; LJ + charges between molecules.":"OPLS-lignende kraftfelt: bindinger, vinkler, planaritet; LJ + ladninger mellem molekyler.","On RUN, increase the time step to 0.01, then 0.02. Watch the total energy.":"\xD8g tidsskridtet til 0,01 og derefter 0,02 p\xE5 K\xD8R. Hold \xF8je med den totale energi.","On RUN, set colour to Coordination: every atom has Z \u2248 12 neighbours.":"S\xE6t farven til Koordination p\xE5 K\xD8R: hvert atom har Z \u2248 12 naboer.",'On the ELEC tab: the sp\xB3 carbon has lost its \u03C0 orbital, so the current has to go round it. Attach H, F and OH (O with "Fill valence with H") across the middle and watch T(E): the band is blocked, while broken \u03C0 bonds leave localised states near E_F that can even carry current resonantly on a small flake.':'P\xE5 fanen ELEK: sp\xB3-kulstoffet har mistet sin \u03C0-orbital, s\xE5 str\xF8mmen m\xE5 g\xE5 uden om det. P\xE5s\xE6t H, F og OH (O med "Fyld valens med H") hen over midten, og hold \xF8je med T(E): b\xE5ndet blokeres, mens brudte \u03C0-bindinger efterlader lokaliserede tilstande n\xE6r E_F, som p\xE5 en lille flage endda kan lede str\xF8m resonant.',"One \u03C0 (p) orbital per carbon atom, pointing along the local normal of its bonds. Hopping between orbitals follows their actual distance and angle (Slater-Koster form, -2.7 eV at 1.42 \xC5), so stretching, rippling and the graphite interlayer coupling all enter.":"\xC9n \u03C0 (p) orbital pr. kulstofatom, rettet langs den lokale normal til dets bindinger. Hopningen mellem orbitaler afh\xE6nger af deres faktiske afstand og vinkel (Slater-Koster-form, -2,7 eV ved 1,42 \xC5), s\xE5 str\xE6kning, b\xF8lgning og koblingen mellem grafitlagene alle t\xE6ller med.","Only room for {1} more atoms":"Kun plads til {1} atomer mere","Open flake":"\xC5ben flage","Open flake (free edges)":"\xC5ben flage (frie kanter)","Open flake: free edges, no periodic images.":"\xC5ben flage: frie kanter, ingen periodiske billeder.","Open the Meta Quest Browser, go to the address of this page and press Enter VR (HTTPS is required).":"\xC5bn Meta Quest Browser, g\xE5 til denne sides adresse, og tryk Start VR (HTTPS er p\xE5kr\xE6vet).","Open the Pair distances plot: peaks at 1.08 \xC5 (C\u2013H), 1.40 \xC5 (C\u2013C), 2.42 \xC5 and 2.80 \xC5 (meta and para carbons).":"\xC5bn plottet Parafstande: toppe ved 1,08 \xC5 (C\u2013H), 1,40 \xC5 (C\u2013C), 2,42 \xC5 og 2,80 \xC5 (meta- og para-kulstoffer).","Open the g(r) plot: sharp peaks near 1.1\u03C3, 1.6\u03C3 and 1.9\u03C3. Read the first peak position in nm.":"\xC5bn g(r)-plottet: skarpe toppe n\xE6r 1,1\u03C3, 1,6\u03C3 og 1,9\u03C3. Afl\xE6s den f\xF8rste tops position i nm.","Orbitals / time":"Orbitaler / tid","Pair distances":"Parafstande",Periodic:"Periodisk","Periodic box":"Periodisk kasse","Periodic in x and y (sheet); free surfaces along z.":"Periodisk i x og y (lag); frie overflader langs z.","Periodic sheet":"Periodisk lag","Periodic sheet: current can also run round the boundary. Rebuild as an Open flake for a clean device.":"Periodisk lag: str\xF8mmen kan ogs\xE5 l\xF8be rundt om gr\xE6nsen. Byg igen som \xC5ben flage for en ren komponent.","Pick Grab: molecule and pull it. Raise the temperature to 1500 K: the ring stays flat but wobbles; the C\u2013H stretch (3060 cm\u207B\xB9) has a period of about 11 fs.":"V\xE6lg Grib: molekyle, og tr\xE6k i det. H\xE6v temperaturen til 1500 K: ringen forbliver flad, men slingrer; C\u2013H-str\xE6kningen (3060 cm\u207B\xB9) har en periode p\xE5 ca. 11 fs.","Pick the Delete tool (BUILD tab, or button A/X in VR) and remove one atom. Colour by Coordination: its 12 neighbours now have Z = 11.":"V\xE6lg Slet-v\xE6rkt\xF8jet (fanen BYG, eller knap A/X i VR), og fjern \xE9t atom. Farv efter Koordination: dets 12 naboer har nu Z = 11.",Plain:"Ensfarvet","Point at the panel with a controller ray and pull the TRIGGER to press buttons or drag sliders.":"Peg p\xE5 panelet med en controllerstr\xE5le, og tryk p\xE5 TRIGGEREN for at trykke p\xE5 knapper eller tr\xE6kke i skydere.","Post-transition metal":"Post-overgangsmetal",'Press "Record row" to log T, \u03C1*, P, U and D.':'Tryk "Gem r\xE6kke" for at gemme T, \u03C1*, P, U og D.',"Press Clear contacts and put the + contact two carbons round the ring from the \u2212 contact (meta). The current drops by a factor of a few hundred: the two paths round the ring cancel.":"Tryk Fjern kontakter, og s\xE6t + kontakten to kulstofatomer rundt i ringen fra \u2212 kontakten (meta). Str\xF8mmen falder med en faktor p\xE5 et par hundrede: de to veje rundt om ringen udslukker hinanden.",Pressure:"Tryk","Pressure uses the virial (periodic box) or wall collisions (hard walls). No long-range tail corrections are applied.":"Trykket beregnes ud fra virialen (periodisk kasse) eller st\xF8d mod v\xE6ggene (h\xE5rde v\xE6gge). Der anvendes ingen langtr\xE6kkende halekorrektioner.","Pull slowly: the reading is the force in the tweezer spring and it peaks just before the layer lets go. Lift the layer 6 \xC5 and note the largest force; per atom it should be a few tens of meV/\xC5. Release: the layer falls back and re-stacks.":"Tr\xE6k langsomt: afl\xE6sningen er kraften i pincettens fjeder, og den topper lige f\xF8r laget slipper. L\xF8ft laget 6 \xC5, og not\xE9r den st\xF8rste kraft; pr. atom b\xF8r den v\xE6re nogle f\xE5 tiere meV/\xC5. Giv slip: laget falder tilbage og stabler sig igen.","Put two electrodes on a graphene flake and watch where the electrons go - while the atoms keep moving.":"S\xE6t to elektroder p\xE5 en grafenflage, og se hvor elektronerne g\xE5r hen - mens atomerne bliver ved med at bev\xE6ge sig.","Quest + PC (Meta Horizon Link)":"Quest + PC (Meta Horizon Link)","Quest + PC via SteamVR":"Quest + PC via SteamVR","Quest 2, 3, 3S and Pro and any other WebXR headset with controllers work. Hand tracking is not used.":"Quest 2, 3, 3S og Pro samt ethvert andet WebXR-headset med controllere virker. H\xE5ndsporing bruges ikke.",RUN:"K\xD8R","Radial distribution g(r)":"Radial fordeling g(r)",Radius:"Radius","Raise the target temperature by about 10 K at a time (RUN tab, or right thumbstick in VR). Wait ~20 ps after each step.":"H\xE6v m\xE5ltemperaturen ca. 10 K ad gangen (fanen K\xD8R, eller h\xF8jre tommelfingerstik i VR). Vent ~20 ps efter hvert trin.","Random gas":"Tilf\xE6ldig gas","Reactive potentials":"Reaktive potentialer","Read T(E_F) and the current on the ELEC tab. Benzene has a gap of about 5 eV, so the current is small - but not zero.":"Afl\xE6s T(E_F) og str\xF8mmen p\xE5 fanen ELEK. Benzen har et gab p\xE5 ca. 5 eV, s\xE5 str\xF8mmen er lille - men ikke nul.","Real argon melts at 83.8 K at low pressure. Here the volume is fixed, so the pressure rises on heating. Why does that change the melting temperature? What does hysteresis tell you about the finite box?":"Rigtig argon smelter ved 83,8 K ved lavt tryk. Her er volumenet fast, s\xE5 trykket stiger ved opvarmning. Hvorfor \xE6ndrer det smeltetemperaturen? Hvad fort\xE6ller hysterese om den endelige kasse?","Real nanodiamonds have hydrogen or oxygen on the surface. What would change here if every dangling bond were capped?":"Rigtige nanodiamanter har brint eller ilt p\xE5 overfladen. Hvad ville \xE6ndre sig her, hvis alle frie bindinger var m\xE6ttede?",Rebuild:"Byg igen","Rebuild and find the largest time step with drift below 0.1 meV per atom over 50 ps.":"Byg igen, og find det st\xF8rste tidsskridt, hvor driften er under 0,1 meV pr. atom over 50 ps.","Recentring also fits the table and the panels to your eye height, seated or standing. The VR tab has a table-height slider and a dark / white lab switch.":"Centrering tilpasser ogs\xE5 bordet og panelerne til din \xF8jenh\xF8jde, siddende eller st\xE5ende. Fanen VR har en skyder til bordh\xF8jden og en kontakt mellem m\xF8rkt og hvidt lab.","Record a row (DATA tab) just below and just above the melting point, then cool it down again. Does it recrystallise at the same T?":"Gem en r\xE6kke (fanen DATA) lige under og lige over smeltepunktet, og k\xF8l s\xE5 ned igen. Rekrystalliserer den ved samme T?","Recorded measurements":"Gemte m\xE5linger","Remove atoms that fly out of reach":"Fjern atomer, der flyver uden for r\xE6kkevidde","Reset g(r)":"Nulstil g(r)","Reset panels":"Nulstil paneler","Reset view":"Nulstil visning","Restart MSD":"Genstart MSD",Result:"Resultat","Rotate the view to see the sheet edge-on: thermal ripples grow with temperature. Try 1000 K and 2000 K.":"Drej visningen, s\xE5 du ser laget fra kanten: de termiske b\xF8lger vokser med temperaturen. Pr\xF8v 1000 K og 2000 K.","Row ":"R\xE6kke ",SETTINGS:"INDSTIL.","SOLID (crystal)":"FAST STOF (krystal)",SYSTEMS:"SYSTEMER","Same size for every element":"Samme st\xF8rrelse for alle grundstoffer","Save current system":"Gem aktuelt system","Saved: {1} ({2} atoms)":"Gemt: {1} ({2} atomer)","Saving works for materials (not the noble-gas box)":"Gemning virker for materialer (ikke \xE6delgaskassen)","Set the target to 90 K and colour by Coordination. A droplet needs a few hundred ps to form - be patient or raise the speed.":"S\xE6t m\xE5let til 90 K, og farv efter Koordination. En dr\xE5be skal bruge et par hundrede ps for at dannes - v\xE6r t\xE5lmodig, eller skru op for hastigheden.","Sheet size (unit cells along x)":"Flagest\xF8rrelse (enhedsceller langs x)","Show bonds":"Vis bindinger","Simulation steps per frame (max)":"Simuleringsskridt pr. billede (maks.)","Simulation unstable: lower the time step and Rebuild":"Simuleringen er ustabil: s\xE6nk tidsskridtet og Byg igen","Single-wall carbon nanotube rolled from graphene (Tersoff carbon). Set (n, m) and length on the SYSTEMS tab.":"Enkeltv\xE6gget kulstofnanor\xF8r rullet af grafen (Tersoff-kulstof). V\xE6lg (n, m) og l\xE6ngde p\xE5 fanen SYSTEMER.","Size (unit cells along x)":"St\xF8rrelse (enhedsceller langs x)","Slide the top layer sideways instead of lifting it. Is it easier or harder?":"Skub det \xF8verste lag til siden i stedet for at l\xF8fte det. Er det lettere eller sv\xE6rere?","Smooth turn":"Glidende drejning","Snap turn":"Trinvis drejning",Speed:"Hastighed","Squeeze the box with the density slider (RUN tab), or the left thumbstick in VR. Record at several densities.":"Pres kassen sammen med densitetsskyderen (fanen K\xD8R) eller med venstre tommelfingerstik i VR. Gem m\xE5linger ved flere densiteter.","Standalone Quest (no PC)":"Selvst\xE6ndig Quest (uden pc)","Start temperature":"Starttemperatur","Starting VR\u2026":"Starter VR\u2026","Step \xD720":"Skridt \xD720","Stillinger-Weber (Jiang) layers + van der Waals between layers (2H stacking).":"Stillinger-Weber (Jiang) lag + van der Waals mellem lagene (2H-stabling).","Switch element to Ne or Xe (BUILD) and compare how easily each melts - the energy scale is \u03B5/k.":"Skift grundstof til Ne eller Xe (BYG), og sammenlign, hvor let hver af dem smelter - energiskalaen er \u03B5/k.","Switch to Hard walls (RUN tab). Pressure is now measured from collisions with the walls. Does it agree with the periodic-box result?":"Skift til H\xE5rde v\xE6gge (fanen K\xD8R). Nu m\xE5les trykket ud fra st\xF8dene mod v\xE6ggene. Stemmer det med resultatet for den periodiske kasse?","Switched to the chemistry model (UFF, explicit bonds) so other elements can bond":"Skiftede til kemi-modellen (UFF, eksplicitte bindinger), s\xE5 andre grundstoffer kan binde",System:"System","Table height":"Bordh\xF8jde","Tag atom":"M\xE6rk atom",Target:"M\xE5l","Target temperature":"M\xE5ltemperatur","Task {1} of {2}":"Opgave {1} af {2}",Temperature:"Temperatur","Terphenyl-dithiol":"Terphenyl-dithiol","Tersoff carbon (Lindsay-Broido): covalent bonds that can break and re-form.":"Tersoff-kulstof (Lindsay-Broido): kovalente bindinger, der kan brydes og gendannes.","Tersoff carbon cluster cut from diamond. Bare surface: it can reconstruct.":"Tersoff-kulstofklynge sk\xE5ret ud af diamant. Bar overflade: den kan rekonstruere.","Tersoff layers + Lennard-Jones van der Waals between layers (AB stacking).":"Tersoff-lag + Lennard-Jones van der Waals mellem lagene (AB-stabling).","The ELEC tab shows the result. The arrows are the bond currents (conventional current, from + to \u2212): larger and warmer = more current. The plots show the transmission T(E) and the current I(V).":"Fanen ELEK viser resultatet. Pilene er bindingsstr\xF8mmene (konventionel str\xF8m, fra + til \u2212): st\xF8rre og varmere farve = mere str\xF8m. Plottene viser transmissionen T(E) og str\xF8mmen I(V).","The TOOLBAR at the front edge of the table holds the editing tools and the element button (periodic table). Trigger on a button to use it.":"V\xC6RKT\xD8JSLINJEN ved bordets forkant indeholder redigeringsv\xE6rkt\xF8jerne og grundstofknappen (det periodiske system). Tryk p\xE5 en knap med triggeren for at bruge den.","The bias only sets the energy window (no self-consistent potential drop). Hydrogen carries no orbital; MoS\u2082 needs a d-orbital model and is not supported. Use Open flake for sheets: on a periodic sheet the current can also run round the boundary.":"Biassp\xE6ndingen fasts\xE6tter kun energivinduet (intet selvkonsistent potentialfald). Brint har ingen orbital; MoS\u2082 kr\xE6ver en d-orbital-model og underst\xF8ttes ikke. Brug \xC5ben flage til lag: p\xE5 et periodisk lag kan str\xF8mmen ogs\xE5 l\xF8be rundt om gr\xE6nsen.","The box is full - expand it first":"Kassen er fuld - udvid den f\xF8rst","The electron has the same distance to travel in all three cases. Why does meta conduct so much worse at low bias?":"Elektronen skal tilbagel\xE6gge samme afstand i alle tre tilf\xE6lde. Hvorfor leder meta s\xE5 meget d\xE5rligere ved lav bias?","The large yellow atom is tagged; its trail shows the random walk. Compare with the crystal of task 1.":"Det store gule atom er m\xE6rket; dets spor viser den tilf\xE6ldige vandring. Sammenlign med krystallen fra opgave 1.","The model":"Modellen","The potential gives a = 3.12 \xC5 (experiment 3.16 \xC5) and fails above ~800 K. What does that tell you about trusting any force field outside the conditions it was fitted for?":"Potentialet giver a = 3,12 \xC5 (eksperimentelt 3,16 \xC5) og svigter over ~800 K. Hvad fort\xE6ller det om at stole p\xE5 et kraftfelt uden for de betingelser, det er tilpasset til?","The same molecule, the same electrodes - but where you attach them decides whether the waves add up or cancel.":"Samme molekyle, samme elektroder - men hvor du s\xE6tter dem p\xE5, afg\xF8r om b\xF8lgerne l\xE6gges sammen eller udslukker hinanden.","The simulation runs on the headset\u2019s own processor, so it is slower. Use up to ~500 atoms and the default settings; use the PC route for 1000+ atoms.":"Simuleringen k\xF8rer p\xE5 headsettets egen processor, s\xE5 den er langsommere. Brug op til ~500 atomer og standardindstillingerne; brug pc-l\xF8sningen til 1000+ atomer.","Thermometer on the table":"Termometer p\xE5 bordet","Thermostat OFF  (energy conserved)":"Termostat FRA  (energi bevaret)","Thermostat ON  (constant T)":"Termostat TIL  (konstant T)","Think about:":"T\xE6nk over:","Think about: ":"Overvej: ","Time step":"Tidsskridt","Too far apart to bond (more than 3.2 \xC5)":"For langt fra hinanden til at binde (mere end 3,2 \xC5)","Tool: ":"V\xE6rkt\xF8j: ","Tool: ADD ATOM - {1} inside the box":"V\xE6rkt\xF8j: TILF\xD8J ATOM - {1} inde i kassen","Tool: ANNIHILATOR - hold {1}: every atom in the {2}\xB0 cone is removed":"V\xE6rkt\xF8j: ANNIHILATOR - hold {1}: alle atomer i keglen p\xE5 {2}\xB0 fjernes","Tool: ATTACH {1}{2} - {3} an atom; the new atom goes on the side you point from":"V\xE6rkt\xF8j: P\xC5S\xC6T {1}{2} - {3} p\xE5 et atom; det nye atom s\xE6ttes p\xE5 den side, du peger fra","Tool: BOND - {1} two atoms to connect them (valence permitting)":"V\xE6rkt\xF8j: BIND - {1} p\xE5 to atomer for at forbinde dem (hvis valensen tillader det)","Tool: DELETE - {1} an atom to remove it":"V\xE6rkt\xF8j: SLET - {1} p\xE5 et atom for at fjerne det","Tool: TWEEZERS - hold {1} on an atom and drag":"V\xE6rkt\xF8j: PINCET - hold {1} p\xE5 et atom og tr\xE6k","Tool: {1} CONTACT - {2} (or drag over) atoms; again to remove":"V\xE6rkt\xF8j: {1} KONTAKT - {2} p\xE5 atomer (eller tr\xE6k hen over dem); igen for at fjerne","Total E drift":"Drift i total E","Trail of the tagged atom":"Spor af det m\xE6rkede atom","Transition metal":"Overgangsmetal","Transmission T(E)":"Transmission T(E)","Transport gap":"Transportgab","Try ortho (neighbouring carbons). Then raise the bias towards 6 V: when the bias window reaches a molecular level the current jumps (resonant tunnelling).":"Pr\xF8v ortho (nabokulstoffer). H\xE6v derefter biassp\xE6ndingen mod 6 V: n\xE5r biasvinduet n\xE5r et molekyl\xE6rt niveau, springer str\xF8mmen op (resonant tunnelering).","Tweezer force: {1} nN":"Pincetkraft: {1} nN",Tweezers:"Pincet",Unknown:"Ukendt","Use the Add tool to place atoms in a material":"Brug Tilf\xF8j-v\xE6rkt\xF8jet til at placere atomer i et materiale","Use the tweezers to push one atom out of place and let go. Where does it go?":"Brug pincetten til at skubbe et atom ud af sin plads, og giv slip. Hvor bliver det af?","VR not detected":"VR ikke fundet","VR not detected on this device":"VR ikke fundet p\xE5 denne enhed",Vignette:"Vignet","Wait for the pressure to settle, then press Record row on the DATA tab.":"Vent til trykket har stabiliseret sig, og tryk s\xE5 Gem r\xE6kke p\xE5 fanen DATA.","Walking speed (left stick)":"G\xE5hastighed (venstre stik)","Warm the crystal to 60 K and track the tagged atom: does the vacancy hop?":"Varm krystallen op til 60 K, og f\xF8lg det m\xE6rkede atom: hopper vakancen?",'Watch "Looks like", the coordination colours, the width of the g(r) peaks and the MSD curve.':'Hold \xF8je med "Ligner", koordinationsfarverne, bredden af toppene i g(r) og MSD-kurven.',"Watch the pressure and potential energy fall as atoms bind to the cluster.":"Se trykket og den potentielle energi falde, mens atomerne binder sig til klyngen.","WebXR unavailable":"WebXR ikke tilg\xE6ngelig","Which atoms vibrate most strongly: bulk atoms, surface atoms or neighbours of the vacancy?":"Hvilke atomer vibrerer kraftigst: atomer i det indre, overfladeatomer eller vakancens naboer?","White lab":"Hvidt lab","Why can a layer one atom thick be so strong and still ripple so easily?":"Hvordan kan et lag, der kun er \xE9t atom tykt, v\xE6re s\xE5 st\xE6rkt og alligevel b\xF8lge s\xE5 let?","Why do neighbouring benzene rings prefer a T-shaped or slipped-parallel arrangement and not sitting directly face-to-face?":"Hvorfor foretr\xE6kker nabo-benzenringe en T-formet eller forskudt-parallel opstilling frem for at ligge direkte flade mod flade?","Why does one attached atom hurt the current so much more than its size suggests? What would full coverage (graphane, fluorographene) do?":"Hvorfor skader \xE9t p\xE5sat atom str\xF8mmen s\xE5 meget mere, end dets st\xF8rrelse antyder? Hvad ville fuld d\xE6kning (grafan, fluorografen) g\xF8re?","Why does the error grow with the time step? What is the fastest motion in this system that the step must resolve?":"Hvorfor vokser fejlen med tidsskridtet? Hvad er den hurtigste bev\xE6gelse i systemet, som tidsskridtet skal kunne opl\xF8se?","Why does the pressure fall as the droplet grows although the temperature is constant?":"Hvorfor falder trykket, mens dr\xE5ben vokser, selvom temperaturen er konstant?","Why is sliding along the layers so much easier than pulling them apart? What does that say about graphite as a lubricant and as pencil lead?":"Hvorfor er det s\xE5 meget lettere at glide langs lagene end at tr\xE6kke dem fra hinanden? Hvad siger det om grafit som sm\xF8remiddel og som blyant?",Zap:"Zap","already bonded":"allerede bundet","bias V (V)":"bias V (V)",click:"klik","dI/dV (max {1} G\u2080)":"dI/dV (maks. {1} G\u2080)","eigSym: no convergence":"eigSym: ingen konvergens","empty box":"tom kasse","hBN flake":"hBN-flage","highlighted = available":"fremh\xE6vet = tilg\xE6ngelig","mark contacts, then press T(E), I(V)":"mark\xE9r kontakter, og tryk s\xE5 T(E), I(V)","molecular dynamics \xB7 chemistry \xB7 electron transport \xB7 VR":"molekyldynamik \xB7 kemi \xB7 elektrontransport \xB7 VR","n = {1}  \u2192  {2} atoms":"n = {1}  \u2192  {2} atomer","nanotube needs n >= 1 and 0 <= m <= n":"nanor\xF8r kr\xE6ver n >= 1 og 0 <= m <= n","nanotube too long for ":"nanor\xF8ret er for langt til ","no data yet":"ingen data endnu","no gap at the Fermi level":"intet gab ved Fermi-niveauet","off (NVE)":"fra (NVE)","pairs / atom / \xC5":"par / atom / \xC5",target:"m\xE5l","thermostat off":"termostat slukket","time (ps)":"tid (ps)","time since mark (ps)":"tid siden markering (ps)","too many atoms":"for mange atomer","too many atoms - choose a smaller sheet":"for mange atomer - v\xE6lg et mindre lag","transport gap \u2248 {1} eV":"transportgab \u2248 {1} eV",trigger:"aftr\xE6kker","unknown element {1}":"ukend ABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAf/9k=";var ar=[{title:"1 \xB7 Build a crystal",goal:'Make an argon crystal and watch what "solid" means at the atomic scale: atoms vibrating about fixed lattice sites.',setup:{build:{el:"Ar",cells:4,start:"fcc",rho:1.08,T0:20},TsetK:20},steps:["Load the setup: 256 argon atoms in an FCC lattice at 20 K.","Use the tweezers to push one atom out of place and let go. Where does it go?","On RUN, set colour to Coordination: every atom has Z \u2248 12 neighbours.","Open the g(r) plot: sharp peaks near 1.1\u03C3, 1.6\u03C3 and 1.9\u03C3. Read the first peak position in nm."],ask:"Experimental solid argon has nearest neighbours at 0.376 nm. How well does the model agree?"},{title:"2 \xB7 Melt the crystal",goal:"Heat a crystal in small steps and find the temperature at which order is lost.",setup:{build:{el:"Ar",cells:5,start:"fcc",rho:.96,T0:30},TsetK:30},steps:["Load the setup (500 atoms at 30 K, thermostat on).","Raise the target temperature by about 10 K at a time (RUN tab, or right thumbstick in VR). Wait ~20 ps after each step.",'Watch "Looks like", the coordination colours, the width of the g(r) peaks and the MSD curve.',"Record a row (DATA tab) just below and just above the melting point, then cool it down again. Does it recrystallise at the same T?"],ask:"Real argon melts at 83.8 K at low pressure. Here the volume is fixed, so the pressure rises on heating. Why does that change the melting temperature? What does hysteresis tell you about the finite box?"},{title:"3 \xB7 Energy conservation and the time step",goal:"In an isolated system (no thermostat) the total energy must stay constant - if the integrator is good enough.",setup:{build:{el:"Ar",cells:4,start:"fcc",rho:.85,T0:300},TsetK:100,equil:[[500,300],[500,100]],thermo:!1},steps:["Load the setup: a liquid argon sample, equilibrated, then released with the thermostat OFF (NVE).","In the energy plot, kinetic and potential energy trade places but the green total stays flat.","On RUN, increase the time step to 0.01, then 0.02. Watch the total energy.","Rebuild and find the largest time step with drift below 0.1 meV per atom over 50 ps."],ask:"Why does the error grow with the time step? What is the fastest motion in this system that the step must resolve?"},{title:"4 \xB7 Pressure of a gas (Boyle\u2019s law)",goal:"Compress a dilute gas at constant temperature and test p \xB7 V = N k T.",setup:{build:{el:"Ar",cells:5,start:"gas",rho:.05,T0:300},TsetK:300},steps:["Load the setup: 500 argon atoms at 300 K and low density.","Wait for the pressure to settle, then press Record row on the DATA tab.","Squeeze the box with the density slider (RUN tab), or the left thumbstick in VR. Record at several densities.","Compare the recorded pressure with the ideal-gas value \u03C1* T* \xD7 419 bar. At what density does the gas stop being ideal?"],ask:"Switch to Hard walls (RUN tab). Pressure is now measured from collisions with the walls. Does it agree with the periodic-box result?"},{title:"5 \xB7 Diffusion in a liquid",goal:"Follow a single atom through a liquid and measure the diffusion constant from the mean-square displacement.",setup:{build:{el:"Ar",cells:5,start:"fcc",rho:.84,T0:300},TsetK:90,equil:[[800,300],[800,90]]},steps:["Load the setup: liquid argon near its triple point (90 K).","The large yellow atom is tagged; its trail shows the random walk. Compare with the crystal of task 1.","DATA tab: D is estimated as MSD / (6 t) from each finished window; wait for two windows.","Change the target temperature to 70 K, 90 K, 110 K and 130 K, recording D each time. Plot ln D against 1/T."],ask:"Experimental liquid argon at 90 K has D of order 2\xD710\u207B\u2079 m\xB2/s. What is the activation energy from your plot?"},{title:"6 \xB7 Condensation",goal:"Cool a gas below its critical temperature and watch droplets nucleate.",setup:{build:{el:"Ar",cells:5,start:"gas",rho:.12,T0:200},TsetK:200,dt:.006,speed:20},steps:["Load the setup: 500 argon atoms at 200 K, above the critical point (about 151 K in experiment).","Set the target to 90 K and colour by Coordination. A droplet needs a few hundred ps to form - be patient or raise the speed.","Watch the pressure and potential energy fall as atoms bind to the cluster.","Heat the droplet again and find the temperature at which it evaporates completely."],ask:"Why does the pressure fall as the droplet grows although the temperature is constant?"},{title:"7 \xB7 Defects and free play",goal:"Make a vacancy, an interstitial and a surface, and see how the lattice reacts.",setup:{build:{el:"Ar",cells:4,start:"fcc",rho:1,T0:15},TsetK:15},steps:["Pick the Delete tool (BUILD tab, or button A/X in VR) and remove one atom. Colour by Coordination: its 12 neighbours now have Z = 11.","Warm the crystal to 60 K and track the tagged atom: does the vacancy hop?","Expand the box slowly (density slider on RUN, 1.0 \u2192 0.8). The stretched crystal is under tension - look for voids opening up.","Switch element to Ne or Xe (BUILD) and compare how easily each melts - the energy scale is \u03B5/k."],ask:"Which atoms vibrate most strongly: bulk atoms, surface atoms or neighbours of the vacancy?"},{title:"8 \xB7 Benzene",goal:"A real molecule: six carbons and six hydrogens in a flat ring. Watch it vibrate, then let seven molecules find out how benzene sticks together.",setup:{build:{sys:"mat",mat:"benzene",nmol:1,Tm:300},TsetK:300,speed:20},steps:["Load the setup: one benzene molecule at 300 K. Bonds are drawn as sticks, white = H, grey = C.","Open the Pair distances plot: peaks at 1.08 \xC5 (C\u2013H), 1.40 \xC5 (C\u2013C), 2.42 \xC5 and 2.80 \xC5 (meta and para carbons).","Pick Grab: molecule and pull it. Raise the temperature to 1500 K: the ring stays flat but wobbles; the C\u2013H stretch (3060 cm\u207B\xB9) has a period of about 11 fs.","Now go to BUILD, choose Benzene with 7 molecules at 100 K and let it relax: look for the molecules lining up edge-to-face (T-shaped), driven by the partial charges."],ask:"Why do neighbouring benzene rings prefer a T-shaped or slipped-parallel arrangement and not sitting directly face-to-face?"},{title:"9 \xB7 Graphene",goal:"A single sheet of carbon atoms. Heat it, watch it ripple, and tear a hole in it.",setup:{build:{sys:"mat",mat:"graphene",size:10,Tm:300},TsetK:300,speed:8},steps:["Load the setup: a periodic sheet at 300 K (bond 1.44 \xC5 in this potential; experiment 1.42 \xC5). Every atom has three bonds.","Rotate the view to see the sheet edge-on: thermal ripples grow with temperature. Try 1000 K and 2000 K.","Delete one atom with the Delete tool. Colour by Defects: three neighbours now have only two bonds. Watch whether the hole reconstructs into a pentagon and a nine-ring.","Delete a short line of atoms and heat to 2500 K: where does the sheet fail first?"],ask:"Why can a layer one atom thick be so strong and still ripple so easily?"},{title:"10 \xB7 Graphite and van der Waals",goal:"Graphite is graphene layers held together only by weak van der Waals forces. Peel one layer off and measure the force.",setup:{build:{sys:"mat",mat:"graphite",size:7,layers:3,Tm:100},TsetK:100,speed:6},steps:["Load the setup: three AB-stacked layers at 100 K, spaced 3.35 \xC5 apart.","Choose Tweezers with Grab: layer, aim at the top layer and pull upwards slowly. The footer shows the tweezer force in nN.","Pull slowly: the reading is the force in the tweezer spring and it peaks just before the layer lets go. Lift the layer 6 \xC5 and note the largest force; per atom it should be a few tens of meV/\xC5. Release: the layer falls back and re-stacks.","Estimate the work (force \xD7 distance) and divide by the number of atoms in the layer. The binding energy of graphite is about 50 meV per atom.","Slide the top layer sideways instead of lifting it. Is it easier or harder?"],ask:"Why is sliding along the layers so much easier than pulling them apart? What does that say about graphite as a lubricant and as pencil lead?"},{title:"11 \xB7 MoS\u2082 layers",goal:"A transition-metal dichalcogenide: each layer is a Mo plane between two S planes. Compare it with graphite.",setup:{build:{sys:"mat",mat:"mos2",size:7,layers:2,Tm:300},TsetK:300,speed:6},steps:["Load the setup: a 2H bilayer at 300 K. Mo atoms are teal, S yellow; each Mo has six S neighbours.","Colour by Defects: edges and surface atoms stay blue (the S atoms keep their three Mo bonds).","Grab one layer and slide it. The footer shows the force. Compare with task 10.","Heat the bilayer in steps up to 700 K and watch the layer thickness (S\u2013S distance across one layer). Then go above 800 K and wait: the lattice collapses into a dense, much lower-energy state that real MoS\u2082 does not have."],ask:"The potential gives a = 3.12 \xC5 (experiment 3.16 \xC5) and fails above ~800 K. What does that tell you about trusting any force field outside the conditions it was fitted for?"},{title:"12 \xB7 Nanodiamond",goal:"A nanometre-sized piece of diamond, cut from the lattice. Its surface is bare, so see what the atoms do about their dangling bonds.",setup:{build:{sys:"mat",mat:"nanodiamond",rad:7,Tm:300},TsetK:300,speed:8},steps:["Load the setup: a diamond cluster about 1.4 nm across. Colour by Defects: the core (4 bonds) is blue and the surface is red.","Heat to 1500 K and then 2500 K in steps. Watch how the surface atoms rearrange.","Compare the Pair distances plot at 300 K and 2500 K: diamond has a peak at 1.54 \xC5 (sp\xB3); graphite-like carbon (sp\xB2) has one near 1.42 \xC5.","Cool it back to 300 K. Is it still diamond?"],ask:"Real nanodiamonds have hydrogen or oxygen on the surface. What would change here if every dangling bond were capped?"},{title:"13 \xB7 Current through graphene",goal:"Put two electrodes on a graphene flake and watch where the electrons go - while the atoms keep moving.",setup:{build:{sys:"mat",mat:"graphene",size:10,Tm:100,open:!0},TsetK:100,speed:6,contacts:"ends",tab:"ELEC"},steps:["Load the setup: an open graphene flake (no periodic boundaries, free edges) at 100 K, with electrodes on the two short ends. Blue atoms are the \u2212 contact (electrons enter), red atoms the + contact.","The ELEC tab shows the result. The arrows are the bond currents (conventional current, from + to \u2212): larger and warmer = more current. The plots show the transmission T(E) and the current I(V).","Move the electrodes with the \u2212 and + contact tools: click (or drag over) atoms to add them, click again to remove. Try one atom at each end, then a whole edge.","Delete a few atoms in the middle, or stretch the flake with the tweezers. The current finds its way round the hole, and the I(V) curve changes."],ask:"Graphene has no band gap. How can you see that in T(E) and I(V)? Where in the flake does most of the current run, and why?"},{title:"14 \xB7 Quantum interference in benzene",goal:"The same molecule, the same electrodes - but where you attach them decides whether the waves add up or cancel.",setup:{build:{sys:"mat",mat:"benzene",nmol:1,Tm:20},TsetK:20,speed:4,contacts:[[0],[3]],tab:"ELEC",bias:.5},steps:["Load the setup: one benzene molecule at 20 K with the electrodes on opposite carbon atoms (para).","Read T(E_F) and the current on the ELEC tab. Benzene has a gap of about 5 eV, so the current is small - but not zero.","Press Clear contacts and put the + contact two carbons round the ring from the \u2212 contact (meta). The current drops by a factor of a few hundred: the two paths round the ring cancel.","Try ortho (neighbouring carbons). Then raise the bias towards 6 V: when the bias window reaches a molecular level the current jumps (resonant tunnelling)."],ask:"The electron has the same distance to travel in all three cases. Why does meta conduct so much worse at low bias?"},{title:"15 \xB7 Decorate graphene",goal:"Attach atoms to a graphene flake and watch the carbon underneath change from flat (sp\xB2) to tetrahedral (sp\xB3) - and what that does to the current.",setup:{build:{sys:"mat",mat:"graphene",size:10,Tm:100,open:!0,chem:!0},TsetK:100,speed:6,contacts:"ends",tab:"ELEC"},steps:["Load the setup: an open graphene flake in the chemistry mode (explicit bonds, any main-group element), with electrodes on the two ends. Note the current.","BUILD \u2192 Edit by hand: choose Attach and F, then click a carbon in the middle. The carbon gets a fourth bond, becomes sp\xB3 and pops out of the sheet by about 0.4 \xC5; its three C\u2013C bonds stretch from 1.42 to about 1.51 \xC5. Rotate the view to see the pucker.",'On the ELEC tab: the sp\xB3 carbon has lost its \u03C0 orbital, so the current has to go round it. Attach H, F and OH (O with "Fill valence with H") across the middle and watch T(E): the band is blocked, while broken \u03C0 bonds leave localised states near E_F that can even carry current resonantly on a small flake.',"Attach on both sides of the sheet, or put two atoms on neighbouring carbons. Use the tweezers to pull an F off: the bond snaps at 1.6\xD7 its length and the carbon flattens again."],ask:"Why does one attached atom hurt the current so much more than its size suggests? What would full coverage (graphane, fluorographene) do?"}],Or=[{title:"Quest + PC (Meta Horizon Link)",lines:["1.  Connect the Quest to the PC (Link cable or Air Link) and start Link in the headset. In the Meta Horizon Link app on the PC: Settings \u2192 General \u2192 OpenXR runtime = Meta Horizon Link.","2.  Open this page in Chrome or Edge on the PC (http://localhost or https, not file://) and press Enter VR once.","3.  If the headset only shows a loading screen: an earlier Chrome session is still holding Link. Close Chrome completely (Task Manager \u2192 End task), restart Link in the headset and try again.",'4.  Windows: set Chrome to "High performance" in Settings \u2192 System \u2192 Display \u2192 Graphics, so it uses the same graphics card as Link.']},{title:"Quest + PC via SteamVR",lines:["1.  Connect the headset to the PC (Link cable, Air Link, Steam Link or Virtual Desktop) and start SteamVR.",'2.  In SteamVR, open Settings \u2192 Developer and choose "Set SteamVR as OpenXR runtime".',"3.  Open this page in Chrome or Edge on the PC and press Enter VR. The simulation then runs inside SteamVR on the headset. Local files need http://localhost, not file://.","4.  If the Meta Quest Link app is the active OpenXR runtime instead, the session opens there - that works too."]},{title:"Standalone Quest (no PC)",lines:["Open the Meta Quest Browser, go to the address of this page and press Enter VR (HTTPS is required).","The simulation runs on the headset\u2019s own processor, so it is slower. Use up to ~500 atoms and the default settings; use the PC route for 1000+ atoms.","Quest 2, 3, 3S and Pro and any other WebXR headset with controllers work. Hand tracking is not used."]},{title:"Controls in VR",lines:["Point at the panel with a controller ray and pull the TRIGGER to press buttons or drag sliders.","Aim at atoms and hold the TRIGGER with the Tweezers tool: the atom follows your hand through a spring. Push the thumbstick forward or back to reel it in or out.","GRIP (the button under your middle finger) while pointing at a panel: move the panel. GRIP anywhere else: pick up and turn the experiment. BOTH GRIPS: pull your hands apart to make it bigger, together to make it smaller, twist to turn it.","LEFT stick: walk (glide) in the direction you look, also while seated.  RIGHT stick left/right: turn (30\xB0 steps, or smooth - VR tab).  RIGHT stick up/down: heat or cool (target T). Box size and table height: sliders on the RUN and VR tabs.","A / X: next tool.  B / Y: run or pause.  Thumbstick click: recentre in front of you.","The TOOLBAR at the front edge of the table holds the editing tools and the element button (periodic table). Trigger on a button to use it.","Recentring also fits the table and the panels to your eye height, seated or standing. The VR tab has a table-height slider and a dark / white lab switch."]},{title:"Electron transport: how it is modelled",lines:["One \u03C0 (p) orbital per carbon atom, pointing along the local normal of its bonds. Hopping between orbitals follows their actual distance and angle (Slater-Koster form, -2.7 eV at 1.42 \xC5), so stretching, rippling and the graphite interlayer coupling all enter.","Electrodes are wide-band contacts on the marked atoms. T(E), the current I = (2e\xB2/h) \u222B T(E)[f\u208B - f\u208A] dE and the bond currents come from the Green\u2019s function, recomputed from the live geometry a few times a second.","The bias only sets the energy window (no self-consistent potential drop). Hydrogen carries no orbital; MoS\u2082 needs a d-orbital model and is not supported. Use Open flake for sheets: on a periodic sheet the current can also run round the boundary."]},{title:"Materials: how they are modelled",lines:["Graphene, graphite and nanodiamond use the Tersoff bond-order potential for carbon: bonds can stretch, break and re-form. Graphene uses the Lindsay-Broido parameters, diamond the original Tersoff set.",'MoS\u2082 uses Jiang\u2019s Stillinger-Weber potential (LAMMPS "sw/mod"). Benzene uses an OPLS-style molecular force field with partial charges; it cannot break.',"Layers and molecules attract each other through Lennard-Jones van der Waals terms tuned to the graphite binding energy (about 50 meV per atom) and the MoS\u2082 interlayer spacing and binding (0.2 J/m\xB2).","Energies and forces of the Tersoff and Stillinger-Weber models were checked against LAMMPS (agreement 10\u207B\xB9\xB2 eV). Pressure is not computed for materials."]},{title:"The model",lines:["Atoms interact through the Lennard-Jones potential, V = 4\u03B5[(\u03C3/r)\xB9\xB2 \u2212 (\u03C3/r)\u2076], cut off and shifted at 2.5\u03C3. Velocity-Verlet integration, cell + neighbour lists, Berendsen thermostat.","Everything is computed in reduced units and shown in real units for the chosen noble gas (\u03C3, \u03B5, m). One time unit is about 2.16 ps for argon.","Pressure uses the virial (periodic box) or wall collisions (hard walls). No long-range tail corrections are applied.","Coordination counts neighbours within 1.4\u03C3. D = MSD/(6t)."]}];Rd("da",Dd);var Qi=new Image;Qi.src=Nd;var Ua=new ya(tr),Z=new Sa(1200),G=Ua,xt={sys:"mat",el:"Ar",cells:4,start:"fcc",rho:1,T0:30,mat:"graphene",size:10,layers:3,nmol:7,rad:7,Tm:300,open:!0,chem:!1},w_={empty:{Tm:50},benzene:{nmol:7,Tm:100},graphene:{size:8,Tm:300},graphite:{size:7,layers:3,Tm:300},mos2:{size:7,layers:2,Tm:300},nanodiamond:{rad:7,Tm:300}},Ud={benzene:"OPLS-style force field: bonds, angles, planarity; LJ + charges between molecules.",graphene:"Tersoff carbon (Lindsay-Broido): covalent bonds that can break and re-form.",graphite:"Tersoff layers + Lennard-Jones van der Waals between layers (AB stacking).",mos2:"Stillinger-Weber (Jiang) layers + van der Waals between layers (2H stacking).",nanodiamond:"Tersoff carbon cluster cut from diamond. Bare surface: it can reconstruct.",empty:"An empty box: place atoms with Add, connect them with Bond, grow molecules with Attach.",cnt:"Single-wall carbon nanotube rolled from graphene (Tersoff carbon). Set (n, m) and length on the SYSTEMS tab.",c60:"Buckminsterfullerene C60 (Tersoff carbon).",hbn:"Hexagonal boron nitride on the chemistry model (UFF, explicit bonds).",junction:"Benzene rings between gold pads (held fixed), thiol anchors, chemistry model. Contacts on the anchor carbons."},T_="Chemistry: explicit bonds on the Universal Force Field (UFF). Attach any main-
