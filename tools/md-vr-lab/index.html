<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD Lab VR – build and run a molecular-dynamics simulation in virtual reality</title>
<meta name="description" content="Build and run a Lennard-Jones molecular-dynamics simulation of argon, neon, krypton or xenon in WebXR: Meta Quest browser, Quest via SteamVR/OpenXR on a PC, or desktop with mouse. Runs offline.">
<meta name="color-scheme" content="dark">
<style>
  html,body{margin:0;height:100%;background:#070b13;color:#e8eef8;font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #top{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:10px 14px;pointer-events:none;z-index:5}
  #top>*{pointer-events:auto}
  #top .brand{font-weight:700;letter-spacing:.04em;color:#4ae3e1;font-size:15px;text-shadow:0 1px 6px #000}
  #top .sub{color:#9fb2cf;font-size:12px;flex:1;text-shadow:0 1px 6px #000}
  #top a{color:#9fb2cf;font-size:12px}
  button.b{font:600 13px system-ui,sans-serif;color:#e8eef8;background:#1d2a45;border:1px solid #2a3a5c;border-radius:10px;padding:8px 12px;cursor:pointer}
  button.b:hover{border-color:#4ae3e1}
  button.b.on{background:#17696a;border-color:#4ae3e1}
  #uiWrap{position:fixed;top:54px;right:10px;z-index:4}
  #uiWrap canvas{display:block;width:min(430px,94vw,calc((100vh - 66px)*800/1160));aspect-ratio:800/1160;height:auto;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
  #plotWrap{position:fixed;left:10px;bottom:10px;z-index:4}
  #plotWrap canvas{display:block;width:min(540px,46vw);aspect-ratio:1024/860;height:auto;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.55);opacity:.97}
  #hint{position:fixed;left:14px;top:50px;color:#8798b6;font-size:12px;line-height:1.5;text-shadow:0 1px 6px #000;z-index:3;pointer-events:none}
  #hint b{color:#cfe0ff;font-weight:600}
  @media (max-width:760px){#hint{display:none}}
</style>
</head>
<body>
<div id="top">
  <span class="brand">MD LAB&nbsp;VR</span>
  <span class="sub">Lennard-Jones molecular dynamics · DEX · 2DPHYS</span>
  <button class="b" id="panelBtn">Panel</button>
  <button class="b" id="plotBtn">Plots</button>
  <button class="b" id="vrBtn">Checking VR…</button>
  <a href="../../index.html">← DEX tools</a>
</div>
<div id="hint"><b>Mouse:</b> drag atoms with the tweezers · drag empty space to orbit · right-drag to pan · wheel to zoom<br><b>Keys:</b> space run/pause · 1 2 3 tools · R rebuild · P plots</div>

me T?"],ask:"Real argon melts at 83.8 K at low pressure. Here the volume is fixed, so the pressure rises on heating. Why does that change the melting temperature? What does hysteresis tell you about the finite box?"},{title:"3 \xB7 Energy conservation and the time step",goal:"In an isolated system (no thermostat) the total energy must stay constant - if the integrator is good enough.",setup:{build:{el:"Ar",cells:4,start:"fcc",rho:.85,T0:300},TsetK:100,equil:[[500,300],[500,100]],thermo:!1},steps:["Load the setup: a liquid argon sample, equilibrated, then released with the thermostat OFF (NVE).","In the energy plot, kinetic and potential energy trade places but the green total stays flat.","On RUN, increase the time step to 0.01, then 0.02. Watch the total energy.","Rebuild and find the largest time step with drift below 0.1 meV per atom over 50 ps."],ask:"Why does the error grow with the time step? What is the fastest motion in this system that the step must resolve?"},{title:"4 \xB7 Pressure of a gas (Boyle\u2019s law)",goal:"Compress a dilute gas at constant temperature and test p \xB7 V = N k T.",setup:{build:{el:"Ar",cells:5,start:"gas",rho:.05,T0:300},TsetK:300},steps:["Load the setup: 500 argon atoms at 300 K and low density.","Wait for the pressure to settle, then press Record row on the DATA tab.","Squeeze the box with the density slider (RUN tab), or the left thumbstick in VR. Record at several densities.","Compare the recorded pressure with the ideal-gas value \u03C1* T* \xD7 419 bar. At what density does the gas stop being ideal?"],ask:"Switch to Hard walls (RUN tab). Pressure is now measured from collisions with the walls. Does it agree with the periodic-box result?"},{title:"5 \xB7 Diffusion in a liquid",goal:"Follow a single atom through a liquid and measure the diffusion constant from the mean-square displacement.",setup:{build:{el:"Ar",cells:5,start:"fcc",rho:.84,T0:300},TsetK:90,equil:[[800,300],[800,90]]},steps:["Load the setup: liquid argon near its triple point (90 K).","The large yellow atom is tagged; its trail shows the random walk. Compare with the crystal of task 1.","DATA tab: D is estimated as MSD / (6 t) from each finished window; wait for two windows.","Change the target temperature to 70 K, 90 K, 110 K and 130 K, recording D each time. Plot ln D against 1/T."],ask:"Experimental liquid argon at 90 K has D of order 2\xD710\u207B\u2079 m\xB2/s. What is the activation energy from your plot?"},{title:"6 \xB7 Condensation",goal:"Cool a gas below its critical temperature and watch droplets nucleate.",setup:{build:{el:"Ar",cells:5,start:"gas",rho:.12,T0:200},TsetK:200,dt:.006,speed:20},steps:["Load the setup: 500 argon atoms at 200 K, above the critical point (about 151 K in experiment).","Set the target to 90 K and colour by Coordination. A droplet needs a few hundred ps to form - be patient or raise the speed.","Watch the pressure and potential energy fall as atoms bind to the cluster.","Heat the droplet again and find the temperature at which it evaporates completely."],ask:"Why does the pressure fall as the droplet grows although the temperature is constant?"},{title:"7 \xB7 Defects and free play",goal:"Make a vacancy, an interstitial and a surface, and see how the lattice reacts.",setup:{build:{el:"Ar",cells:4,start:"fcc",rho:1,T0:15},TsetK:15},steps:["Pick the Delete tool (BUILD tab, or button A/X in VR) and remove one atom. Colour by Coordination: its 12 neighbours now have Z = 11.","Warm the crystal to 60 K and track the tagged atom: does the vacancy hop?","Expand the box slowly (density slider on RUN, 1.0 \u2192 0.8). The stretched crystal is under tension - look for voids opening up.","Switch element to Ne or Xe (BUILD) and compare how easily each melts - the energy scale is \u03B5/k."],ask:"Which atoms vibrate most strongly: bulk atoms, surface atoms or neighbours of the vacancy?"}],Xs=[{title:"Quest + PC via SteamVR",lines:["1.  Connect the headset to the PC (Link cable, Air Link, Steam Link o
