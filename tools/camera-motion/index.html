<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Pendulum Camera</title>
<!--
  Film the projected pendulum (a BLUE sphere on a white projector screen) and
  measure its frequency. Finds the blue sphere by itself, at whatever size it
  appears from wherever you sit; tap the screen to point it at something else.
  SUBMIT sends the result to the Teaching Hub (Supabase, app "camera-motion",
  or ?send=<app>). All video stays on the phone.
  Backup of the previous (general-purpose) version: backups - dont use these unless told to/
-->
<style>
  :root{--ink:#111;--mut:#666;--acc:#c8102e;--green:#0a7a3d;--blue:#0b5fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#fff;color:var(--ink)}
  body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:10px 12px 24px;max-width:640px;margin:0 auto;touch-action:manipulation;-webkit-text-size-adjust:100%}
  #stage{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden;
    min-height:200px;display:flex;align-items:center;justify-content:center;touch-action:none}
  #video{width:100%;height:auto;max-height:68vh;object-fit:contain;display:block;background:#000}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:17px;text-align:center;padding:20px;line-height:1.5}
  .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}
  button{font:700 15px/1 inherit;letter-spacing:.04em;padding:0 4px;min-height:58px;border-radius:12px;
    border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
  #bCam{background:var(--ink);color:#fff}
  #bStart{background:var(--green);border-color:var(--green);color:#fff}
  #bStop{background:var(--acc);border-color:var(--acc);color:#fff}
  #bSubmit{background:var(--blue);border-color:var(--blue);color:#fff}
  button:disabled{opacity:.28}
  button:active:not(:disabled){transform:translateY(1px)}
  #status{font-size:15px;font-weight:600;min-height:22px;text-align:center}
  #status.ok{color:var(--green)} #status.warn{color:var(--acc)} #status.info{color:var(--mut);font-weight:500}
  .privacy{font-size:12px;color:#999;text-align:center;margin-top:6px}
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="placeholder">Press&nbsp;<b>CAMERA</b>&nbsp;and point the phone at the swinging blue ball</div>
</div>

<div class="btns">
  <button id="bCam">CAMERA</button>
  <button id="bStart" disabled>START</button>
  <button id="bStop" disabled>STOP</button>
  <button id="bSubmit" disabled>SUBMIT</button>
</div>
<div id="status" class="info">Camera off</div>
<div class="privacy">The ball is found automatically – tap the image to point at something else. Video never leaves your phone.</div>

<script>
"use strict";
(function(){

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const fin = v => typeof v === "number" && isFinite(v);
const video = $("video"), overlay = $("overlay"), octx = overlay.getContext("2d"), stage = $("stage");

/* =========================================================================
   Teaching Hub (Supabase). The publishable key can only ADD a result.
   ========================================================================= */
const HUB = { url:"https://waktaohjndbhswareqzk.supabase.co", key:"sb_publishable_w3U495HfA5hOYZrMUETBpA_uyX7EIgg" };
const SEND_APP = (function(){
  try { const a = new URLSearchParams(location.search).get("send");
        return (a && /^[a-z0-9][a-z0-9-]{1,47}$/.test(a)) ? a : "camera-motion"; } catch(e){ return "camera-motion"; }
})();

/* =========================================================================
   State
   ========================================================================= */
const S = {
  stream:null, cameraOn:false, measuring:false,
  model:{ kind:"blue" },         // what we look for: the blue ball, or a tapped colour
  lock:null,                     // {x,y,r} in VIDEO pixels, or null = searching
  vel:{x:0,y:0}, lastT:0, missing:0,
  trail:[],
  t:[], x:[], y:[], t0:null, frames:0, lost:0,
  live:null, lastLive:0,
  result:null, resultId:null, sentId:null, sending:false,
  lastMedia:-1
};

function status(msg, kind){ const el = $("status"); el.textContent = msg; el.className = kind || "info"; }

/* =========================================================================
   DETECTION
   -------------------------------------------------------------------------
   Nothing here assumes how big the ball is: people film the projector from
   anywhere in the room, so it may be 6 pixels or 200 across. The search
   finds the bluest compact blob at whatever size it is, and afterwards the
   tracker sizes its search window from the ball's own measured radius.

   Blueness = B - max(R,G): about zero on the white screen (even a bluish
   projector white), large on the ball, and still positive on its shaded
   side. The threshold is set from the ball itself (a fraction of its own
   peak), so a washed-out or dim projection works too.

   Centre = row-span centroid: each row of the blob is filled from its left
   to its right edge (edges located to a fraction of a pixel by
   interpolating the threshold crossing), so a white highlight or a dark
   shadow inside the ball does not pull the centre sideways.
   ========================================================================= */
function scoreFn(m){
  if (m.kind === "blue") return (r,g,b) => b - (r > g ? r : g);
  const tol = m.tol;
  return (r,g,b) => {
    const s = r + g + b;
    if (s < 60) return -100;
    const k = 1/s, dr = r*k - m.cr, dg = g*k - m.cg, db = b*k - m.cb;
    return 100 * (1 - Math.sqrt(dr*dr + dg*dg + db*db) / tol);
  };
}
const minThr = m => m.kind === "blue" ? 28 : 25;

let SC = null, LAB = null, STK = null, CAP = 0;
function bufs(n){ if (n > CAP){ CAP = n; SC = new Float32Array(n); LAB = new Int32Array(n); STK = new Int32Array(n); } }

// Score every pixel, choose a threshold from the image itself, label blobs.
function blobs(img, w, h, model, maxBlobs){
  const n = w*h; bufs(n);
  const d = img.data, f = scoreFn(model);
  const hist = new Uint32Array(512);
  for (let i = 0, p = 0; i < n; i++, p += 4){
    const s = f(d[p], d[p+1], d[p+2]); SC[i] = s;
    hist[clamp(Math.round(s) + 256, 0, 511)]++;
  }
  // peak = the 8th-highest score: robust to a few hot pixels, independent of ball size
  let cum = 0, peak = -256;
  for (let k = 511; k >= 0; k--){ cum += hist[k]; if (cum >= 8){ peak = k - 256; break; } }
  const thr = Math.max(minThr(model), 0.42 * peak);
  if (peak < minThr(model) * 1.4) return { list:[], thr };

  LAB.fill(0, 0, n);
  const list = [];
  for (let seed = 0; seed < n; seed++){
    if (SC[seed] < thr || LAB[seed]) continue;
    const id = list.length + 1;
    let sp = 0; STK[sp++] = seed; LAB[seed] = id;
    let area = 0, sx = 0, sy = 0, ss = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
    while (sp){
      const p = STK[--sp], py = (p / w) | 0, px = p - py*w;
      area++; sx += px; sy += py; ss += SC[p];
      if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
      if (px > 0     && SC[p-1] >= thr && !LAB[p-1]){ LAB[p-1] = id; STK[sp++] = p-1; }
      if (px < w - 1 && SC[p+1] >= thr && !LAB[p+1]){ LAB[p+1] = id; STK[sp++] = p+1; }
      if (py > 0     && SC[p-w] >= thr && !LAB[p-w]){ LAB[p-w] = id; STK[sp++] = p-w; }
      if (py < h - 1 && SC[p+w] >= thr && !LAB[p+w]){ LAB[p+w] = id; STK[sp++] = p+w; }
    }
    list.push({ id, area, cx:sx/area + .5, cy:sy/area + .5, mean:ss/area, x0, x1, y0, y1 });
    if (list.length >= (maxBlobs || 200)) break;
  }
  return { list, thr };
}

// How much a blob looks like a ball: solid, round, and strongly coloured.
function ballness(b){
  const bw = b.x1 - b.x0 + 1, bh = b.y1 - b.y0 + 1;
  const fill = b.area / (bw * bh);                      // 0.785 for a disc
  const aspect = Math.min(bw, bh) / Math.max(bw, bh);
  const round = clamp(1 - Math.abs(fill - 0.785) / 0.45, 0, 1) * aspect;
  return b.mean * round * round * round;   // cubed: shapes that are not round lose hard. NO size term - the ball may be any size
}

// Sub-pixel centre of a blob by row spans (see the note above).
function spanCentre(w, b, thr){
  let A = 0, Ax = 0, Ay = 0;
  for (let y = b.y0; y <= b.y1; y++){
    let l = -1, r = -1;
    const row = y*w;
    for (let x = b.x0; x <= b.x1; x++) if (LAB[row + x] === b.id){ if (l < 0) l = x; r = x; }
    if (l < 0) continue;
    let le = l, re = r + 1;
    if (l > 0){ const s0 = SC[row+l-1], s1 = SC[row+l]; if (s1 > s0) le = (l - .5) + clamp((thr - s0)/(s1 - s0), 0, 1); }
    if (r < w-1){ const s0 = SC[row+r], s1 = SC[row+r+1]; if (s0 > s1) re = (r + .5) + clamp((s0 - thr)/(s0 - s1), 0, 1); }
    const len = Math.max(0, re - le);
    A += len; Ax += len * (le + re) / 2; Ay += len * (y + .5);
  }
  if (A <= 0) return null;
  return { x: Ax/A, y: Ay/A, r: Math.sqrt(A / Math.PI) };
}

// Canvases: a small one for the whole-frame search, one for the close-up.
const low = document.createElement("canvas"), roi = document.createElement("canvas");
const lctx = low.getContext("2d", { willReadFrequently:true });
const rctx = roi.getContext("2d", { willReadFrequently:true });
const LOW_W = 480, ROI_MAX = 180;   // 480 wide: a ball only a few pixels across in a far-back seat is still resolved

// Whole frame, two steps: the coarse image proposes the strongest blue blobs, then each
// one is looked at in a full-resolution close-up and judged there — a ball only a few
// pixels across is round up close, while letters and logos in the same blue are not.
// near = a preferred point (a tap, or where the ball was last seen).
function searchFrame(vw, vh, near){
  const w = LOW_W, h = Math.max(2, Math.round(LOW_W * vh / vw));
  if (low.width !== w || low.height !== h){ low.width = w; low.height = h; }
  lctx.drawImage(video, 0, 0, w, h);
  const img = lctx.getImageData(0, 0, w, h);
  const { list } = blobs(img, w, h, S.model, 400);
  const k = vw / w;
  const cands = list.filter(b => b.area >= 2 && b.area <= 0.3*w*h);
  // shortlist: the strongest by colour and the most ball-like at coarse scale
  const byColour = cands.slice().sort((a,b) => b.mean*Math.sqrt(b.area) - a.mean*Math.sqrt(a.area)).slice(0, 8);
  const byShape  = cands.slice().sort((a,b) => ballness(b) - ballness(a)).slice(0, 6);
  const short = [...new Set(byColour.concat(byShape))];
  // Text comes in rows of similar blobs; the ball hangs on its own. Count look-alike neighbours.
  const crowd = b => {
    const R = 2.5 * Math.max(b.x1 - b.x0 + 1, b.y1 - b.y0 + 1);
    let n = 0;
    for (const o of cands) if (o !== b && o.area > 0.2*b.area && o.area < 5*b.area && Math.hypot(o.cx - b.cx, o.cy - b.cy) < R) n++;
    return n;
  };
  let best = null, bestS = 0;
  for (const b of short){
    const c = refine(vw, vh, b.cx*k, b.cy*k, Math.max(2, Math.sqrt(b.area/Math.PI) * k), true);
    if (!c) continue;
    let s = c.ball / (1 + crowd(b));
    if (near){ const dx = c.x - near.x, dy = c.y - near.y; s /= 1 + Math.sqrt(dx*dx + dy*dy) / (0.08 * vw); }
    if (s > bestS){ bestS = s; best = c; }
  }
  return best;
}

// Close-up at full camera resolution around a predicted point: the accurate centre.
// probe = true when we do not know the size yet (a candidate from searchFrame).
function refine(vw, vh, cx, cy, r, probe){
  const hs = clamp(3.2 * r + 6, 14, Math.min(vw, vh) * 0.45);
  const sx = clamp(cx - hs, 0, vw - 2*hs), sy = clamp(cy - hs, 0, vh - 2*hs), side = 2*hs;
  const n = Math.max(24, Math.min(ROI_MAX, Math.round(side)));
  const f = n / side;
  if (roi.width !== n){ roi.width = n; roi.height = n; }
  rctx.drawImage(video, sx, sy, side, side, 0, 0, n, n);
  const img = rctx.getImageData(0, 0, n, n);
  const { list, thr } = blobs(img, n, n, S.model, 60);
  const pcx = (cx - sx) * f, pcy = (cy - sy) * f, expA = Math.PI * (r*f) * (r*f);
  let best = null, bestS = 0;
  for (const b of list){
    if (b.area < 3) continue;
    if (!probe){
      const ratio = b.area / expA;
      if (ratio < 0.2 || ratio > 5) continue;         // relative to the ball's OWN size, never a fixed size
    }
    const dx = b.cx - pcx, dy = b.cy - pcy;
    const s = b.mean * b.area / (1 + Math.sqrt(dx*dx + dy*dy) / Math.max(3, r*f));
    if (s > bestS){ bestS = s; best = b; }
  }
  if (!best) return null;
  const c = spanCentre(n, best, thr);
  if (!c) return null;
  // ball = how ball-like this is, judged at full resolution (scaled back to camera pixels)
  // (a blob only a pixel or two across cannot show its shape, so it gets less trust)
  return { x: sx + c.x / f, y: sy + c.y / f, r: c.r / f, ball: ballness(best) * Math.min(1, Math.sqrt(best.area) / f / 5) };
}

/* =========================================================================
   ANALYSIS
   ========================================================================= */
function median(a){ if (!a.length) return 0; const s = a.slice().sort((p,q)=>p-q), m = s.length>>1; return s.length%2 ? s[m] : .5*(s[m-1]+s[m]); }
function movingAverage(a, w){
  const n = a.length, h = (w-1)>>1, o = new Array(n);
  for (let i = 0; i < n; i++){ let s = 0, c = 0; for (let k = Math.max(0,i-h); k <= Math.min(n-1,i+h); k++){ s += a[k]; c++; } o[i] = s/c; }
  return o;
}

// The swing is along an arc: project onto its main direction (largest variance).
function principal(x, y){
  const n = x.length; let mx = 0, my = 0;
  for (let i = 0; i < n; i++){ mx += x[i]; my += y[i]; } mx /= n; my /= n;
  let sxx = 0, syy = 0, sxy = 0;
  for (let i = 0; i < n; i++){ const a = x[i]-mx, b = y[i]-my; sxx += a*a; syy += b*b; sxy += a*b; }
  const th = 0.5 * Math.atan2(2*sxy, sxx - syy), ex = Math.cos(th), ey = Math.sin(th);
  const u = new Array(n);
  for (let i = 0; i < n; i++) u[i] = (x[i]-mx)*ex + (y[i]-my)*ey;
  return u;
}

// Upward zero crossings (with hysteresis); the period is the slope of a
// straight-line fit of crossing time against crossing number, so every crossing counts.
function crossingFrequency(t, x){
  const n = x.length; let mean = 0, mx = 0;
  for (const v of x) mean += v; mean /= n;
  const y = x.map(v => v - mean); for (const v of y) mx = Math.max(mx, Math.abs(v));
  const band = 0.2 * mx, cross = [];
  let armed = false;
  for (let i = 1; i < n; i++){
    if (y[i] < -band){ armed = true; continue; }
    if (armed && y[i] > band){
      let j = i; while (j > 0 && y[j-1] > 0) j--;
      if (j > 0){ const y0 = y[j-1], y1 = y[j]; cross.push(t[j-1] + (-y0) * (t[j]-t[j-1]) / (y1 - y0)); }
      armed = false;
    }
  }
  if (cross.length < 3) return null;
  const per = []; for (let i = 1; i < cross.length; i++) per.push(cross[i] - cross[i-1]);
  const med = median(per);
  if (per.some(p => p < 0.6*med || p > 1.4*med)){       // a missed or doubled crossing: use the clean periods only
    const good = per.filter(p => p > 0.6*med && p < 1.4*med);
    if (good.length < 2) return null;
    const T = good.reduce((a,b)=>a+b,0) / good.length;
    return { hz:1/T, periods:good.length };
  }
  const m = cross.length; let si = 0, st = 0, sii = 0, sit = 0;
  for (let i = 0; i < m; i++){ si += i; st += cross[i]; sii += i*i; sit += i*cross[i]; }
  const T = (m*sit - si*st) / (m*sii - si*si);
  return (T > 0) ? { hz:1/T, periods:m-1 } : null;
}

function estimate(){
  const n = S.t.length;
  if (n < 20) return null;
  const u = movingAverage(principal(S.x, S.y), 3);
  let mean = 0; for (const v of u) mean += v; mean /= n;
  let rms = 0; for (const v of u) rms += (v-mean)*(v-mean); rms = Math.sqrt(rms/n);
  if (rms < 0.5) return null;
  const f = crossingFrequency(S.t, u);
  if (!f || !(f.hz > 0.02 && f.hz < 30)) return null;
  return { hz:f.hz, periods:f.periods, amp:rms*Math.SQRT2, u };
}

/* =========================================================================
   Camera
   ========================================================================= */
async function startCamera(){
  if (S.cameraOn) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ status("No camera in this browser", "warn"); return; }
  $("bCam").disabled = true; status("Starting camera…");
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 }, frameRate:{ ideal:60 } }, audio:false });
  } catch(err){
    $("bCam").disabled = false;
    status((err && err.name === "NotAllowedError") ? "Camera permission denied – allow it and press CAMERA" : "Could not start the camera", "warn");
    return;
  }
  video.srcObject = S.stream;
  try { await video.play(); } catch(e){}
  // A bright projector makes phones over-expose; darken a little where the phone allows it.
  try {
    const tr = S.stream.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {};
    if (cap.exposureCompensation) await tr.applyConstraints({ advanced:[{ exposureCompensation: Math.max(cap.exposureCompensation.min, -1) }] });
  } catch(e){}
  try { if (navigator.wakeLock) S.wake = await navigator.wakeLock.request("screen"); } catch(e){}
  S.cameraOn = true;
  $("placeholder").style.display = "none";
  status("Looking for the blue ball…");
  buttons();
  scheduleFrame();
}
function stopCamera(){
  if (S.stream) S.stream.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
  S.stream = null; S.cameraOn = false;
}

/* =========================================================================
   Frame loop
   ========================================================================= */
const hasRVFC = typeof video.requestVideoFrameCallback === "function";
let pending = false;
function scheduleFrame(){
  if (pending || !S.cameraOn) return;
  pending = true;
  if (hasRVFC) video.requestVideoFrameCallback((now, meta) => { pending = false; onFrame(now, meta); });
  else requestAnimationFrame(now => { pending = false; onFrame(now, null); });
}

function onFrame(now, meta){
  if (!S.cameraOn) return;
  scheduleFrame();
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;

  // the frame's own timestamp where the browser gives it; otherwise the callback time
  let tms = now;
  if (meta && fin(meta.mediaTime) && meta.mediaTime > 0){
    if (meta.mediaTime === S.lastMedia) return;        // same frame delivered twice
    S.lastMedia = meta.mediaTime; tms = meta.mediaTime * 1000;
  }

  let found = null;
  try {
    if (S.lock){
      const dt = S.lastT ? clamp((tms - S.lastT)/1000, 0, 0.2) : 0;
      const px = S.lock.x + S.vel.x*dt, py = S.lock.y + S.vel.y*dt;
      found = refine(vw, vh, px, py, S.lock.r);
      if (!found && S.missing >= 3){                    // lost it: look over the whole frame, preferring where it was
        const g = searchFrame(vw, vh, S.lock);
        if (g) found = refine(vw, vh, g.x, g.y, g.r) || g;
      }
    } else {
      const g = searchFrame(vw, vh, null);
      if (g) found = refine(vw, vh, g.x, g.y, g.r) || g;
    }
  } catch(e){ return; }

  if (found){
    if (S.lock && S.lastT){
      const dt = (tms - S.lastT)/1000;
      if (dt > 0 && dt < 0.2){
        const k = 0.6;
        S.vel.x = k*(found.x - S.lock.x)/dt + (1-k)*S.vel.x;
        S.vel.y = k*(found.y - S.lock.y)/dt + (1-k)*S.vel.y;
      }
    }
    const firstLock = !S.lock;
    S.lock = { x:found.x, y:found.y, r: S.lock ? 0.8*S.lock.r + 0.2*found.r : found.r };
    S.missing = 0;
    S.trail.push({ x:found.x, y:found.y }); if (S.trail.length > 50) S.trail.shift();
    if (firstLock && !S.measuring){ status("Ball found – press START", "ok"); buttons(); }
  } else {
    S.missing++; S.vel.x *= 0.7; S.vel.y *= 0.7;
    if (S.missing > 20 && S.lock){ S.lock = null; S.trail.length = 0; if (!S.measuring) status("Looking for the blue ball…"); buttons(); }
  }
  S.lastT = tms;

  if (S.measuring){
    if (S.t0 === null) S.t0 = tms;
    S.frames++;
    if (found){ S.t.push((tms - S.t0)/1000); S.x.push(found.x); S.y.push(found.y); }
    else S.lost++;
    if (now - S.lastLive > 400){ S.lastLive = now; S.live = estimate(); }
    if (S.t.length > 30000) stop();
  }
  draw(vw, vh, found);
}

/* =========================================================================
   Overlay: the ring on the ball and the frequency, top left
   ========================================================================= */
function geom(vw, vh){
  const r = video.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const sc = Math.min(r.width/vw, r.height/vh);
  return { sc, ox: (r.left - sr.left) + (r.width - vw*sc)/2, oy: (r.top - sr.top) + (r.height - vh*sc)/2, sr };
}

function draw(vw, vh, found){
  const g = geom(vw, vh), dpr = Math.min(2, devicePixelRatio || 1);
  const W = Math.round(g.sr.width*dpr), H = Math.round(g.sr.height*dpr);
  if (overlay.width !== W || overlay.height !== H){ overlay.width = W; overlay.height = H; }
  octx.setTransform(dpr,0,0,dpr,0,0);
  octx.clearRect(0, 0, g.sr.width, g.sr.height);
  const P = p => ({ x: g.ox + p.x*g.sc, y: g.oy + p.y*g.sc });

  if (S.trail.length > 2){
    octx.strokeStyle = "rgba(255,210,0,.7)"; octx.lineWidth = 2; octx.beginPath();
    S.trail.forEach((p,i) => { const q = P(p); i ? octx.lineTo(q.x, q.y) : octx.moveTo(q.x, q.y); });
    octx.stroke();
  }
  if (S.lock){
    const c = P(S.lock), R = Math.max(10, S.lock.r * g.sc + 6);
    octx.strokeStyle = found ? "#00e676" : "#ff3b30"; octx.lineWidth = 3;
    octx.setLineDash(found ? [] : [6,5]);
    octx.beginPath(); octx.arc(c.x, c.y, R, 0, 2*Math.PI); octx.stroke(); octx.setLineDash([]);
    octx.beginPath(); octx.moveTo(c.x-4, c.y); octx.lineTo(c.x+4, c.y); octx.moveTo(c.x, c.y-4); octx.lineTo(c.x, c.y+4); octx.stroke();
  }

  // frequency box, top left
  let big, small;
  if (S.measuring){
    const secs = S.t.length ? S.t[S.t.length-1] : 0;
    big = S.live ? S.live.hz.toFixed(2) + " Hz" : "– Hz";
    small = "measuring " + secs.toFixed(0) + " s" + (S.live ? " · " + S.live.periods + " swings" : "");
  } else if (S.result){
    big = S.result.frequency_hz.toFixed(2) + " Hz";
    small = "period " + S.result.period_s.toFixed(2) + " s · " + S.result.periods + " swings";
  } else {
    big = "– Hz"; small = S.lock ? "ball found" : "looking for the blue ball";
  }
  const fs = clamp(g.sr.width / 11, 22, 46);
  const F1 = "700 " + fs + "px -apple-system,Segoe UI,Roboto,sans-serif", F2 = "500 " + (fs*0.36) + "px -apple-system,Segoe UI,Roboto,sans-serif";
  octx.font = F1; const w1 = octx.measureText(big).width;
  octx.font = F2; const w2 = octx.measureText(small).width;
  const bw = Math.max(w1, w2) + fs*0.6, bh = fs*1.65;
  octx.fillStyle = "rgba(0,0,0,.62)"; roundRect(8, 8, bw, bh, 10); octx.fill();
  octx.textBaseline = "top";
  octx.font = F1; octx.fillStyle = "#fff"; octx.fillText(big, 8 + fs*0.3, 8 + fs*0.12);
  octx.font = F2; octx.fillStyle = "#ddd"; octx.fillText(small, 8 + fs*0.3, 8 + fs*1.15);
}
function roundRect(x, y, w, h, r){ octx.beginPath(); octx.moveTo(x+r,y); octx.arcTo(x+w,y,x+w,y+h,r); octx.arcTo(x+w,y+h,x,y+h,r); octx.arcTo(x,y+h,x,y,r); octx.arcTo(x,y,x+w,y,r); octx.closePath(); }

/* =========================================================================
   Tap: point the tracker at what you touched
   ========================================================================= */
stage.addEventListener("pointerdown", ev => {
  if (!S.cameraOn) return;
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
  const g = geom(vw, vh);
  const x = (ev.clientX - g.sr.left - g.ox) / g.sc, y = (ev.clientY - g.sr.top - g.oy) / g.sc;
  if (x < 0 || y < 0 || x >= vw || y >= vh) return;

  // What is under the finger? A fingertip covers far more than a small ball, so do not
  // average the patch (that would be the white screen): look for the most colourful pixels in it.
  const side = Math.max(10, Math.round(Math.min(vw, vh) * 0.04));
  const N = 40;
  roi.width = roi.height = N;
  rctx.drawImage(video, clamp(x - side, 0, vw - 2*side), clamp(y - side, 0, vh - 2*side), 2*side, 2*side, 0, 0, N, N);
  const d = rctx.getImageData(0, 0, N, N).data, px = [];
  let blueMax = -999;
  for (let i = 0; i < d.length; i += 4){
    const r = d[i], g = d[i+1], b = d[i+2];
    blueMax = Math.max(blueMax, b - Math.max(r, g));
    px.push({ r, g, b, sat: Math.max(r, g, b) - Math.min(r, g, b) });
  }
  if (blueMax >= 30){
    S.model = { kind:"blue" };                                  // there is blue under the finger: it is the ball
  } else {
    px.sort((a, b) => b.sat - a.sat);
    const top = px.slice(0, Math.max(6, px.length >> 4));        // the most colourful 1/16 of the patch
    if (top[0].sat < 30){ status("Nothing to track there – tap right on the ball", "warn"); return; }
    const r = median(top.map(p => p.r)), gg = median(top.map(p => p.g)), b = median(top.map(p => p.b)), s = r + gg + b;
    S.model = { kind:"colour", cr:r/s, cg:gg/s, cb:b/s, tol:0.06 };
  }

  // A tap means "this one": take the blob under the finger; only if there is none, the nearest good one.
  let hit = refine(vw, vh, x, y, side / 2, true);
  if (hit && Math.hypot(hit.x - x, hit.y - y) > side * 1.5) hit = null;
  if (!hit){
    hit = searchFrame(vw, vh, { x, y });
    if (hit && Math.hypot(hit.x - x, hit.y - y) > Math.min(vw, vh) * 0.25) hit = null;   // too far from the finger
  }
  if (hit){
    S.lock = hit; S.vel.x = S.vel.y = 0; S.missing = 0; S.trail.length = 0;
    if (!S.measuring) status("Locked on what you tapped – press START", "ok");
  } else {
    status("Nothing to track there – tap right on the ball", "warn");
  }
  buttons();
});

/* =========================================================================
   START / STOP / SUBMIT
   ========================================================================= */
function newId(){
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16); });
}

function start(){
  if (!S.cameraOn || !S.lock) return;
  S.t = []; S.x = []; S.y = []; S.t0 = null; S.frames = 0; S.lost = 0;
  S.live = null; S.result = null; S.resultId = newId();
  S.measuring = true;
  status("Measuring – let it swing a few times, then STOP", "ok");
  buttons();
}

function stop(){
  if (!S.measuring) return;
  S.measuring = false;
  const e = estimate(), dur = S.t.length ? S.t[S.t.length-1] : 0;
  if (!e){
    S.result = null;
    status(S.t.length < 20 ? "Too short – measure a few swings" : "No clear swinging found – try again", "warn");
  } else {
    const step = Math.max(1, Math.ceil(S.t.length / 200)), tt = [], xx = [];
    for (let i = 0; i < S.t.length; i += step){ tt.push(Math.round(S.t[i]*1000)/1000); xx.push(Math.round(e.u[i]*10)/10); }
    S.result = {
      frequency_hz:   Math.round(e.hz*1000)/1000,
      period_s:       Math.round(1000/e.hz)/1000,
      periods:        e.periods,
      method:         "zero crossings, line fit",
      amplitude_px:   Math.round(e.amp),
      ball_radius_px: S.lock ? Math.round(S.lock.r*10)/10 : null,
      duration_s:     Math.round(dur*100)/100,
      frames:         S.frames,
      fps:            dur > 0.2 ? Math.round(10*S.t.length/dur)/10 : null,
      quality_pct:    S.frames ? Math.round(100*S.t.length/S.frames) : null,
      frames_lost:    S.lost,
      axis:           "principal",
      target:         S.model.kind,
      demo:           false,
      trace:          { t:tt, x:xx }
    };
    status("Measured " + e.hz.toFixed(2) + " Hz – press SUBMIT", "ok");
  }
  buttons();
}

function submit(){
  if (!S.result || S.sending) return;
  S.sending = true; buttons(); status("Sending…");
  fetch(HUB.url + "/rest/v1/teach_submissions", {
    method:"POST",
    headers:{ "apikey":HUB.key, "Content-Type":"application/json", "Prefer":"return=minimal" },
    body: JSON.stringify({ app:SEND_APP, submission_id:S.resultId, kind:"measurement", version:"pendulum-camera-2026-09",
                           payload:S.result, user_agent:(navigator.userAgent||"").slice(0,500) })
  }).then(r => r.ok ? null : r.text().then(t => { let m = t; try { m = JSON.parse(t).message || t; } catch(e){} throw new Error(m); }))
    .then(() => { S.sentId = S.resultId; status("✓ Submitted " + S.result.frequency_hz.toFixed(2) + " Hz – look at the screen!", "ok"); })
    .catch(err => {
      const m = String(err.message || err);
      status(/not accepting/.test(m) ? "The presentation is not collecting results right now"
           : /fetch|network|load failed/i.test(m) ? "No internet – press SUBMIT again" : "Could not submit: " + m, "warn");
    })
    .then(() => { S.sending = false; buttons(); });
}

function buttons(){
  $("bCam").disabled    = S.cameraOn;
  $("bStart").disabled  = !S.cameraOn || !S.lock || S.measuring;
  $("bStop").disabled   = !S.measuring;
  $("bSubmit").disabled = !S.result || S.measuring || S.sending;
  $("bSubmit").textContent = (S.result && S.sentId === S.resultId) ? "AGAIN" : "SUBMIT";
}

$("bCam").addEventListener("click", () => { startCamera().catch(()=>{}); });
$("bStart").addEventListener("click", start);
$("bStop").addEventListener("click", stop);
$("bSubmit").addEventListener("click", submit);
window.addEventListener("pagehide", stopCamera);
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && S.cameraOn && navigator.wakeLock){ try { S.wake = await navigator.wakeLock.request("screen"); } catch(e){} }
});
buttons();

// for testing
window.__cma = { S, blobs, spanCentre, refine, searchFrame, estimate, crossingFrequency, principal, start, stop, submit };
})();
</script>
