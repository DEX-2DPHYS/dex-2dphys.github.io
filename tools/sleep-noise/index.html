<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sleep Noise has moved</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://brokildapps.github.io/apps/sleep-noise/">
<meta http-equiv="refresh" content="3; url=https://brokildapps.github.io/apps/sleep-noise/">
<style>
  :root { --accent:#990000; --bg:#fff; --card:#fff; --border:#e5e3e0; --text:#1b1a19; --text-soft:#5c5955; }
  @media (prefers-color-scheme: dark) {
    :root { --accent:#ff5a5f; --bg:#131211; --card:#1e1c1a; --border:#322f2c; --text:#f3f1ee; --text-soft:#a8a39d; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100svh; display:grid; place-items:center; padding:2rem 1.2rem;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  .panel { width:min(32rem,100%); background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2rem; text-align:center; }
  h1 { margin:0 0 .6rem; font-size:1.5rem; letter-spacing:-.02em; }
  p { color:var(--text-soft); margin:0 0 1.5rem; }
  .btn { display:inline-block; padding:.75rem 1.4rem; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; text-decoration:none; }
  .back { display:inline-block; margin-top:1.4rem; font-size:.88rem; color:var(--text-soft); }
</style>
</head>
<body>
  <main class="panel">
    <h1>Sleep Noise has moved</h1>
    <p>It now lives on Brokild Apps, alongside the other personal apps. Update your bookmark — you’ll be sent there in a moment.</p>
    <a class="btn" href="https://brokildapps.github.io/apps/sleep-noise/">Open Sleep Noise →</a>
    <a class="back" href="../../">← Back to DEX</a>
  </main>
</body>
</html>
