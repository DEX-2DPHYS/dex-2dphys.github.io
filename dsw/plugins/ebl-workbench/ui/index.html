<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EBL Workbench</title>
<style>
  :root { --fg:#111; --muted:#666; --border:#ddd; --bg:#f6f7f9; --panel:#fff; --accent:#06f; --sel:#06f; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  button, input, select { font:inherit; }

  /* app bar and tabs */
  .appbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:18px; padding:8px 16px; background:#111; color:#fff; }
  .brand { font-weight:650; font-size:16px; letter-spacing:.01em; white-space:nowrap; }
  .brand small { font-weight:400; color:#9aa; margin-left:6px; font-size:12px; }
  .tabs { display:flex; gap:2px; }
  .tabs button { background:transparent; color:#bbb; border:0; padding:7px 14px; border-radius:8px; cursor:pointer; }
  .tabs button:hover { background:#222; color:#fff; }
  .tabs button.active { background:#fff; color:#111; font-weight:600; }
  .filebar { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .filebar .btn { background:#222; color:#eee; border-color:#333; }
  .filebar .btn:hover { background:#333; }
  #fileName { color:#9aa; font-size:12px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .tab { display:none; padding:12px 16px 24px; }
  .tab.active { display:block; }

  .grid { display:grid; grid-template-columns:320px minmax(0,1fr); gap:14px; align-items:start; }
  .panel { border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--panel); margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { border:1px solid #ccc; background:#fff; color:#000; padding:5px 10px; border-radius:8px; cursor:pointer; }
  .btn:hover { background:#f3f3f3; }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.primary, .btn.active { background:#000; color:#fff; border-color:#000; }
  .btn.primary:hover { background:#333; }
  .btn.small { padding:2px 8px; font-size:12px; }
  .label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; margin-bottom:2px; }
  .field { width:100%; border:1px solid #ccc; border-radius:8px; padding:5px 8px; background:#fff; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .three { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .hint { font-size:12px; color:#777; }
  .section-title { font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .pill { font-size:11px; background:#eef; border:1px solid #ccd; border-radius:10px; padding:1px 7px; }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 10px; }
  .toolbar .sep { width:1px; height:22px; background:#ddd; margin:0 4px; }
  .btn.tool { min-width:0; }
  .toolbar .btn { padding:5px 9px; }

  .canvas-wrap { position:relative; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
  #layoutCanvas { display:block; width:100%; touch-action:none; outline:none; }
  .crumb { position:absolute; left:10px; top:10px; display:none; gap:6px; align-items:center; background:rgba(255,255,255,.92); border:1px solid #ccc; border-radius:10px; padding:4px 8px; font-size:12px; }
  .crumb.show { display:flex; }
  .statusbar { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:#555; padding:6px 4px 0; }
  .statusbar b { color:#111; font-weight:600; }

  /* lists in the cells / layers panels */
  .list { border:1px solid #eee; border-radius:8px; max-height:220px; overflow:auto; }
  .list .item { display:flex; align-items:center; gap:6px; padding:4px 8px; border-bottom:1px solid #f2f2f2; cursor:pointer; font-size:13px; }
  .list .item:last-child { border-bottom:0; }
  .list .item:hover { background:#f6f8ff; }
  .list .item.on { background:#e8efff; }
  .list .item .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list .item .meta { font-size:11px; color:#888; white-space:nowrap; }
  .list input[type=color] { width:22px; height:22px; padding:0; border:1px solid #ccc; border-radius:4px; background:none; cursor:pointer; }
  .list input.name { border:1px solid transparent; background:transparent; padding:1px 4px; border-radius:4px; width:100%; }
  .list input.name:focus { border-color:#ccc; background:#fff; }
  .list input.key { width:46px; border:1px solid transparent; background:transparent; font-size:11px; color:#666; padding:1px 3px; border-radius:4px; }
  .list input.key:focus { border-color:#ccc; background:#fff; }

  /* help chips */
  .q { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%;
       border:1px solid #bbb; color:#555; background:#fafafa; font-size:10px; font-weight:700; cursor:help; user-select:none; flex:none; }
  .q:hover { background:#000; color:#fff; border-color:#000; }
  #tip { position:fixed; z-index:9000; display:none; max-width:340px; background:#111; color:#fff; border-radius:8px;
         padding:9px 11px; font-size:12px; line-height:1.4; box-shadow:0 6px 24px rgba(0,0,0,.28); }
  #tip b { color:#8fd; }

  /* modal */
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:9500; display:none; align-items:center; justify-content:center; }
  .modal-back.show { display:flex; }
  .modal { background:#fff; border-radius:14px; padding:18px 20px; width:min(760px, 94vw); max-height:86vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .modal.narrow { width:min(440px, 94vw); }
  .modal h2 { margin:0 0 10px; font-size:18px; }
  .modal h3 { margin:16px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:#888; }
  .keytab { width:100%; border-collapse:collapse; font-size:13px; }
  .keytab td { padding:4px 8px; border-bottom:1px solid #f0f0f0; vertical-align:top; }
  .keytab td:first-child { white-space:nowrap; width:210px; }
  .keytab.fits td { padding:3px 4px; white-space:nowrap; } .keytab.fits td:first-child { width:auto; }
  label.row { flex-wrap:nowrap; } label.row input { flex:none; }
  kbd { background:#f4f4f4; border:1px solid #ddd; border-bottom-width:2px; border-radius:4px; padding:1px 5px; font:11px/1.4 ui-monospace,Consolas,monospace; }
  .modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .modal .actions .left { margin-right:auto; display:flex; gap:8px; }
  .modal .field { margin-bottom:8px; }
  .modal .check { display:flex; gap:6px; align-items:center; font-size:13px; margin:4px 0 8px; }

  /* context menu */
  #ctxMenu { position:fixed; z-index:9400; display:none; background:#fff; border:1px solid #ccc; border-radius:10px;
             box-shadow:0 10px 30px rgba(0,0,0,.2); padding:4px; min-width:210px; }
  #ctxMenu div.item { padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  #ctxMenu div.item:hover { background:#000; color:#fff; }
  #ctxMenu div.item.disabled { opacity:.35; pointer-events:none; }
  #ctxMenu div.sepm { height:1px; background:#eee; margin:4px 2px; }

  /* toast */
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:9600; background:#111; color:#fff; padding:8px 14px; border-radius:10px; font-size:13px; display:none; max-width:80vw; box-shadow:0 8px 24px rgba(0,0,0,.25); }

  /* placeholder tabs */
  .soon { max-width:880px; margin:30px auto; }
  .soon h2 { margin:0 0 6px; }
  .soon ul { margin:8px 0 0 18px; padding:0; }
  .soon li { margin:3px 0; }

  /* Fab Studio: form | viewer | process flow */
  .grid.fab3 { grid-template-columns:320px minmax(0,1fr) 290px; }
  @media (max-width: 1350px) { .grid.fab3 { grid-template-columns:320px minmax(0,1fr); } .grid.fab3 > .flowcol { grid-column:1 / -1; } }
  .flow { max-height:calc(100vh - 250px); overflow-y:auto; padding:2px; }
  .flow .fstep { position:relative; border:1px solid var(--border); border-radius:8px; padding:6px 8px; background:#fff; font-size:12px; line-height:1.4; cursor:pointer; }
  .flow .fstep:hover { border-color:#94a3b8; }
  .flow .fstep.editing { border-color:#f59e0b; background:#fffbeb; box-shadow:0 0 0 2px rgba(245,158,11,.25); }
  .flow .fstep.downstream { opacity:.55; }
  .flow .fstep.bad { border-color:#fca5a5; background:#fef2f2; }
  .flow .fstep.placeholder { border:1.5px dashed #f59e0b; background:#fffbeb; color:#92400e; cursor:default; }
  .flow .fhead { display:flex; align-items:center; gap:5px; }
  .flow .fnum { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; border-radius:9px; background:#111; color:#fff; font-size:10px; font-weight:700; }
  .flow .fstep.editing .fnum, .flow .fstep.placeholder .fnum { background:#f59e0b; } .flow .fstep.bad .fnum { background:#dc2626; }
  .flow .ficon { width:16px; text-align:center; }
  .flow .fparams { color:#666; font-size:11px; margin-top:2px; }
  .flow .ferr { color:#b91c1c; font-weight:600; }
  .flow .fbadge { margin-left:4px; padding:0 5px; border-radius:4px; background:#f59e0b; color:#fff; font-size:9px; font-weight:700; }
  .flow .fstep img { display:block; width:100%; height:46px; margin-top:5px; border:1px solid var(--border); border-radius:4px; image-rendering:pixelated; }
  .flow .fconn { width:2px; height:8px; background:#d4d4d8; margin:0 auto; }
  .flow .facts { display:none; position:absolute; right:6px; bottom:8px; gap:1px; background:rgba(255,255,255,.95); border:1px solid var(--border); border-radius:5px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .flow .fstep:hover .facts { display:flex; }
  .flow .facts button { border:none; background:transparent; cursor:pointer; padding:2px 6px; font-size:12px; border-radius:4px; color:#2563eb; }
  .flow .facts button:hover { background:rgba(37,99,235,.12); } .flow .facts button.del { color:#dc2626; }
  .flow.compact .fstep { display:flex; align-items:center; gap:6px; padding:3px 6px; }
  .flow.compact .fhead { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .flow.compact .fparams { display:none; }
  .flow.compact .fstep img { width:96px; height:24px; margin:0; flex:none; }
  .flow.compact .fconn { height:4px; }
  .flow.compact .facts { bottom:auto; top:50%; transform:translateY(-50%); }

  /* stale overlay: old image greyed, ↻ in the middle (src/ui/stale.js) */
  .stale-ov { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(255,255,255,0.35); }
  .stale-redo { width:72px; height:72px; border-radius:50%; border:none; background:#111; color:#fff; font-size:40px; line-height:1; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .stale-redo:hover { background:#2f6fd6; } .stale-redo:disabled { cursor:default; background:#555; }
  .stale-redo.spin { animation:stale-spin 1s linear infinite; }
  @keyframes stale-spin { to { transform:rotate(360deg); } }
  .stale-msg { font-size:13px; color:#222; background:rgba(255,255,255,.9); padding:3px 10px; border-radius:6px; }

  /* hold-K shortcut card (src/ui/shortcuts.js) */
  #kbdCard { position:fixed; inset:0; z-index:1000; background:rgba(15,23,42,.35); align-items:center; justify-content:center; pointer-events:none; }
  .kbd-card { background:#fff; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.3); padding:18px 22px; max-width:min(1100px, 94vw); max-height:88vh; overflow:auto; font-size:13px; }
  .kbd-head { font-size:16px; margin-bottom:8px; } .kbd-head span { font-size:12px; color:#888; margin-left:10px; }
  .kbd-cols { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:24px; }
  .kbd-card h4 { margin:12px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#666; }
  .kbd-card table { border-collapse:collapse; width:100%; } .kbd-card td { padding:4px 8px 4px 0; vertical-align:top; border-bottom:1px solid #f0f0f0; }
  .kbd-card td:first-child { white-space:nowrap; color:#111; } .kbd-card td:last-child { color:#555; }
  kbd { display:inline-block; min-width:16px; padding:0 5px; border:1px solid #bbb; border-bottom-width:2px; border-radius:4px; background:#fafafa; font:600 11px/16px system-ui; text-align:center; color:#222; }
  .kbdhint { font-size:11px; color:#aaa; margin-left:12px; white-space:nowrap; } .kbdhint kbd { background:#222; color:#ddd; border-color:#555; }

  @media (max-width: 900px) {
    .grid { grid-template-columns:1fr; }
    .appbar { flex-wrap:wrap; }
    .filebar { margin-left:0; }
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">EBL Workbench</div>
  <nav class="tabs" id="tabs">
    <button data-tab="layout" class="active">Pattern Studio</button>
    <button data-tab="psf">PSF</button>
    <button data-tab="exposure">Exposure</button>
    <button data-tab="fab">Fab Studio</button>
    <button data-tab="analysis">Analysis</button>
  </nav>
  <span class="kbdhint" title="Hold the K key for the shortcuts of the tab in use">hold <kbd>K</kbd> for shortcuts</span>
  <div class="filebar">
    <span id="fileName"></span>
    <button class="btn small" id="btnNew">New</button>
    <button class="btn small" id="btnOpen">Open…</button>
    <button class="btn small" id="btnSave" title="Save everything in one .ebw.json file">Save</button>
    <button class="btn small" id="btnSaveAs">Save as…</button>
    <button class="btn small" id="btnImportGds" title="Import a GDSII layout (CleWin, L-Edit, or a proximity-corrected file with its dose table)">Import GDS…</button>
    <button class="btn small" id="btnExportGds" title="Export the layout, or the fractured dose classes, as GDSII">Export GDS…</button>
    <button class="btn small" id="btnDemo">Demo</button>
  </div>
</header>

<main>
<!-- ======================= LAYOUT ======================= -->
<section class="tab active" id="tab-layout">
  <div class="toolbar">
    <span style="font-size:12px; color:#666;">Tool</span>
    <button class="btn tool" id="toolSelect">Select</button>
    <button class="btn tool" id="toolRect">Rectangle</button>
    <button class="btn tool" id="toolCircle">Circle</button>
    <button class="btn tool" id="toolPoly">Polygon</button>
    <button class="btn tool" id="toolDevice" style="border-color:#c9a400;">Device area</button>
    <span class="q" data-tip="<b>Tool</b><br>The tool decides one thing only: what a <b>drag on empty space</b> does.<br><br><b>Select</b> — drags a rubber-band box round shapes.<br><b>Rectangle / Circle / Polygon</b> — draws that shape on the active layer.<br><br><b>Device area</b> — draws a rectangle that Fab Studio will simulate (it is never exposed).<br><br>Everything else works the same in every tool: click a shape to select it, <kbd>Shift</kbd>+click to add or remove, drag a shape to move it, drag a corner to reshape. Keys <kbd>1</kbd>–<kbd>5</kbd> switch tools, <kbd>Esc</kbd> goes back to Select.">?</span>
    <span id="toolHint" class="hint" style="min-width:230px;"></span>
    <span class="sep"></span>
    <button class="btn primary" id="btnHelp">Controls?</button>
    <span class="sep"></span>
    <button class="btn" id="btnFuse">Fuse</button>
    <button class="btn" id="btnSplit">Un-fuse</button>
    <button class="btn" id="btnArray">Array…</button>
    <button class="btn" id="btnDuplicate">Duplicate</button>
    <button class="btn" id="btnDelete">Delete</button>
    <button class="btn" id="btnDeleteAll">Delete all</button>
    <span class="sep"></span>
    <button class="btn" id="btnUndo">Undo</button>
    <button class="btn" id="btnRedo">Redo</button>
    <span class="sep"></span>
    <button class="btn" id="btnFit">Fit view</button>
    <button class="btn" id="btnResetView">Reset view</button>
    <label class="row" style="gap:5px; font-size:12px; margin-left:6px;">
      <input type="checkbox" id="snapEnable"><span>Snap to grid</span>
      <span class="q" data-tip="<b>Snap to grid</b><br>When on, every corner you draw, move or resize lands on the nearest drawing-grid node (spacing under <i>Drawing aids</i>).<br><br>Toggle with <kbd>G</kbd>. Everything is stored on a 1 nm grid regardless.">?</span>
    </label>
  </div>

  <div class="grid">
    <!-- left column -->
    <div class="col">
      <div class="panel">
        <div class="section-title">Selection <span class="q" data-tip="<b>Selection</b><br>Click a shape or an array to select it. <kbd>Shift</kbd>+click adds or removes; a rubber-band box (Select tool, <kbd>Shift</kbd>+drag or right-drag) takes everything it touches; <kbd>Ctrl</kbd>+<kbd>A</kbd> takes all.<br><br>With two or more shapes selected, <b>Fuse</b> merges them into one object with one uniform dose; <b>Array…</b> turns the selection into a cell placed as an array.">?</span></div>
        <div id="selInfo" class="hint">Nothing selected. Click a shape to select it.</div>
        <div id="selEditor" style="display:none;">
          <div id="selDoseBox">
            <div class="label">Target dose (µC/cm²) <span class="q" data-tip="<b>Target dose</b><br>The dose the pattern asks for. For a fused object it is shared by all members.<br><br>Editing it discards any proximity-corrected writing dose, since that was solved for the old target.">?</span></div>
            <input class="field" id="selDose" type="number" step="1">
          </div>
          <div id="selLayerBox" style="margin-top:6px;">
            <div class="label">Layer</div>
            <select class="field" id="selLayer"></select>
          </div>
          <div class="hint" id="selGeom" style="margin-top:6px;"></div>
          <div class="row" style="margin-top:8px;">
            <button class="btn small" id="btnEditGeom">Size &amp; rotation…</button>
            <button class="btn small" id="btnUnselect">Unselect</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="section-title">Cells <span class="q" data-tip="<b>Cells</b> — the layout hierarchy, as in GDS.<br><br>A <b>cell</b> is a reusable piece of layout. Placing a cell gives an <b>instance</b>; an instance with columns × rows &gt; 1 is an <b>array</b> (GDS AREF), stored once however many elements it has.<br><br><b>Edit</b> opens a cell for editing (the breadcrumb on the map takes you back). <b>Place</b> drops instances with each click until <kbd>Esc</kbd>.">?</span></div>
        <div class="list" id="cellList"></div>
        <div class="row" style="margin-top:8px;">
          <button class="btn small" id="cellEdit">Edit</button>
          <button class="btn small" id="cellPlace">Place</button>
          <button class="btn small" id="cellRename">Rename</button>
          <button class="btn small" id="cellDelete">Delete</button>
          <button class="btn small" id="cellNew">New</button>
        </div>
      </div>

      <div class="panel">
        <div class="section-title">Layers <span class="q" data-tip="<b>Layers</b> — GDS layer/datatype pairs (L/D).<br><br>New shapes go on the <b>active</b> layer (the radio button). Untick a layer to hide it. Layers marked as <i>marker</i> are drawn but will not be exposed in the Exposure tab.">?</span></div>
        <div class="list" id="layerList"></div>
        <div class="two" id="layerBeam" style="margin-top:8px;">
          <div>
            <div class="label">Beam step (nm) <span class="q" data-tip="How this layer is written: the <b>beam step</b> (the shot grid, nm) and the <b>beam current</b> (nA) of the <b>active</b> layer (the radio button above). The Exposure tab uses them to count the shots and estimate the writing time, layer by layer. A marker or device-area layer is not written. Changing them does not change the exposure or a correction.">?</span></div>
            <input class="field" id="layerStep" type="number" min="0.5" step="0.5">
          </div>
          <div>
            <div class="label">Beam current (nA)</div>
            <input class="field" id="layerCur" type="number" min="0.01" step="0.5">
          </div>
        </div>
        <div class="row" style="margin-top:8px;">
          <button class="btn small" id="layerAdd">Add layer</button>
        </div>
      </div>

      <div class="panel">
        <div class="section-title">View &amp; drawing aids</div>
        <div class="two">
          <div>
            <div class="label">Nominal dose (µC/cm²) <span class="q" data-tip="<b>Nominal dose</b><br>The dose given to every <i>new</i> shape. Existing shapes keep theirs — select one and use the Target dose field.">?</span></div>
            <input class="field" id="nominalDose" type="number" value="100" step="1">
          </div>
          <div>
            <div class="label">Zoom (µm/px) <span class="q" data-tip="<b>Zoom</b><br>Width of one screen pixel in microns. Mouse wheel zooms around the cursor; <kbd>Alt</kbd>+drag or the middle button pans.">?</span></div>
            <input class="field" id="mpp" type="number" value="0.2" step="0.02" min="0.00001">
          </div>
          <div>
            <div class="label">Grid spacing (µm) <span class="q" data-tip="<b>Grid spacing</b><br>Spacing of the faint grid, the snap step, and the arrow-key nudge step.">?</span></div>
            <input class="field" id="gridUm" type="number" value="1.0" step="0.1" min="0.001">
          </div>
          <div>
            <div class="label">Major every</div>
            <input class="field" id="gridMajor" type="number" value="5" step="1" min="2">
          </div>
        </div>
        <div class="row" style="margin-top:8px;">
          <label class="row" style="gap:6px;"><input type="checkbox" id="fixedEnable"><span style="font-size:12px;">Fixed size</span></label>
          <span class="q" data-tip="<b>Fixed size</b><br>When on, the Rectangle tool stamps a rectangle of exactly W × L with its top-left corner at the pointer, instead of a rubber-band box.">?</span>
        </div>
        <div class="two" style="margin-top:6px;">
          <div><div class="label">W (µm)</div><input class="field" id="fixedW" type="number" value="1.0" step="0.1" min="0.001"></div>
          <div><div class="label">L (µm)</div><input class="field" id="fixedL" type="number" value="1.0" step="0.1" min="0.001"></div>
        </div>
      </div>
    </div>

    <!-- right column -->
    <div class="col">
