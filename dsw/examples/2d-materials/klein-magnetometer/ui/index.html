<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klein Magnetometer Workbench</title>
<script src="/dex.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f9;--panel:#ffffff;--panel2:#f7f8fa;--line:#dde3ea;--fg:#14181f;--fg2:#52514e;--muted:#6b7280;
  --accent:#6d28d9;--accent-soft:#ede9fe;--warn:#b45309;--bad:#d03b3b;--good:#0ca30c;
  --surface:#fcfcfb;--grid:#e6e8eb;--axis:#9aa3ad;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --seq-lo:#cde2fb;--seq-hi:#0d366b;--mask:#d6d6d2;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116;--panel:#16191f;--panel2:#1c2027;--line:#2a2f38;--fg:#f2f3f5;--fg2:#c3c2b7;--muted:#9aa1ab;
  --accent:#a78bfa;--accent-soft:#2a2246;--warn:#fab219;--bad:#e66767;--good:#0ca30c;
  --surface:#1a1a19;--grid:#2b2b29;--axis:#6b6b66;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --seq-lo:#104281;--seq-hi:#cde2fb;--mask:#3a3a37;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;white-space:nowrap}
.top .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.status{display:flex;align-items:center;gap:8px;min-width:260px;font-size:13px;color:var(--fg2)}
.prog{width:140px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--good)}.dot.busy{background:var(--warn)}
/* three columns */
.main{display:grid;grid-template-columns:330px minmax(0,1fr) 330px;min-height:0}
.left,.right{overflow:auto;background:var(--panel);min-height:0}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line);padding:10px 12px}
.center{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;min-width:0;padding:10px;gap:8px}
/* controls */
.presetbar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.presetbar select{flex:1;min-width:0;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}
details.grp{border-bottom:1px solid var(--line)}
details.grp>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between}
details.grp>summary::after{content:"+";color:var(--muted)}
details.grp[open]>summary::after{content:"−"}
.rows{padding:0 12px 10px;display:grid;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 112px;align-items:center;gap:8px}
.row label{font-size:13px;color:var(--fg);cursor:help}
.row label small{color:var(--muted);margin-left:3px}
.row input[type=number],.row input[type=text],.row select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);text-align:right}
.row select{text-align:left}
.row input[type=checkbox]{justify-self:end;width:16px;height:16px}
.row.off{opacity:.45}
.row.adj input,.row.adj select{border-color:var(--warn)}
.note{font-size:12px;color:var(--muted);padding:0 12px 10px}
.chip{font-size:12px;color:var(--fg2);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.tab.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:44px}
.toolbar label{font-size:13px;color:var(--fg2);display:flex;align-items:center;gap:5px}
.toolbar input[type=number]{width:78px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);text-align:right}
.toolbar select{padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.toolbar .sep{width:1px;height:22px;background:var(--line)}
.toolbar .info{font-size:12px;color:var(--muted)}
.view{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:0;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:block}
.pane canvas.chart{position:absolute;inset:0;width:100%;height:100%}
.pane.split .a{position:absolute;left:0;right:0;top:0;height:62%}
.pane.split .b{position:absolute;left:0;right:0;bottom:0;height:38%;border-top:1px solid var(--line)}
.cv-wrap{position:absolute;inset:0}
.cv-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
#devPane{display:none;align-items:center;justify-content:center;padding:8px}
#devPane.on{display:flex}
#view{max-width:100%;max-height:100%;aspect-ratio:16/9;width:auto;height:100%;border-radius:8px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.15);display:none;z-index:5;white-space:nowrap;color:var(--fg)}
.tip b{font-weight:600}
.tip .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cross{position:absolute;top:0;bottom:0;width:1px;background:var(--axis);display:none;pointer-events:none;z-index:4}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:30px;pointer-events:none}
/* right column */
.right h3{font-size:13px;margin:12px 0 6px;color:var(--fg)}
.right h3:first-child{margin-top:2px}
table.kv{width:100%;border-collapse:collapse;font-size:12.5px}
table.kv td{padding:3px 2px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--fg2)}
table.kv td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.kv tr[title]{cursor:help}
.flag{font-size:12px;border-radius:7px;padding:6px 8px;margin:6px 0;border:1px solid var(--line);background:var(--panel2)}
.flag.warn{border-color:var(--warn);color:var(--warn)}
.flag.ok{border-color:var(--good)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btnrow .btn{font-size:12.5px;padding:5px 8px}
.held{font-size:12.5px;display:grid;gap:4px}
.held div{display:flex;align-items:center;gap:6px}
.held .sw{width:12px;height:3px;border-radius:2px}
.held button{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer}
textarea#methods{width:100%;height:150px;font-size:12px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:6px;resize:vertical}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:70vw}
.toast.on{opacity:.95}
.htable{position:absolute;inset:0;overflow:auto;padding:10px;font-size:12.5px}
.htable table{border-collapse:collapse;width:100%}
.htable td,.htable th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
.htable th{color:var(--fg2);font-weight:600}
@media (max-width:1250px){.main{grid-template-columns:300px minmax(0,1fr)}.right{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Klein Magnetometer Workbench</h1>
    <span class="sub" id="headline">—</span>
    <span class="sp"></span>
    <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span><div class="prog"><i id="progBar"></i></div><span id="eta" class="info"></span></div>
    <button class="btn primary" id="runCurve" title="Compute R(B) over the field grid with the current settings">Run R(B)</button>
    <button class="btn danger" id="stopBtn">Stop</button>
    <button class="btn" id="themeBtn" title="Light / dark">◐</button>
  </div>
  <div class="main">
    <aside class="left" id="left">
      <div class="presetbar">
        <select id="preset" title="Load a preset parameter set">
          <option value="">Presets…</option>
          <option value="default">Default device (gate profile, N=16)</option>
          <option value="june">June-report optimum (asymptotic T, cap 6 as in June)</option>
          <option value="first">First simulation (N=40, W=2 µm, ±50 mT), converged cap</option>
          <option value="unipolar">Unipolar control (n–n′–n)</option>
          <option value="skew">Skewed junctions (odd-in-B response)</option>
          <option value="disorder">Disordered junctions</option>
          <option value="diffusive">Short mean free path (should fail)</option>
          <option value="rough">Rough, diffuse edges</option>
          <option value="warm">Warm: 77 K, phonons + thermal smearing</option>
        </select>
        <button class="btn" id="saveCfg" title="Save all settings as JSON">Save</button>
        <button class="btn" id="loadCfg" title="Load settings JSON">Load</button>
        <input type="file" id="loadFile" accept=".json" hidden>
      </div>
      <div id="controls"></div>
    </aside>

    <section class="center">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="device">Device</button>
        <button class="tab" data-tab="rb">R(B)</button>
        <button class="tab" data-tab="fates">Transmission &amp; fates</button>
        <button class="tab" data-tab="sens">Sensitivity &amp; noise</button>
        <button class="tab" data-tab="sweep">Sweep</button>
        <button class="tab" data-tab="grid">Optimise (2-D grid)</button>
        <button class="tab" data-tab="angular">Junction T(θ)</button>
        <button class="tab" data-tab="coherent">Coherent (Fabry–Pérot)</button>
      </div>
      <div class="toolbar" id="toolbar"></div>
      <div class="view" id="viewArea">
        <div class="pane on" id="devPane"><canvas id="view" width="960" height="540"></canvas></div>
        <div class="pane" id="rbPane"><div class="cv-wrap"><canvas class="chart" id="cRB"></canvas></div></div>
        <div class="pane split" id="fatesPane"><div class="a cv-wrap"><canvas class="chart" id="cT"></canvas></div><div class="b cv-wrap"><canvas class="chart" id="cFate"></canvas></div></div>
        <div class="pane split" id="sensPane"><div class="a cv-wrap"><canvas class="chart" id="cSens"></canvas></div><div class="b"><div class="htable" id="noiseTable"></div></div></div>
        <div class="pane" id="sweepPane"><div class="cv-wrap"><canvas class="chart" id="cSweep"></canvas></div></div>
        <div class="pane split" id="gridPane"><div class="a cv-wrap"><canvas class="chart" id="cGrid"></canvas></div><div class="b"><div class="htable" id="gridInfo"></div></div></div>
        <div class="pane" id="angularPane"><div class="cv-wrap"><canvas class="chart" id="cAng"></canvas></div></div>
        <div class="pane split" id="coherentPane"><div class="a cv-wrap"><canvas class="chart" id="cCoh"></canvas></div><div class="b"><div class="htable" id="cohTable"></div></div></div>
      </div>
    </section>

    <aside class="right" id="right">
      <h3>Derived quantities</h3>
      <table class="kv" id="derivedTable"></table>
      <div id="syncFlag" class="flag">waiting for core…</div>
      <h3>Last R(B) curve</h3>
      <table class="kv" id="metricTable"><tr><td colspan="2" style="color:var(--muted)">Run R(B) to see figures of merit.</td></tr></table>
      <div id="curveFlags"></div>
      <h3>Held curves <span class="info" style="font-weight:400;color:var(--muted)">(overlaid on R(B))</span></h3>
      <div class="held" id="heldList"><span style="color:var(--muted);font-size:12.5px">None. Use “Hold” on the R(B) tab.</span></div>
      <h3>Export</h3>
      <div class="btnrow">
        <button class="btn" id="expJson" title="The last result message as JSON, including every parameter">Result JSON</button>
        <button class="btn" id="expCsv" title="The last R(B) curve as CSV">Curve CSV</button>
        <button class="btn" id="expSweepCsv" title="Sweep or grid metrics as CSV">Sweep/grid CSV</button>
        <button class="btn" id="expPng" title="The visible chart as PNG">Chart PNG</button>
      </div>
      <h3>Methods text</h3>
      <textarea id="methods" readonly></textarea>
      <div class="btnrow"><button class="btn" id="copyMethods">Copy</button></div>
    </aside>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// =====================================================================
// 1. CONTROL SPEC — one entry per core `configure` key. The panel is built
//    from this table, the payload is read from it, and every reply from the
//    core is compared against it, so a control and the value the core uses
//    cannot drift apart silently.
// =====================================================================
const G = {geo:'Geometry', car:'Carriers & junction profile', dis:'Junction disorder', edge:'Edges & injection',
  sc:'Scattering & temperature', field:'Field grid', eng:'Statistics & engine', noise:'Readout & noise', coh:'Coherent sidebar'};
const CONTROLS = [
  // key, group, label, unit, type, default, extra
  {k:'nCells', g:'geo', l:'Cells (n,p,n,…)', u:'', t:'int', d:16, min:1, max:400, tip:'Number of alternating n/p regions. Junctions = cells − 1. Cell 0 is n-type.'},
  {k:'Ln_um', g:'geo', l:'n-cell length', u:'µm', t:'num', d:0.5, min:0.01, step:0.05, tip:'Length of every n-type cell along the current.'},
  {k:'Lp_um', g:'geo', l:'p-cell length', u:'µm', t:'num', d:0.5, min:0.01, step:0.05, tip:'Length of every p-type cell along the current.'},
  {k:'W_um', g:'geo', l:'Strip width W', u:'µm', t:'num', d:10, min:0.1, step:0.5, tip:'Channel width. Sets the mode count M = floor(k_F,min W / π).'},
  {k:'skewDeg', g:'geo', l:'Junction skew', u:'°', t:'num', d:0, min:-80, max:80, step:1, tip:'All junction lines rotated by this angle. Breaks B → −B symmetry (odd response).'},
  {k:'nN_cm2', g:'car', l:'n density', u:'cm⁻²', t:'num', d:1e12, min:1e9, step:1e11, tip:'Electron density in the n cells. k_F = √(πn).'},
  {k:'nP_cm2', g:'car', l:'|p| density', u:'cm⁻²', t:'num', d:1e12, min:1e9, step:1e11, tip:'Hole density in the p cells (magnitude).'},
  {k:'unipolar', g:'car', l:'Unipolar control', u:'', t:'chk', d:0, tip:'Make the "p" cells electron-like at the |p| density: removes Klein filtering, keeps the geometry. The decisive control device.'},
  {k:'profile', g:'car', l:'Junction profile', u:'', t:'sel', d:'gate', opts:[['gate','gate electrostatic (arctan)'],['linear','linear ramp'],['tanh','tanh'],['erf','erf'],['asymptotic','asymptotic formula (June)']],
    tip:'Potential profile across each junction. Transmission is obtained by integrating the Dirac equation exactly, except for "asymptotic", which uses exp(−π k_y²/|dk/dx|).'},
  {k:'d_nm', g:'car', l:'Junction width d', u:'nm', t:'num', d:10, min:0.01, step:1, tip:'Defined by the MAXIMUM gradient: |dk/dx|max = |Δk|/d for every profile. Gate profile: gate height h = d/π.'},
  {k:'vF', g:'car', l:'Fermi velocity', u:'m/s', t:'num', d:1e6, min:1e5, step:5e4, tip:'Dirac velocity.'},
  {k:'sigmaPos_nm', g:'dis', l:'Position jitter σ', u:'nm', t:'num', d:0, min:0, step:5, tip:'RMS random displacement of each junction along x (frozen per disorder seed).'},
  {k:'sigmaWidth', g:'dis', l:'Width jitter σ', u:'rel.', t:'num', d:0, min:0, step:0.05, tip:'Relative RMS spread of each junction width d.'},
  {k:'sigmaDensity', g:'dis', l:'Density jitter σ', u:'rel.', t:'num', d:0, min:0, step:0.05, tip:'Relative RMS spread of each cell density.'},
  {k:'sigmaTiltDeg', g:'dis', l:'Local tilt σ', u:'°', t:'num', d:0, min:0, step:1, tip:'Junction line roughness: a random local normal rotation drawn at every crossing.'},
  {k:'disorderSeed', g:'dis', l:'Disorder seed', u:'', t:'int', d:1, min:0, tip:'Which frozen disorder realisation. Sweep it for ensemble statistics.'},
  {k:'edge', g:'edge', l:'Side edges', u:'', t:'sel', d:'specular', opts:[['specular','specular'],['diffuse','diffuse (specularity p)'],['absorbing','absorbing (grounded)']], tip:'Boundary condition at y = 0 and y = W.'},
  {k:'specularity', g:'edge', l:'Specularity p', u:'', t:'num', d:1, min:0, max:1, step:0.1, tip:'Probability of a specular bounce; otherwise Lambertian. Only with diffuse edges.'},
  {k:'injection', g:'edge', l:'Injection', u:'', t:'sel', d:'cosine', opts:[['cosine','Landauer cos θ, full width'],['aperture','cos θ through a centred aperture'],['collimated','collimated Gaussian']], tip:'Angular and spatial distribution of carriers entering at x = 0.'},
  {k:'apertureFrac', g:'edge', l:'Aperture / W', u:'', t:'num', d:1, min:0.01, max:1, step:0.05, tip:'Aperture width as a fraction of W (aperture injection). Also scales the mode count.'},
  {k:'collimSigmaDeg', g:'edge', l:'Collimation σ', u:'°', t:'num', d:10, min:0.1, step:1, tip:'Angular width of a collimated source.'},
  {k:'leftContactFrac', g:'edge', l:'Source contact / W', u:'', t:'num', d:1, min:0.001, max:1, step:0.05, tip:'Length of the source contact on the left end wall, centred, as a fraction of W. Below 1 the rest of that wall reflects specularly and carriers are injected (cos θ) only through the contact.'},
  {k:'rightContactFrac', g:'edge', l:'Drain contact / W', u:'', t:'num', d:1, min:0.001, max:1, step:0.05, tip:'Length of the drain contact on the right end wall, centred, as a fraction of W. Below 1 the rest of that wall reflects specularly.'},
  {k:'mfp_um', g:'sc', l:'Scattering-event length', u:'µm', t:'num', d:30, min:0, step:1, tip:'Mean distance between scattering EVENTS. Isotropic: equals the transport length. Forward (kick σ): transport length = this / (1 − exp(−σ²/2)), i.e. ~66× longer at σ = 10°. Use the mobility box to set it from a measured mobility. 0 = ballistic.'},
  {k:'_mu', g:'sc', l:'…or mobility', u:'cm²/Vs', t:'num', d:0, min:0, step:10000, local:true, tip:'If > 0, sets the event length from the transport length ℓ_tr = μħk_F/e at the n density, converted for the chosen scattering model.'},
  {k:'scatter', g:'sc', l:'Scattering model', u:'', t:'sel', d:'forward', opts:[['forward','forward (small angle)'],['drude','isotropic (Drude)'],['none','none']], tip:'Angular character of each scattering event.'},
  {k:'forwardSigmaDeg', g:'sc', l:'Forward kick σ', u:'°', t:'num', d:10, min:0, step:1, tip:'Gaussian angular kick per forward-scattering event.'},
  {k:'mfpPh300_um', g:'sc', l:'Phonon ℓ at 300 K', u:'µm', t:'num', d:0, min:0, step:0.5, tip:'Acoustic-phonon mean free path at 300 K, scaled ∝ 1/T and combined by Matthiessen. 0 = off.'},
  {k:'tempK', g:'sc', l:'Temperature', u:'K', t:'num', d:20, min:0.01, step:1, tip:'Sets phonon scattering and, with energy nodes > 1, the Fermi-window average.'},
  {k:'eeMfp_um', g:'sc', l:'e–e dispersion length', u:'µm', t:'num', d:0, min:0, step:0.5, tip:'Small-angle, momentum-conserving beam dispersion (does not change mobility). 0 = off.'},
  {k:'eeSigmaDeg', g:'sc', l:'e–e kick σ', u:'°', t:'num', d:15, min:0, step:1, tip:'Angular kick per e–e event.'},
  {k:'bMin_mT', g:'field', l:'B min', u:'mT', t:'num', d:-20, step:1, tip:'Lower end of the field grid.'},
  {k:'bMax_mT', g:'field', l:'B max', u:'mT', t:'num', d:20, step:1, tip:'Upper end of the field grid.'},
  {k:'bN', g:'field', l:'Field points', u:'', t:'int', d:81, min:2, max:2001, tip:'Number of field values (odd numbers include B = 0).'},
  {k:'engine', g:'eng', l:'Engine', u:'', t:'sel', d:'mc', opts:[['mc','Monte Carlo (production)'],['flux','flux / ray splitting (cross-check)']], tip:'Monte Carlo is the production engine. The flux engine splits rays at every junction and is an independent check.'},
  {k:'nTraj', g:'eng', l:'Trajectories / field', u:'', t:'int', d:20000, min:100, max:50000000, step:10000, tip:'Monte-Carlo trajectories per field point (and per energy node). σ_T = √(T(1−T)/n).'},
  {k:'seed', g:'eng', l:'Random seed', u:'', t:'int', d:7, min:0, tip:'Trajectory i uses the same random stream at every field (common random numbers).'},
  {k:'nEnergy', g:'eng', l:'Energy nodes', u:'', t:'int', d:1, min:1, max:40, tip:'Gauss–Fermi quadrature nodes over −df/dE. 1 = T = 0 limit. Cost scales linearly.'},
  {k:'fluxNY', g:'eng', l:'Flux: y nodes', u:'', t:'int', d:24, min:1, max:512, tip:'Injection-position nodes (flux engine).'},
  {k:'fluxNS', g:'eng', l:'Flux: angle nodes', u:'', t:'int', d:257, min:3, max:8193, tip:'Injection sin θ nodes (flux engine).'},
  {k:'fluxJitter', g:'eng', l:'Flux: jitter nodes', u:'', t:'chk', d:1, tip:'Randomise each node within its cell (unbiased against grid aliasing).'},

function buildControls() {

function defaults() { return Object.fromEntries(CONTROLS.map(c => [c.k, c.d])); }
function getVal(k) {

}

// mobility helper -> mean free path
// Mobility measures the TRANSPORT length ℓ_tr = μħk_F/e. A forward event with Gaussian kick σ
// relaxes momentum only by 1 − ⟨cos⟩ = 1 − exp(−σ²/2), so the core's per-event length is
// ℓ_event = ℓ_tr (1 − ⟨cos⟩). For isotropic scattering the two are equal.
function relaxFrac(v) { return v.scatter === 'forward' ? 1 - Math.exp(-0.5 * Math.pow(v.forwardSigmaDeg * Math.PI / 180, 2)) : 1; }

  if (k === 'mfp_um' && getVal('_mu') > 0) setVal('_mu', 0);   // typing ℓ directly releases the mobility link

}
function refreshEnables() {

    forwardSigmaDeg: v.scatter === 'forward', eeSigmaDeg: v.eeMfp_um > 0, nTraj: v.engine === 'mc',
    fluxNY: v.engine === 'flux', fluxNS: v.engine === 'flux', fluxJitter: v.engine === 'flux', fluxThreshold: v.engine === 'flux'};
  for (const [k, on] of Object.entries(en)) { const r = $('row_' + k); if (r) r.classList.toggle('off', !on); }

    (v.engine === 'mc' ? ` · σ_T ≈ ${fmt(Math.sqrt(0.25 / Math.max(1, v.nTraj)), 2)} at T = 0.5` : '');

// 6. talking to the core
// =====================================================================
function payload() { const o = {t: 'configure'}; for (const c of CONTROLS) if (!c.local) o[c.k] = getVal(c.k); return o; }

}

}
let pathsTimer = 0;
function tracePathsSoon() { clearTimeout(pathsTimer); pathsTimer = setTimeout(() => { if (!S.busy) dex.send({t: 'run', mode: 'paths', B_mT: S.ui.pathsB, n: S.ui.pathsN}); }, 250); }

const dex = DEX.connect({
  canvas: $('view'),
  onStatus: s => { S.connected = s === 'open'; if (s === 'open') { setBusy(null); dex.send({t: 'hello'}); pushTheme(); sync(); } else { $('dot').className = 'dot'; $('status').textContent = s; } },
  onMessage: m => handle(m),

function handle(m) {

      const el = (performance.now() - S.runStart) / 1000; const eta = f > 0.02 ? el * (1 - f) / f : NaN;
      $('eta').textContent = `${(100 * f).toFixed(0)}% · ${el.toFixed(0)} s${isFinite(eta) ? ` · ~${eta < 90 ? eta.toFixed(0) + ' s' : (eta / 60).toFixed(1) + ' min'} left` : ''}`;
      if (m.total > 1) $('status').textContent = `running ${m.mode} · ${m.i + 1}/${m.total}`;
      break; }
    case 'curve': S.curve = m; S.lastResult = m; renderMetrics(); redrawCurveTabs(); updateMethods(); if (S.tab === 'device') {} break;
    case 'sweep_start': S.sweep = {param: m.param, xs: m.xs, pts: [], cfg: Object.assign({}, S.ui.sweep), base: S.derived && S.derived.params}; drawSweep(); break;
    case 'sweep_point': if (S.sweep) { S.sweep.pts[m.i] = m; drawSweep(); } break;
    case 'sweep_done': if (S.sweep) { S.lastResult = {t: 'sweep', param: S.sweep.param, xs: S.sweep.xs, points: S.sweep.pts, params: S.derived && S.derived.params}; } break;
    case 'grid_start': S.grid = {param: m.param, param2: m.param2, xs: m.xs, ys: m.ys, pts: [], base: S.derived && S.derived.params}; drawGrid(); break;
    case 'grid_point': if (S.grid) { (S.grid.pts[m.j] = S.grid.pts[m.j] || [])[m.i] = m; drawGrid(); } break;
    case 'grid_done': if (S.grid) { S.lastResult = {t: 'grid', param: S.grid.param, param2: S.grid.param2, xs: S.grid.xs, ys: S.grid.ys, points: S.grid.pts, params: S.derived && S.derived.params}; drawGrid(); } break;
    case 'angular': S.angular = m; drawAngular(); break;

}

    `Carriers were injected ${p.injection === 'cosine' ? 'with the Landauer cos θ flux distribution across the full width' : p.injection === 'aperture' ? `through a centred aperture of ${p.apertureFrac} W with a cos θ distribution` : `as a collimated Gaussian beam (σ = ${p.collimSigmaDeg}°)`} and propagated on exact cyclotron arcs with an event-driven tracer (no time step); at each junction they were transmitted with probability T(k_y) and refracted with conserved k_y, or specularly reflected.`,
    `Edges were ${p.edge === 'specular' ? 'specular' : p.edge === 'diffuse' ? `partially diffuse (specularity ${p.specularity}, Lambertian otherwise)` : 'absorbing'}. ${p.mfp_um > 0 || p.mfpPh300_um > 0 ? `Bulk scattering was ${p.scatter === 'drude' ? 'isotropic' : p.scatter === 'forward' ? `forward (Gaussian kick σ = ${p.forwardSigmaDeg}°)` : 'off'} with an impurity mean free path of ${p.mfp_um} µm${p.mfpPh300_um > 0 ? ` and an acoustic-phonon mean free path of ${p.mfpPh300_um} µm at 300 K scaled as 1/T (T = ${p.tempK} K, Matthiessen's rule)` : ''}.` : 'Transport was ballistic.'}${p.eeMfp_um > 0 ? ` Electron–electron beam dispersion was included as momentum-conserving angular kicks (σ = ${p.eeSigmaDeg}°) with mean free path ${p.eeMfp_um} µm.` : ''}${p.sigmaPos_nm || p.sigmaWidth || p.sigmaDensity || p.sigmaTiltDeg ? ` Junction disorder: position σ = ${p.sigmaPos_nm} nm, relative width σ = ${p.sigmaWidth}, relative density σ = ${p.sigmaDensity}, local tilt σ = ${p.sigmaTiltDeg}° (realisation ${p.disorderSeed}).` : ''}`,
    `${p.engine === 'mc' ? `Each of ${p.bN} field points between ${p.bMin_mT} and ${p.bMax_mT} mT used ${Number(p.nTraj).toLocaleString('en')} Monte-Carlo trajectories with common random numbers across field (seed ${p.seed})` : `Each of ${p.bN} field points used a ${p.fluxNY} × ${p.fluxNS} injection quadrature with deterministic ray splitting at junctions and Russian roulette below weight ${p.fluxThreshold}`}${p.nEnergy > 1 ? `, at ${p.nEnergy} Gauss quadrature energies over the Fermi window at ${p.tempK} K` : ' at the Fermi energy'}. Trajectories were followed up to ${p.maxPathFactor} × L_tot (capped carriers counted as not transmitted${c && isFinite(c.metrics.cappedOverT) ? `; at most ${fmt(100 * c.metrics.cappedOverT, 2)} % of T` : ''}). The conductance is G = (4e²/h) M ⟨T⟩ with M = ${c ? c.modes : d.modes} modes.`,
    `R0 and the curvature come from a weighted even-parabola fit over |B| ≤ ${p.fitWindow_mT > 0 ? p.fitWindow_mT : fmt(Math.max(Math.abs(p.bMin_mT), Math.abs(p.bMax_mT)) / 3, 3)} mT; dR/dB from local quadratic fits over ±${p.sgHalf} points. The field resolution is √S_V/(I|dR/dB|) at the steepest point, with S_V = 4k_BTR + 2eIR²${p.hooge > 0 ? ` + α_H(IR)²/(N_c f) (α_H = ${p.hooge}, f = ${p.freqHz} Hz)` : ''} at I = ${p.biasA_uA} µA and T = ${p.noiseTempK > 0 ? p.noiseTempK : p.tempK} K.`,
    c ? `Result: R0 = ${fmt(c.metrics.R0, 4)} Ω, T(0) = ${fmt(c.metrics.T0, 4)}, peak |dR/dB|/R0 = ${fmt(c.metrics.peakSens, 4)} T⁻¹ at ${fmt(c.metrics.peakSlopeB_mT, 3)} mT, B_min = ${fmt(c.metrics.bMinFlank_nT, 3)} nT/√Hz.` : '',
  ];
  $('methods').value = txt.filter(Boolean).join(' ');
}

const PANES = {device: 'devPane', rb: 'rbPane', fates: 'fatesPane', sens: 'sensPane', sweep: 'sweepPane', grid: 'gridPane', angular: 'angularPane', coherent: 'coherentPane'};
function setTab(t) {
  S.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  for (const [k, id] of Object.entries(PANES)) $(id).classList.toggle('on', k === t);
  dex.send({t: 'view', name: t});
  buildToolbar(); redrawActive();
  if (t === 'angular' && S.connected && (!S.angular || stale(S.angular.params))) runMode('angular');
  if (t === 'device' && S.connected) tracePathsSoon();
}

function paramSel(id, sel) { return `<select id="${id}">${opt(SWEEPABLE, sel)}</select>`; }

  tb.innerHTML = T[S.tab] || '';
  const on = (id, ev, fn) => { const e = $(id); if (e) e.addEventListener(ev, fn); };

  on('tbDensity', 'click', () => { sync(); u.autoPaths = false; if ($('tbAuto')) $('tbAuto').checked = false; dex.send({t: 'run', mode: 'density', B_mT: u.pathsB, n: 200000, gx: 240, gy: 120, first: $('tbFirst').checked ? 1 : 0}); setBusy('density map'); });
  // rb
  on('tbRBMode', 'change', e => { u.rbMode = e.target.value; drawRB(); }); on('tbFit', 'change', e => { u.rbFit = e.target.checked; drawRB(); }); on('tbErr', 'change', e => { u.rbErr = e.target.checked; drawRB(); });
  on('tbHold', 'click', () => { if (!S.curve) return toast('Run R(B) first'); const p = S.curve.params; S.held.push({label: `N=${p.nCells} L=${p.Ln_um} W=${p.W_um} d=${p.d_nm} ${p.profile}${p.unipolar ? ' unip' : ''}${p.skewDeg ? ' skew' + p.skewDeg : ''}`, B: S.curve.B_mT, R: S.curve.R, sR: S.curve.sigmaR, R0: S.curve.metrics.R0, T: S.curve.T, G: S.curve.G}); if (S.held.length > 7) S.held.shift(); renderHeld(); drawRB(); });

  on('tbSRun', 'click', () => { readSweep(); if (u.sweep.log && (u.sweep.from <= 0 || u.sweep.to <= 0)) return toast('Log sweep needs positive limits'); runMode('sweep', {param: u.sweep.param, from: u.sweep.from, to: u.sweep.to, n: u.sweep.n, log: u.sweep.log ? 1 : 0}); setTab('sweep'); });

function currentParamValue(k) {
  const v = values();
  const map = {L_um: v.Ln_um, n_cm2: v.nN_cm2};
  return k in map ? map[k] : v[k];
}

const PHYS = CONTROLS.filter(c => ['geo','car','dis','edge','sc'].includes(c.g) && !c.local).map(c => c.k);
function stale(params) { if (!params) return ''; const v = values(); const diff = PHYS.filter(k => { const a = v[k], b = params[k]; return typeof a === 'string' ? a !== b : Math.abs(+a - +b) > 1e-6 * Math.max(1, Math.abs(+a)); }); return diff.length ? `  [settings changed since this run: ${diff.slice(0, 3).map(k => BY[k].l).join(', ')}${diff.length > 3 ? '…' : ''}]` : ''; }
function redrawActive() { ({rb: drawRB, fates: drawFates, sens: drawSens, sweep: drawSweep, grid: drawGrid, angular: drawAngular, coherent: drawCoherent})[S.tab]?.(); }
function redrawCurveTabs() { if (['rb','fates','sens'].includes(S.tab)) redrawActive(); }

function curveY(c, mode, i, R0) {
  if (mode === 'R') return c.R[i]; if (mode === 'RR0') return c.R[i] / R0; if (mode === 'G') return c.G[i] * 1e3; return c.T[i];
}
function drawRB() {
  const c = S.curve, u = S.ui, cols = SERIES(), series = [];
  const ylab = {R: 'R (Ω)', RR0: 'R / R0', G: 'G (mS)', T: 'T per mode'}[u.rbMode];
  S.held.forEach((h, i) => {
    const y = h.B.map((_, k) => u.rbMode === 'R' ? h.R[k] : u.rbMode === 'RR0' ? h.R[k] / h.R0 : u.rbMode === 'G' ? h.G[k] * 1e3 : h.T[k]);
    series.push({x: h.B, y, color: cols[(i + 1) % 8], label: h.label, width: 1.6, dash: [5, 3]});
  });
  if (c) {
    const R0 = c.metrics.R0;
    const y = c.B_mT.map((_, i) => curveY(c, u.rbMode, i, R0));
    let err = null;
    if (u.rbErr) err = c.B_mT.map((_, i) => u.rbMode === 'R' ? c.sigmaR[i] : u.rbMode === 'RR0' ? c.sigmaR[i] / R0 : u.rbMode === 'G' ? c.G[i] * 1e3 * c.sigmaR[i] / c.R[i] : c.sigmaT[i]);
    series.unshift({x: c.B_mT, y, err, color: cols[0], label: 'current', marker: c.B_mT.length <= 101 ? 3 : false});
    if (u.rbFit && (u.rbMode === 'R' || u.rbMode === 'RR0')) {
      const m = c.metrics, sc = u.rbMode === 'R' ? 1 : 1 / R0, xs = c.B_mT;
      const bmax = Math.max(...xs.map(Math.abs)), fw = (c.params.fitWindow_mT > 0 ? c.params.fitWindow_mT : bmax / 3);
      if (isFinite(m.aGlobal)) series.push({x: xs, y: xs.map(b => (m.R0global + m.aGlobal * (b * 1e-3) ** 2) * sc), color: css('--axis'), label: 'global even parabola', width: 1.4, dash: [2, 3], nohover: true});
      if (isFinite(m.aLocal)) { const xl = xs.filter(b => Math.abs(b) <= fw); series.push({x: xl, y: xl.map(b => (m.R0local + m.aLocal * (b * 1e-3) ** 2) * sc), color: cols[1], label: `local fit |B| ≤ ${fmt(fw, 3)} mT`, width: 2, nohover: true}); }
    }
  }
  const vl = c && isFinite(c.metrics.peakSlopeB_mT) ? [{x: c.metrics.peakSlopeB_mT, label: 'steepest'}] : [];
  drawChart($('cRB'), {series, xlabel: 'B (mT)', ylabel: ylab, title: c ? `R(B) — ${c.params.nCells} cells, ${c.params.engine === 'mc' ? Number(c.params.nTraj).toLocaleString('en') + ' trajectories' : 'flux engine'} per field${stale(c.params)}` : '', vlines: vl, empty: 'Press “Run R(B)” to compute the magnetoresistance.'});
}
function drawFates() {
  const c = S.curve, cols = SERIES();
  if (!c) { drawChart($('cT'), {series: [], empty: 'Run R(B) first.'}); drawChart($('cFate'), {series: []}); return; }
  drawChart($('cT'), {series: [{x: c.B_mT, y: c.T, err: c.sigmaT, color: cols[0], label: 'T per mode', marker: c.B_mT.length <= 101 ? 3 : false}], xlabel: 'B (mT)', ylabel: 'T per mode', title: 'Transmission per mode' + stale(c.params)});
  const v = S.ui.fatesView; let series, ylab;
  if (v === 'fates') { series = [{x: c.B_mT, y: c.T, color: cols[0], label: 'transmitted'}, {x: c.B_mT, y: c.reflected, color: cols[1], label: 'reflected'}, {x: c.B_mT, y: c.lost, color: cols[2], label: 'absorbed at edges'}, {x: c.B_mT, y: c.capped, color: cols[3], label: 'path cap'}]; ylab = 'fraction'; }
  else if (v === 'path') { series = [{x: c.B_mT, y: c.meanPath_um, color: cols[0], label: 'mean path'}]; ylab = 'mean path (µm)'; }
  else if (v === 'edge') { series = [{x: c.B_mT, y: c.edgeFrac, color: cols[0], label: 'touching an edge'}]; ylab = 'fraction of carriers'; }
  else { series = [{x: c.B_mT, y: c.meanCross, color: cols[0], label: 'crossings'}]; ylab = 'junction crossings / carrier'; }
  drawChart($('cFate'), {series, xlabel: 'B (mT)', ylabel: ylab});
}
function drawSens() {
  const c = S.curve, cols = SERIES();
  if (!c) { drawChart($('cSens'), {series: [], empty: 'Run R(B) first.'}); $('noiseTable').innerHTML = ''; return; }
  const m = c.metrics, s = c.dRdB.map(v => v / m.R0);
  drawChart($('cSens'), {series: [{x: c.B_mT, y: s, color: cols[0], label: '(dR/dB)/R0', marker: c.B_mT.length <= 101 ? 3 : false}], xlabel: 'B (mT)', ylabel: '(dR/dB)/R0 (1/T)', title: 'Normalised field sensitivity' + stale(c.params),
    hlines: [{y: 0}], vlines: isFinite(m.peakSlopeB_mT) ? [{x: m.peakSlopeB_mT, label: 'operating point'}] : []});
  const p = c.params, I = p.biasA_uA * 1e-6;
  const row = (a, b, t = '') => `<tr title="${t}"><th style="text-align:left">${a}</th><td>${b}</td></tr>`;
  const sq = v => isFinite(v) ? fmt(Math.sqrt(v) * 1e9, 4) + ' nV/√Hz' : '—';
  $('noiseTable').innerHTML = `<table>
    ${row('Operating point', `B = ${fmt(m.peakSlopeB_mT, 4)} mT, R = ${fmt(m.flankR, 4)} Ω, |dR/dB| = ${fmt(m.peakSlope, 4)} Ω/T`)}
    ${row('Bias', `I = ${p.biasA_uA} µA, V = ${fmt(I * m.flankR * 1e3, 4)} mV, P = ${fmt(I * I * m.flankR * 1e9, 4)} nW`)}
    ${row('Johnson √(4kTR)', sq(m.johnson), `T = ${p.noiseTempK > 0 ? p.noiseTempK : p.tempK} K`)}
    ${row('Shot √(2eIR²)', sq(m.shot))}
    ${row('Hooge 1/f', p.hooge > 0 ? sq(m.flicker) + ` at ${p.freqHz} Hz (N_c = ${fmt(c.carriers, 3)})` : 'off')}
    ${row('Total √S_V', sq(m.sv))}
    ${row('Flank field resolution', fmt(m.bMinFlank_nT, 4) + ' nT/√Hz', '√S_V / (I |dR/dB|)')}
    ${row('Vertex (parabolic) resolution', fmt(m.bMinVertex_nT, 4) + ' nT in 1 Hz', '√(δR/a)')}
    ${row('Dominant noise', isFinite(m.sv) ? ['Johnson','shot','1/f'][[m.johnson, m.shot, m.flicker || 0].indexOf(Math.max(m.johnson, m.shot, m.flicker || 0))] : '—')}
    ${row('Shot/Johnson crossover current', fmt(2 * 1.380649e-23 * p.noiseTempK / (1.602176634e-19 * m.flankR) * 1e6, 4) + ' µA', 'I* = 2kT/(eR)')}
  </table>`;
}

function metricOf(pt, k) { return pt && pt.curve && pt.curve.metrics ? pt.curve.metrics[k] : NaN; }
function drawSweep() {
  if (S.tab !== 'sweep') return;
  const sw = S.sweep, u = S.ui, cv = $('cSweep');
  const tableHost = $('sweepPane');
  let tbl = tableHost.querySelector('.htable');
  if (u.sweepView === 'table') {
    cv.style.display = 'none'; if (!tbl) { tbl = document.createElement('div'); tbl.className = 'htable'; tableHost.appendChild(tbl); } tbl.style.display = 'block';
    if (!sw) { tbl.innerHTML = '<p>No sweep yet.</p>'; return; }
    tbl.innerHTML = `<table><tr><th>${SWEEP_LABEL[sw.param] || sw.param}</th>${METRICS.map(m => `<th title="${m[3]}">${m[1]}</th>`).join('')}</tr>` +
      sw.xs.map((x, i) => `<tr><td>${fmt(x, 4)}</td>${METRICS.map(m => `<td>${fmt(metricOf(sw.pts[i], m[0]), 4)}</td>`).join('')}</tr>`).join('') + '</table>';
    return;
  }
  cv.style.display = ''; if (tbl) tbl.style.display = 'none';
  if (!sw) { drawChart(cv, {series: [], empty: 'Choose a parameter and press “Run sweep”.'}); return; }
  const lab = SWEEP_LABEL[sw.param] || sw.param;
  if (u.sweepView === 'family') {
    const n = sw.xs.length, series = [];
    sw.pts.forEach((p, i) => { if (!p) return; const c = p.curve; const R0 = c.metrics.R0; series.push({x: c.B_mT, y: c.R.map(r => r / R0), color: seqColor(n > 1 ? 0.15 + 0.85 * i / (n - 1) : 1), label: `${lab} = ${fmt(sw.xs[i], 4)}`, width: 1.8}); });
    drawChart(cv, {series, xlabel: 'B (mT)', ylabel: 'R / R0', title: `R(B)/R0 as ${lab} varies (light → dark = increasing)${stale(sw.base)}`, ylog: u.sweepLog});
  } else {
    const k = u.sweepMetric, xs = [], ys = [];
    sw.xs.forEach((x, i) => { const v = metricOf(sw.pts[i], k); if (sw.pts[i]) { xs.push(x); ys.push(v); } });
    drawChart(cv, {series: [{x: xs, y: ys, color: SERIES()[0], label: METRIC[k].label, marker: 4}], xlabel: lab, ylabel: METRIC[k].label, title: `${METRIC[k].label} vs ${lab}${stale(sw.base)}`, xlog: sw.cfg && sw.cfg.log, ylog: u.sweepLog});
  }
}

// grid / optimiser
function lengthsFor(base, k, v) {
  const o = Object.assign({}, base);
  if (k === 'L_um') { o.Ln_um = o.Lp_um = v; } else if (k === 'n_cm2') { o.nN_cm2 = o.nP_cm2 = v; } else o[k] = v;
  return o;
}
function gridEval() {
  const gr = S.grid; if (!gr) return null;
  const u = S.ui, k = u.gridMetric, goal = METRIC[k].goal, base = values();
  const z = [], mask = []; let best = null, bestV = goal === 'max' ? -Infinity : Infinity;
  gr.ys.forEach((y, j) => { z[j] = []; mask[j] = []; gr.xs.forEach((x, i) => {
    const pt = gr.pts[j] && gr.pts[j][i]; if (!pt) { z[j][i] = undefined; return; }
    const v = metricOf(pt, k); z[j][i] = v;
    const p = lengthsFor(lengthsFor(base, gr.param, x), gr.param2, y);
    const Lt = Math.ceil(p.nCells / 2) * p.Ln_um + Math.floor(p.nCells / 2) * p.Lp_um;
    const mfp = pt.curve.mfpEff_um; const T0 = metricOf(pt, 'T0');
    const bad = (u.t0Min > 0 && !(T0 >= u.t0Min)) || (u.lMax > 0 && Lt > u.lMax) || (u.ballMax > 0 && isFinite(mfp) && mfp > 0 && Lt / mfp > u.ballMax) || !isFinite(v);
    mask[j][i] = bad;
    if (!bad && (goal === 'max' ? v > bestV : v < bestV)) { bestV = v; best = [i, j]; }
  }); });
  return {z, mask, best, bestV};
}
function drawGrid() {
  if (S.tab !== 'grid') return;
  const gr = S.grid, u = S.ui;
  if (!gr) { drawHeat($('cGrid'), {empty: 'Choose two parameters and press “Run grid”. Hatched cells fail a constraint; the orange frame marks the best admissible device.'}); $('gridInfo').innerHTML = ''; return; }
  const ev = gridEval(), k = u.gridMetric;
  const done = gr.pts.reduce((a, r) => a + (r ? r.filter(Boolean).length : 0), 0), total = gr.xs.length * gr.ys.length;
  drawHeat($('cGrid'), {xs: gr.xs, ys: gr.ys, z: ev.z, mask: ev.mask, best: ev.best, zlog: u.gridLogZ, xlabel: SWEEP_LABEL[gr.param] || gr.param, ylabel: SWEEP_LABEL[gr.param2] || gr.param2,
    zlabel: METRIC[k].label, title: `${METRIC[k].label} (${METRIC[k].goal === 'min' ? 'lower' : 'higher'} is better) — ${done}/${total} devices${stale(gr.base)}`,
    extra: (i, j) => { const pt = gr.pts[j] && gr.pts[j][i]; if (!pt) return ''; const m = pt.curve.metrics; return `<br>T(0) ${fmt(m.T0, 3)} · R0 ${fmt(m.R0, 4)} Ω<br>peak sens ${fmt(m.peakSens, 4)} /T · B_min ${fmt(m.bMinFlank_nT, 3)} nT/√Hz`; }});
  let html = '';
  if (ev.best) {
    const [i, j] = ev.best, m = gr.pts[j][i].curve.metrics;
    html += `<table><tr><th style="text-align:left">Best admissible device</th><td>${SWEEP_LABEL[gr.param] || gr.param} = <b>${fmt(gr.xs[i], 4)}</b>, ${SWEEP_LABEL[gr.param2] || gr.param2} = <b>${fmt(gr.ys[j], 4)}</b></td></tr>` +
      METRICS.map(mm => `<tr title="${mm[3]}"><th style="text-align:left">${mm[1]}</th><td>${fmt(m[mm[0]], 4)}</td></tr>`).join('') + '</table>';
  } else html = '<p>No admissible device yet (all cells fail a constraint or are pending).</p>';
  html += `<p style="color:var(--muted)">Constraints: T(0) ≥ ${u.t0Min}${u.lMax > 0 ? `, L_tot ≤ ${u.lMax} µm` : ''}${u.ballMax > 0 ? `, L_tot/ℓ ≤ ${u.ballMax}` : ''}. Metrics carry Monte-Carlo noise: confirm the winner with a high-statistics R(B) run (“Apply best”, then raise trajectories).</p>`;
  $('gridInfo').innerHTML = html;
}
function applyBest() {
  const gr = S.grid, ev = gridEval(); if (!ev || !ev.best) return toast('No admissible best point');
  const [i, j] = ev.best; const set = {};
  for (const [k, v] of [[gr.param, gr.xs[i]], [gr.param2, gr.ys[j]]]) { if (k === 'L_um') { set.Ln_um = set.Lp_um = v; } else if (k === 'n_cm2') { set.nN_cm2 = set.nP_cm2 = v; } else set[k] = k === 'nCells' || k === 'disorderSeed' ? Math.round(v) : +(+v).toPrecision(6); }
  setValues(set); sync(); toast('Applied: ' + Object.entries(set).map(([k, v]) => `${k} = ${v}`).join(', '));
}
function refineGrid() {
  const gr = S.grid, ev = gridEval(); if (!ev || !ev.best) return toast('No admissible best point');
  const [i, j] = ev.best, g = S.ui.grid;
  const span = (arr, idx, log) => { const lo = arr[Math.max(0, idx - 1)], hi = arr[Math.min(arr.length - 1, idx + 1)]; return [lo, hi]; };
  const [a, b] = span(gr.xs, i), [c, d] = span(gr.ys, j);
  Object.assign(g, {from: +a.toPrecision(4), to: +b.toPrecision(4), from2: +c.toPrecision(4), to2: +d.toPrecision(4)});
  if (gr.param === 'nCells') { g.n = Math.min(40, Math.max(2, Math.round(b - a) + 1)); }
  buildToolbar();
  runMode('grid', {param: g.param, from: g.from, to: g.to, n: g.n, log: g.log ? 1 : 0, param2: g.param2, from2: g.from2, to2: g.to2, n2: g.n2, log2: g.log2 ? 1 : 0});
}

function drawAngular() {
  if (S.tab !== 'angular') return;
  const a = S.angular, u = S.ui, cols = SERIES();
  if (!a) { drawChart($('cAng'), {series: [], empty: 'Computing…'}); return; }
  const names = [['gate','gate electrostatic'],['linear','linear ramp'],['tanh','tanh'],['erf','erf'],['asymptotic','asymptotic formula']];
  const nJ = a.junctions;
  const series = names.map(([k, lab], i) => ({x: a.theta_deg, y: a.profiles[k].T.map(t => u.angSeries ? Math.pow(t, Math.max(1, nJ)) : t), color: cols[i], label: lab + (k === a.selected ? ' (selected)' : ''), width: k === a.selected ? 3 : 1.6, dash: k === 'asymptotic' ? [6, 3] : []}));
  drawChart($('cAng'), {series, xlabel: 'incidence angle θ (°)', ylabel: u.angSeries ? `T(θ)^${nJ}` : 'T(θ)', ylog: u.angLog, ylim: u.angLog ? [1e-6, 1.2] : [0, 1.05],
    title: `Single-junction transmission, k_F d = ${fmt(a.kFd, 3)}${u.angSeries ? ` — product over ${nJ} junctions (no refraction, no field)` : ''}`});
}
function drawCoherent() {
  if (S.tab !== 'coherent') return;
  const c = S.coherent, u = S.ui, cols = SERIES();
  if (!c) { drawChart($('cCoh'), {series: [], empty: 'Press “Run coherent calculation”. It computes the fully phase-coherent transmission of the whole junction train at B = 0 versus energy and compares it with the incoherent ray model.'}); $('cohTable').innerHTML = ''; return; }
  if (u.cohView === 'E') {
    drawChart($('cCoh'), {series: [{x: c.eps_meV, y: c.Tcoh, color: cols[0], label: 'coherent (phase kept)', width: 1.6}, {x: c.eps_meV, y: c.Tinc, color: cols[1], label: 'incoherent (ray model)', width: 2.2}],
      xlabel: 'E − E_F (meV)', ylabel: 'mode-averaged T', title: `Fabry–Pérot: ${c.params.nCells} cells, ${c.params.profile} profile, d = ${c.params.d_nm} nm${stale(c.params)}`});
  } else {
    const n = c.temps.length, series = c.temps.map((t, i) => ({x: c.eps_meV, y: c.smoothed[i].map(v => v === null ? NaN : v), color: seqColor(0.2 + 0.8 * (1 - i / Math.max(1, n - 1))), label: `${t} K`, width: 1.8}));
    series.push({x: c.eps_meV, y: c.Tinc, color: cols[1], label: 'incoherent', dash: [6, 3], width: 2});
    drawChart($('cCoh'), {series, xlabel: 'E − E_F (meV)', ylabel: 'thermally averaged T', title: 'Coherent T(E) convolved with −df/dE (dark = cold)' + stale(c.params)});
  }
  $('cohTable').innerHTML = `<table><tr><th>T (K)</th><th title="Peak-to-peak of (coherent / incoherent) after the same thermal smoothing: the oscillation only, without the smooth energy trend">FP visibility</th><th>coherent ⟨T⟩ at E_F</th><th>incoherent ⟨T⟩ at E_F</th><th>coherent/incoherent − 1</th></tr>` +
    c.temps.map((t, i) => `<tr><td>${t}</td><td>${isFinite(c.visibility[i]) && isFinite(c.thermalCoh[i]) ? fmt(100 * c.visibility[i], 3) + ' %' : '—'}</td><td>${fmt(c.thermalCoh[i], 4)}</td><td>${fmt(c.thermalInc[i], 4)}</td><td>${isFinite(c.thermalCoh[i]) ? fmt(100 * (c.thermalCoh[i] / c.thermalInc[i] - 1), 3) + ' %' : '—'}</td></tr>`).join('') +
    `</table><p style="color:var(--muted)">At E_F: coherent ${fmt(c.TcohEF, 4)}, incoherent ${fmt(c.TincEF, 4)}. Worst |T+R−1| ${fmt(Math.max(...c.worstUnit), 2)}. “—” means the thermal window does not fit inside ±${c.params.eRange_meV} meV; widen the energy range. ${fmt(c.ms / 1000, 3)} s.</p>`;
}

// =====================================================================
// 9. wiring
// =====================================================================
function pushTheme() { try { dex.send({t: 'theme', light: document.documentElement.dataset.theme !== 'dark' ? 1 : 0}); } catch (e) {} }
$('themeBtn').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('km.theme', r.dataset.theme); } catch (e) {} pushTheme(); renderHeld(); redrawActive(); };
try { const t = localStorage.getItem('km.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('runCurve').onclick = () => { runMode('curve'); if (!['rb','fates','sens'].includes(S.tab)) setTab('rb'); };
$('stopBtn').onclick = () => dex.send({t: 'stop'});
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('preset').onchange = e => { const k = e.target.value; if (!k) return; setValues(Object.assign(defaults(), PRESETS[k])); sync(); toast('Preset: ' + e.target.selectedOptions[0].text); e.target.value = ''; };
$('saveCfg').onclick = () => download(`klein-settings-${stamp()}.json`, JSON.stringify({kind: 'klein-magnetometer-settings', version: S.version, values: values(), ui: S.ui}, null, 2));
$('loadCfg').onclick = () => $('loadFile').click();
$('loadFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const o = JSON.parse(await f.text()); const v = o.values || o.params || o; setValues(Object.assign(defaults(), Object.fromEntries(Object.entries(v).filter(([k]) => BY[k])))); if (o.ui) Object.assign(S.ui, o.ui); buildToolbar(); sync(); toast('Settings loaded'); } catch (err) { toast('Could not read settings: ' + err.message); } e.target.value = ''; };
$('expJson').onclick = () => { if (!S.lastResult) return toast('Nothing computed yet'); download(`klein-${S.lastResult.t}-${stamp()}.json`, JSON.stringify(S.lastResult)); };
$('expCsv').onclick = () => {
  const c = S.curve; if (!c) return toast('Run R(B) first');
  const head = '# Klein Magnetometer Workbench core ' + c.params.version + '\n# ' + JSON.stringify(c.params) + '\nB_mT,T,sigmaT,R_ohm,sigmaR_ohm,G_S,dRdB_ohm_per_T,reflected,absorbed,capped,meanPath_um,edgeFrac,meanCross\n';
  download(`klein-curve-${stamp()}.csv`, head + c.B_mT.map((b, i) => [b, c.T[i], c.sigmaT[i], c.R[i], c.sigmaR[i], c.G[i], c.dRdB[i], c.reflected[i], c.lost[i], c.capped[i], c.meanPath_um[i], c.edgeFrac[i], c.meanCross[i]].join(',')).join('\n'), 'text/csv');
};
$('expSweepCsv').onclick = () => {
  const keys = METRICS.map(m => m[0]);
  if (S.sweep && (S.tab === 'sweep' || !S.grid)) {
    const sw = S.sweep; download(`klein-sweep-${sw.param}-${stamp()}.csv`, `# base ${JSON.stringify(S.derived && S.derived.params)}\n${sw.param},${keys.join(',')}\n` + sw.xs.map((x, i) => [x, ...keys.map(k => metricOf(sw.pts[i], k))].join(',')).join('\n'), 'text/csv');
  } else if (S.grid) {
    const gr = S.grid; const rows = []; gr.ys.forEach((y, j) => gr.xs.forEach((x, i) => rows.push([x, y, ...keys.map(k => metricOf(gr.pts[j] && gr.pts[j][i], k))].join(','))));
    download(`klein-grid-${gr.param}-${gr.param2}-${stamp()}.csv`, `# base ${JSON.stringify(S.derived && S.derived.params)}\n${gr.param},${gr.param2},${keys.join(',')}\n` + rows.join('\n'), 'text/csv');
  } else toast('No sweep or grid yet');
};
$('expPng').onclick = () => {
  const pane = $(PANES[S.tab]); const cv = S.tab === 'device' ? $('view') : pane.querySelector('canvas.chart');
  if (!cv) return; const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `klein-${S.tab}-${stamp()}.png`; a.click();
};
$('copyMethods').onclick = () => { navigator.clipboard.writeText($('methods').value).then(() => toast('Methods text copied'), () => { $('methods').select(); document.execCommand('copy'); toast('Methods text copied'); }); };
['cRB','cT','cFate','cSens','cSweep','cGrid','cAng','cCoh'].forEach(id => attachHover($(id)));
new ResizeObserver(() => redrawActive()).observe($('viewArea'));

buildControls(); buildToolbar(); renderHeld();
const qs = new URLSearchParams(location.search); if (qs.get('tab')) setTab(qs.get('tab'));

// hook for headless checks (gate G9): the spec, the payload and the last echo
window.__KM = {CONTROLS, payload, values, setValues, sync, S, setTab, runMode};
</script>
