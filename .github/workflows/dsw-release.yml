# Builds DSW and its plugins for Linux, macOS and Windows, and publishes
# ready-to-run downloads.
#
# A DSW plugin is native code, so there is no universal "plugin file" — each
# platform needs its own compiled core. This workflow produces, per platform:
#
#   dsw-<os>                  the host + web/ + every built-in plugin bundle,
#                             unzip and run; nothing to compile
#   dsw-plugins-<os>          just the bundles, to drop into the user plugin
#                             library (Documents/DSW Plugins)
#
# A tagged run additionally publishes these as .zip release assets, including
# one archive per individual plugin.
#
# Run it from the Actions tab (Run workflow), or push a tag like dsw-v1.0 to
# also attach the archives to a GitHub Release.
#
# Release builds set DSW_NATIVE_ARCH=OFF: -march=native would tune the binary
# for the runner's CPU and can fault on an older machine.

name: DSW release

on:
  workflow_dispatch:
  push:
    tags: ['dsw-v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            exe: dsw
          - os: macos-latest
            label: macos-arm64
            exe: dsw
          - os: windows-latest
            label: windows-x64
            exe: dsw.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Apple clang ships without OpenMP; without libomp the cores still
      # build and run, just single-threaded.
      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Configure
        run: >
          cmake -S dsw -B build
          -DCMAKE_BUILD_TYPE=Release
          -DDSW_NATIVE_ARCH=OFF
          ${{ runner.os == 'macOS' && '-DOpenMP_ROOT=$(brew --prefix libomp)' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # The build drops the host in dsw/ and each core into its own bundle
      # folder, so the tree is already laid out the way it ships.
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          out="stage/dsw"
          mkdir -p "$out"
          cp "dsw/${{ matrix.exe }}" "$out/"
          cp -R dsw/web "$out/web"
          cp dsw/README.md "$out/README.md"
          mkdir -p "$out/plugins"
          for d in dsw/plugins/*/; do
            id=$(basename "$d")
            # A bundle is dex.json + the compiled core + ui/ — never src/.
            mkdir -p "$out/plugins/$id"
            cp "$d/dex.json" "$out/plugins/$id/"
            cp -R "$d/ui" "$out/plugins/$id/ui"
            found=
            for ext in so dll dylib; do
              if [ -f "$d/$id.$ext" ]; then cp "$d/$id.$ext" "$out/plugins/$id/"; found=1; fi
            done
            if [ -z "$found" ]; then echo "no compiled core for $id"; exit 1; fi
          done
          ls -R stage | head -60

      # Compiling is not the same as working. Start the staged build and make
      # every plugin actually load and render a frame, on each platform, before
      # any of it is offered as a download.
      - name: Smoke test
        shell: bash
        working-directory: stage/dsw
        run: |
          set -euo pipefail
          ./${{ matrix.exe }} --port 8899 &
          host=$!
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8899/api/plugins >/dev/null 2>&1 && break
            sleep 0.5
          done
          set +e
          node "$GITHUB_WORKSPACE/dsw/tools/smoke.mjs" http://127.0.0.1:8899
          status=$?
          set -e
          kill $host 2>/dev/null || true
          exit $status

      # No zipping here: the Windows runner's bash has no `zip`, and
      # upload-artifact archives whatever it is given anyway. The release job
      # (Linux) makes the actual .zip files from these.
      - name: Upload workstation
        uses: actions/upload-artifact@v4
        with:
          name: dsw-${{ matrix.label }}
          path: stage/dsw
          retention-days: 30

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: dsw-plugins-${{ matrix.label }}
          path: stage/dsw/plugins
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/dsw-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art

      # Build the download archives here, where zip definitely exists.
      - name: Make archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for d in art/dsw-*/; do
            name=$(basename "$d")
            case "$name" in dsw-plugins-*) continue ;; esac
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" .)
          done
          for d in art/dsw-plugins-*/; do
            base=$(basename "$d")
            label=${base#dsw-plugins-}
            for b in "$d"*/; do
              id=$(basename "$b")
              (cd "$d" && zip -qr "$GITHUB_WORKSPACE/dist/dsw-plugin-$id-$label.zip" "$id")
            done
          done
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
